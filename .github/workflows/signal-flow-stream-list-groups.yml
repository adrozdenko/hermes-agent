name: Signal Flow stream-list-groups (Contabo)

# Safe list + name refresh after renames. NEVER stream-stop on miss
# (that previously disabled all 3 sinks when INSOMNIAC was hardcoded).
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: list-bot-groups on Contabo (no stop on miss)
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          INGPID=/tmp/sf-ingest-run.pid
          if [ -f "$INGPID" ]; then
            OLD=$(cat "$INGPID" 2>/dev/null || true)
            [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null && kill "$OLD" 2>/dev/null || true
          fi
          pkill -f 'sf-admin.* ingest-run' 2>/dev/null || true
          pkill -f 'signal-cli' 2>/dev/null || true
          sleep 2

          echo "=== stream-status (before) ==="
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli stream-status || true

          echo "=== list-bot-groups ==="
          set +e
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli list-bot-groups --json >/tmp/sf-lg-admin.json 2>/tmp/sf-lg-admin.err
          LIST_RC=$?
          set -e
          echo "LIST_RC=$LIST_RC"
          head -c 400 /tmp/sf-lg-admin.err 2>/dev/null | sed -E 's/\+?[0-9]{8,15}/[redacted]/g' || true

          PYTHONPATH="$APP" "$APP/.venv/bin/python" - <<'PY'
          import json, re, sys
          from pathlib import Path

          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.stream import (
              TARGET_KEYS,
              load_stream_state,
              save_stream_state,
              short_group_id,
          )

          root = Path("/opt/signal-flow")
          scrub = lambda s: re.sub(r"\+?\d{8,15}", "[redacted]", s or "")

          # Known post-rename display names (plus legacy) — match only, never stop.
          KNOWN_NAMES = {
              "default": {
                  "потік",
                  "insomniac",
              },
              "arta": {
                  "потік - вогонь",
                  "insomniac arta",
                  "insomniac — вогонь",
              },
              "air": {
                  "потік - повітря",
                  "insomniac air",
                  "insomniac — повітря",
              },
          }

          groups = []
          raw_path = Path("/tmp/sf-lg-admin.json")
          if raw_path.is_file() and raw_path.stat().st_size:
              try:
                  data = json.loads(raw_path.read_text(encoding="utf-8"))
                  if isinstance(data, list):
                      groups = data
                  elif isinstance(data, dict):
                      groups = data.get("groups") or data.get("result") or []
              except Exception as exc:
                  print("PARSE_ERR", scrub(str(exc))[:200])

          print("GROUP_COUNT", len(groups) if isinstance(groups, list) else 0)
          by_id = {}
          by_name = {}
          if isinstance(groups, list):
              for g in groups:
                  if not isinstance(g, dict):
                      continue
                  gid = str(g.get("id") or g.get("groupId") or "").strip()
                  name = str(g.get("name") or g.get("title") or "").strip()
                  if gid:
                      by_id[gid] = name
                  if name:
                      by_name[name.casefold()] = gid
                  print(
                      "GROUP",
                      scrub(repr(name)),
                      short_group_id(gid) if gid else "—",
                  )

          st = load_stream_state(root)
          changed = False
          for key in TARGET_KEYS:
              t = st["targets"][key]
              gid = str(t.get("group_id") or "").strip()
              gname = str(t.get("group_name") or "").strip()
              enabled = bool(t.get("enabled")) and bool(gid)
              print(
                  f"SINK {key} enabled={enabled} "
                  f"name={scrub(gname)!r} id_short={short_group_id(gid) if gid else '—'}"
              )
              if not gid:
                  if enabled:
                      print(f"WARN {key}: enabled but empty group_id — leaving as-is")
                  continue

              # Prefer match by existing group_id (rename-safe).
              if gid in by_id:
                  new_name = by_id[gid]
                  if new_name and new_name != gname:
                      print(f"REFRESH_NAME {key}: {scrub(gname)!r} → {scrub(new_name)!r}")
                      st["targets"][key]["group_name"] = new_name
                      changed = True
                  else:
                      print(f"OK {key}: id still present in listGroups")
                  continue

              # Fallback: known / current display names → same id only if found.
              candidates = set(KNOWN_NAMES.get(key, set()))
              if gname:
                  candidates.add(gname.casefold())
              hit_gid = None
              hit_name = None
              for cand in candidates:
                  if cand in by_name:
                      hit_gid = by_name[cand]
                      hit_name = by_id.get(hit_gid, cand)
                      break
              if hit_gid and hit_gid == gid:
                  print(f"OK {key}: matched by name, id unchanged")
                  if hit_name and hit_name != gname:
                      st["targets"][key]["group_name"] = hit_name
                      changed = True
              elif hit_gid and hit_gid != gid:
                  print(
                      f"WARN {key}: name matched different id_short="
                      f"{short_group_id(hit_gid)} — NOT rewriting "
                      f"(kept id_short={short_group_id(gid)}); no stream-stop"
                  )
              else:
                  print(
                      f"WARN {key}: group_id not in listGroups (miss/race/rename). "
                      f"Leaving sink enabled={enabled}; NO stream-stop"
                  )

          if changed:
              save_stream_state(root, st)
              print("STATE_SAVED=1")
          else:
              print("STATE_SAVED=0")
          print("NO_STREAM_STOP=1")
          PY

          echo "=== stream-status (after) ==="
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli stream-status || true

          nohup env PYTHONUNBUFFERED=1 "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli \
            ingest-run self --receive-timeout 8 --idle-sleep 1 \
            >/tmp/sf-ingest-run.log 2>&1 &
          echo $! >/tmp/sf-ingest-run.pid
          echo INGEST_RUN=restarted
          pkill -f 'sf-admin.*bot-run' 2>/dev/null || true
          echo BOT_RUN=stopped
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
