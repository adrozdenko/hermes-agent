name: Signal Flow flow-log diag9 (Contabo)

# Read-only scrubbed dig: last ~90 min matches + ingest log classes. No pkill.
# Never prints excerpt/body/phones/sgnl/SSH keys.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: scrubbed last-90min + ingest health
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          echo "=== ingest pid / procs ==="
          PIDFILE=/tmp/sf-ingest-run.pid
          if [ -f "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
            echo INGEST_RUN=alive pid=$(cat "$PIDFILE")
            ps -o pid,etime,cmd -p "$(cat "$PIDFILE")" 2>/dev/null | sed -E 's/\+?[0-9]{8,15}/[tel]/g' || true
          else
            echo INGEST_RUN=dead
          fi
          echo "bot_run=$( [ -f /tmp/sf-bot-run.pid ] && kill -0 "$(cat /tmp/sf-bot-run.pid)" 2>/dev/null && echo alive || echo stopped )"
          echo "signal_cli_n=$(pgrep -c -f 'signal-cli' 2>/dev/null || echo 0)"
          echo "=== stream-status ==="
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli stream-status || true
          PYTHONPATH="$APP" "$APP/.venv/bin/python" - <<'PY'
          import json, re, os
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import sys
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.ingest import resolve_ingest_user
          from sf.paths import channels_path, flow_log_dir, ingest_cursor_path, user_dir
          from sf.flows import ensure_default_flow
          from sf.stream import load_stream_state, stream_is_live

          def scrub(s: str) -> str:
              s = re.sub(r"\+?\d{8,15}", "[tel]", str(s or ""))
              s = re.sub(r"sgnl://\S+", "[sgnl]", s)
              s = re.sub(
                  r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
                  "[uuid]",
                  s,
              )
              return s

          def label_for(name: str) -> str:
              fold = (name or "").casefold()
              if "каменяр" in fold: return "kamenyari"
              if "альманах" in fold or "almanac" in fold: return "almanac"
              if "нейтрон" in fold or "neutron" in fold: return "neutron"
              if "блендер" in fold or "blender" in fold: return "blender"
              return "other"

          root = Path("/opt/signal-flow")
          sid, _ = resolve_ingest_user(root, "self")
          flow = ensure_default_flow(root, sid)
          sinks = (flow.get("sinks") or {})
          print("=== FLOW ===")
          print("flow_enabled", bool(flow.get("enabled")))
          print("sources_n", len(list(flow.get("sources") or [])))
          print("units_n", len(list((flow.get("filters") or {}).get("units") or [])))
          print("sink_bot_group", sinks.get("bot_group", True))
          print("sink_jsonl", sinks.get("jsonl", True))
          print("sink_dm", sinks.get("dm", sinks.get("bot_dm")))

          st = load_stream_state(root)
          print("=== STREAM ===")
          print("stream_live", stream_is_live(st), "updated", st.get("updated_at"))
          for k in ("default", "arta", "air"):
              t = (st.get("targets") or {}).get(k) or {}
              print(f"sink_{k}", "en=", bool(t.get("enabled")), "gid_len=", len(str(t.get("group_id") or "")), "name_set=", bool(t.get("group_name")))

          # cursor meta only
          cur_p = ingest_cursor_path(root, sid)
          if cur_p.is_file():
              try:
                  cur = json.loads(cur_p.read_text(encoding="utf-8"))
              except Exception as exc:
                  print("cursor_err", type(exc).__name__)
                  cur = {}
              seen = cur.get("seen") or {}
              print("cursor_updated", cur.get("updated_at"), "seen_n", len(seen) if isinstance(seen, dict) else "?")
          else:
              print("cursor_missing")

          label_of = {}
          try:
              ch = json.loads(channels_path(root, sid).read_text(encoding="utf-8"))
              for row in (ch.get("signal") or []):
                  if isinstance(row, dict) and row.get("key"):
                      label_of[str(row["key"])] = label_for(str(row.get("name") or ""))
          except Exception as exc:
              print("channels_err", type(exc).__name__)

          now = datetime.now(timezone.utc)
          # last 90 min + also cover ~22:40Z Kyiv 01:40? User said last card ~27 min before 00:06 Kyiv
          # 00:06 Kyiv = 21:06Z; 27 min earlier ~20:39Z. Window: 19:30Z..now (~90-100 min)
          cut = now - timedelta(minutes=90)
          days = {now.strftime("%Y-%m-%d"), cut.strftime("%Y-%m-%d")}
          rows = []
          for day in sorted(days):
              log = flow_log_dir(root, sid) / f"{day}.jsonl"
              print("log", day, "exists", log.is_file(), "bytes", log.stat().st_size if log.is_file() else 0)
              if not log.is_file():
                  continue
              with log.open(encoding="utf-8", errors="replace") as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          r = json.loads(line)
                      except Exception:
                          continue
                      la = str(r.get("logged_at") or "")
                      # parse ISO
                      try:
                          ts = datetime.fromisoformat(la.replace("Z", "+00:00"))
                          if ts.tzinfo is None:
                              ts = ts.replace(tzinfo=timezone.utc)
                      except Exception:
                          continue
                      if ts < cut:
                          continue
                      sk = str(r.get("source_key") or "")
                      lab = label_of.get(sk, "unk")
                      gt = r.get("group_targets")
                      skipped = r.get("skipped_sinks")
                      rs = r.get("reasons") or []
                      rs_s = [str(x)[:60] for x in (rs[:4] if isinstance(rs, list) else [])]
                      rows.append({
                          "t": la[11:19] if len(la) >= 19 else la,
                          "lab": lab,
                          "group_targets": gt,
                          "skipped": skipped,
                          "fp": bool(r.get("dedup_fingerprint") or r.get("fingerprint_suppressed")),
                          "group_failed": bool(r.get("group_failed")),
                          "reasons_n": len(rs_s),
                          "reason_has_unit": any("частини" in x or "ключові" in x for x in rs_s),
                          "excerpt_len": len(str(r.get("excerpt") or "")),
                      })

          print("=== LAST_90MIN FLOW-LOG (matches only) ===")
          print("match_rows", len(rows))
          print("by_label", dict(Counter(m["lab"] for m in rows)))
          print("by_target", dict(Counter(str(t) for m in rows for t in (m.get("group_targets") or ["(none)"]))))
          print("skip_classes", dict(Counter(
              str(s).split(":")[0] for m in rows for s in (m.get("skipped") or [])
          )))
          print("fp_n", sum(1 for m in rows if m["fp"]))
          print("group_failed_n", sum(1 for m in rows if m["group_failed"]))
          print("no_group_targets_n", sum(1 for m in rows if not m.get("group_targets")))
          print("--- last 25 meta (no excerpt) ---")
          for m in rows[-25:]:
              print({k: m[k] for k in ("t","lab","group_targets","skipped","fp","group_failed","reason_has_unit","excerpt_len")})

          # hourly buckets in window
          buckets = Counter()
          for m in rows:
              buckets[m["t"][:4] + "0"] += 1  # 10-min bucket approx via HH:M0
          print("ten_min_buckets", dict(sorted(buckets.items())))

          print("=== INGEST LOG SCRUBBED CLASSES ===")
          logp = Path("/tmp/sf-ingest-run.log")
          print("ingest_log_bytes", logp.stat().st_size if logp.is_file() else 0)
          cls = Counter()
          recent_interesting = []
          sent = Counter()
          err = Counter()
          recv_lines = 0
          if logp.is_file():
              # only last ~4000 lines for speed
              lines = logp.read_text(errors="replace").splitlines()
              print("ingest_log_lines", len(lines))
              for ln in lines[-4000:]:
                  s = scrub(ln)
                  low = s.casefold()
                  if "group_sent:" in s:
                      m = re.search(r"group_sent:(\w+)", s)
                      if m: sent[m.group(1)] += 1
                      cls["group_sent"] += 1
                  if "group_error:" in s:
                      m = re.search(r"group_error:(\w+)", s)
                      sink = m.group(1) if m else "?"
                      if "expected one argument" in s or "usage: signal-cli send" in s:
                          kind = "bad_m_arg"
                      elif "LockedException" in s or "Config file is in use" in s:
                          kind = "locked"
                      elif "Invalid group id" in s or "base64" in low:
                          kind = "bad_group_id"
                      elif "Unauthorized" in s:
                          kind = "unauthorized"
                      elif "порожн" in low or "empty" in low:
                          kind = "empty_body"
                      else:
                          kind = "other"
                      err[f"{sink}:{kind}"] += 1
                      cls["group_error"] += 1
                  if "receive failed" in low or "ingesterror" in low:
                      cls["receive_error"] += 1
                  if "traceback" in low:
                      cls["traceback"] += 1
                  if "lockedexception" in low or "config file is in use" in low:
                      cls["lock"] += 1
                  if "fp_suppress" in s:
                      cls["fp_suppress"] += 1
                  if "matched=" in s or "matched:" in low:
                      cls["matched_stat"] += 1
                  if "received=" in s or "received:" in low:
                      cls["received_stat"] += 1
                      recv_lines += 1
                  if "idle" in low:
                      cls["idle_mention"] += 1
                  if any(x in low for x in ("group_error", "group_sent", "receive failed", "traceback", "lockedexception", "fp_suppress", "ingest-run", "matched=", "received=")):
                      if len(s) > 220:
                          s = s[:220] + "…"
                      recent_interesting.append(s)
          print("class_counts", dict(cls))
          print("group_sent_by_sink", dict(sent))
          print("group_err_classes", dict(err))
          print("--- last 40 interesting ingest lines ---")
          for ln in recent_interesting[-40:]:
              print(ln)
          # mtime relative
          if logp.is_file():
              import time
              age = time.time() - logp.stat().st_mtime
              print("ingest_log_mtime_age_s", int(age))
          print("DIAG9_DONE")
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
