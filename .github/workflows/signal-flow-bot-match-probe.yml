name: Signal Flow bot-match-probe (Contabo)

# Counts on bot-signal receive only. No bodies.
on:
  workflow_dispatch:
    inputs:
      keyword:
        required: false
        default: "SFTOKEN"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Count bot-signal match shapes
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          KEYWORD: ${{ inputs.keyword || 'SFTOKEN' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 \
            "KEYWORD=$(printf %q "$KEYWORD") bash -s" <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          PIDFILE=/tmp/sf-bot-run.pid
          if [ -f "$PIDFILE" ]; then
            OLD=$(cat "$PIDFILE" 2>/dev/null || true)
            [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null && kill "$OLD" 2>/dev/null || true
          fi
          pkill -f 'sf-admin.*bot-run' 2>/dev/null || true
          pkill -f 'signal-cli' 2>/dev/null || true
          sleep 2
          export PYTHONUNBUFFERED=1
          "$APP/.venv/bin/python" -u - <<'PY'
          import os, re, subprocess, sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.bot_link import signal_cli_bin
          from sf.flow_match import match_flow, message_source_key, parse_receive_line
          from sf.flows import ensure_default_flow
          from sf.ingest import read_session_account, resolve_ingest_user
          from sf.paths import bot_signal_dir
          from sf.templates import CHAT_SELF_KEY

          root = Path("/opt/signal-flow")
          keyword = (os.environ.get("KEYWORD") or "SFTOKEN").strip() or "SFTOKEN"
          signal_id, _ = resolve_ingest_user(root, "self")
          flow = ensure_default_flow(root, signal_id)
          bot = bot_signal_dir(root)
          account = read_session_account(bot) or ""
          bin_path = signal_cli_bin()
          print("bot_account_len=", len(account), flush=True)
          proc = subprocess.run(
              [bin_path, "-a", account, "--config", str(bot), "-o", "json", "receive", "-t", "10"],
              capture_output=True, text=True, timeout=45, start_new_session=True,
          )
          print("receive_rc=", proc.returncode, flush=True)
          events = []
          for line in (proc.stdout or "").splitlines():
              events.extend(parse_receive_line(line))
          print("received=", len(events), flush=True)
          sources = Counter()
          note_self = kw_hits = match_ok = 0
          for msg in events:
              sk = str(msg.get("source_key") or message_source_key(msg))
              sources[sk] += 1
              if msg.get("note_to_self") or sk == CHAT_SELF_KEY:
                  note_self += 1
              text = str(msg.get("text") or "")
              if keyword.lower() in text.lower():
                  kw_hits += 1
              ok, _ = match_flow(flow, msg)
              if ok:
                  match_ok += 1
          print("note_to_self_n=", note_self, "keyword_hits=", kw_hits, "match_flow_ok=", match_ok, flush=True)
          for sk, n in sources.most_common(12):
              safe = re.sub(r"\+?\d{8,15}", "[redacted]", sk)
              safe = re.sub(r"[0-9a-fA-F]{16,}", lambda m: m.group(0)[:6]+"…", safe)
              print(f"source={safe} n={n}", flush=True)
          err = re.sub(r"\+?\d{8,15}", "[redacted]", (proc.stderr or "").strip())[-200:]
          if err:
              print("stderr=", err, flush=True)
          print("PROBE_DONE", flush=True)
          PY
          nohup env PYTHONUNBUFFERED=1 "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli bot-run \
            >/tmp/sf-bot-run.log 2>&1 &
          echo $! >/tmp/sf-bot-run.pid
          echo BOT_RUN=restarted
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
