name: Recover Contabo (restart loop)

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Stabilize Contabo hermes
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
              -o TCPKeepAlive=yes -o ConnectTimeout=30 \
              -i ~/.ssh/id_ed25519 root@5.189.159.195 bash -s <<'REMOTE'
          set -uo pipefail

          echo "================ INSPECT ================"
          docker ps -a --filter name=hermes --format 'table {{.Names}}\t{{.Status}}\t{{.RunningFor}}'
          docker inspect -f 'RestartCount={{.RestartCount}} Exit={{.State.ExitCode}} Cmd={{json .Config.Cmd}}' hermes || true
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' hermes 2>/dev/null | grep -E 'HERMES_ROLE|HERMES_GATEWAY|SUPERVISE|WATCHDOG' || true

          VOL=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/opt/data"}}{{.Source}}{{end}}{{end}}' hermes 2>/dev/null || true)
          [ -n "$VOL" ] || VOL=/opt/hermes/data
          echo "volume=$VOL"

          echo "================ QUARANTINE ================"
          mkdir -p "$VOL/profiles/_quarantine"
          if [ -d "$VOL/profiles/.jam-migrated-20260713" ]; then
            mv "$VOL/profiles/.jam-migrated-20260713" \
               "$VOL/profiles/_quarantine/.jam-migrated-20260713.$(date +%s)"
            echo "quarantined .jam-migrated-20260713"
          else
            echo "tombstone already gone"
          fi

          echo "================ RECREATE gateway CMD=sleep infinity ================"
          docker stop hermes-dashboard 2>/dev/null || true
          docker stop hermes 2>/dev/null || true

          if [ ! -f /opt/hermes/docker-compose.yml ]; then
            echo "FATAL: missing /opt/hermes/docker-compose.yml"
            exit 1
          fi
          COMPOSE_FILES="-f /opt/hermes/docker-compose.yml"
          if [ -f /opt/hermes/app/docker-compose.prod.yml ]; then
            COMPOSE_FILES="$COMPOSE_FILES -f /opt/hermes/app/docker-compose.prod.yml"
          fi
          cat > /tmp/hermes-sleep-cmd.yml <<'YML'
          services:
            gateway:
              command: ["sleep", "infinity"]
          YML
          # strip leading spaces from heredoc for valid compose YAML
          sed -i 's/^          //' /tmp/hermes-sleep-cmd.yml
          COMPOSE_FILES="$COMPOSE_FILES -f /tmp/hermes-sleep-cmd.yml"
          echo "compose files: $COMPOSE_FILES"
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES up -d gateway

          probe() {
            docker exec hermes sh -c \
              'curl -fsS -m 5 -o /dev/null http://127.0.0.1:11435/health 2>/dev/null \
                 || wget -q -T 5 -O /dev/null http://127.0.0.1:11435/health 2>/dev/null' \
              2>/dev/null
          }

          ok=""
          stable=0
          last_started=""
          for i in $(seq 1 90); do
            running=$(docker inspect -f '{{.State.Running}}' hermes 2>/dev/null || echo false)
            restarting=$(docker inspect -f '{{.State.Restarting}}' hermes 2>/dev/null || echo false)
            started=$(docker inspect -f '{{.State.StartedAt}}' hermes 2>/dev/null || true)
            rc=$(docker inspect -f '{{.RestartCount}}' hermes 2>/dev/null || echo '?')
            if [ -n "$last_started" ] && [ "$started" != "$last_started" ]; then
              echo "recover: WARN restarted (old=$last_started new=$started rc=$rc)"
              stable=0
            fi
            last_started="$started"
            if [ "$running" = "true" ] && [ "$restarting" = "false" ] && probe; then
              stable=$((stable + 1))
              echo "recover: health OK streak=$stable/18 rc=$rc (attempt $i)"
              if [ "$stable" -ge 18 ]; then
                ok=1
                break
              fi
            else
              stable=0
              last=$(docker logs --tail 1 hermes 2>&1 | tr -d '\r' || true)
              echo "recover: waiting (attempt $i running=$running restarting=$restarting rc=$rc) [$last]"
            fi
            sleep 5
          done

          if [ -z "$ok" ]; then
            echo "recover: FAILED"
            docker ps -a --filter name=hermes
            docker logs --tail 150 hermes 2>&1 || true
            docker inspect -f 'Cmd={{json .Config.Cmd}} RestartCount={{.RestartCount}}' hermes
            exit 1
          fi

          docker start hermes-dashboard 2>/dev/null || true
          sleep 20
          if ! probe; then
            echo "recover: dashboard hurt gateway — leaving dashboard stopped"
            docker stop hermes-dashboard 2>/dev/null || true
          fi

          echo "================ AFTER ================"
          docker ps -a --filter name=hermes --format 'table {{.Names}}\t{{.Status}}\t{{.RunningFor}}'
          docker inspect -f 'Cmd={{json .Config.Cmd}} RestartCount={{.RestartCount}}' hermes
          docker exec hermes sh -c 'curl -fsS -m 5 http://127.0.0.1:11435/health' 2>&1 | head -c 400
          echo
          docker exec hermes sh -c 'ps -eo pid,args | grep -iE "gateway run|claude_proxy|sleep infinity" | grep -v grep' 2>&1 || true
          echo "recover: done"
          REMOTE
