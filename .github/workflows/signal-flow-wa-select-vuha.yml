name: Signal Flow wa-select Вуха 66 (Contabo)

# Thin wrapper around generic select_whatsapp_channel for «Вуха 66🦉».
# Prefer signal-flow-wa-select.yml for new chats (inputs: user_id, opaque_key, name, kind, alias_keys).
# Almanac-style: channels.json whatsapp[] + sources + channels_include.
# M2: optional opaque alias_keys (@g.us/@lid twins) — never raw JIDs in logs.
# Does NOT kill ingest-run. Opaque key only (no phones/JIDs in logs).
# Almanac units gate stays untouched.
on:
  workflow_dispatch:
    inputs:
      alias_keys:
        description: "Optional opaque twin keys (comma-separated whatsapp:h_… only)"
        required: false
        default: ""

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Patch channels + flow for Вуха 66
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          ALIAS_KEYS_IN: ${{ inputs.alias_keys }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          # Ship opaque aliases only (whatsapp:h_…) — never JIDs — as a temp env.
          ALIAS_CLEAN=$(printf '%s' "${ALIAS_KEYS_IN:-}" | tr ',' '\n' | sed '/^$/d' | grep -E '^whatsapp:h_[0-9a-f]+$' || true)
          ALIAS_CSV=$(printf '%s' "$ALIAS_CLEAN" | paste -sd, - || true)
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 "ALIAS_KEYS_IN=$(printf '%q' "$ALIAS_CSV") bash -s" <<'REMOTE'
          set -euo pipefail
          export PYTHONUNBUFFERED=1
          /opt/signal-flow/app/.venv/bin/python -u - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.ingest import resolve_ingest_user
          from sf.whatsapp_channels import WhatsAppChannelError, select_whatsapp_channel

          VUHA_KEY = "whatsapp:h_7526e74533f40609390c"
          VUHA_NAME = "Вуха 66🦉"
          VUHA_KIND = "group"

          aliases = [
              p.strip()
              for p in os.environ.get("ALIAS_KEYS_IN", "").split(",")
              if p.strip().startswith("whatsapp:h_")
          ]

          root = Path("/opt/signal-flow")
          signal_id, _ = resolve_ingest_user(root, "self")
          try:
              result = select_whatsapp_channel(
                  root,
                  signal_id,
                  opaque_key=VUHA_KEY,
                  name=VUHA_NAME,
                  kind=VUHA_KIND,
                  alias_keys=aliases or None,
              )
          except WhatsAppChannelError as exc:
              print(f"error: {exc}", flush=True)
              raise SystemExit(1)
          print(f"vuha_key={result['key']}", flush=True)
          print(f"vuha_name={result['name']}", flush=True)
          print(f"alias_keys_n={len(result.get('alias_keys') or [])}", flush=True)
          print(f"sources_n={result['sources_n']}", flush=True)
          print(f"channels_include_n={result['channels_include_n']}", flush=True)
          print(f"units_n={result['units_n']}", flush=True)
          print(f"has_vuha_source=True", flush=True)
          print(f"has_vuha_include=True", flush=True)
          print("SELECT_OK", flush=True)
          PY
          PIDFILE=/tmp/sf-ingest-run.pid
          if [ -f "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
            echo INGEST_RUN=alive pid=$(cat "$PIDFILE")
          else
            echo INGEST_RUN=not_running
          fi
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
