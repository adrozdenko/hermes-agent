name: Signal Flow wa-select Вуха 66 (Contabo)

# Almanac-style: channels.json whatsapp[] + sources + channels_include.
# Does NOT kill ingest-run. Opaque key only (no phones/JIDs in logs).
on:
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Patch channels + flow for Вуха 66
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PYTHONUNBUFFERED=1
          /opt/signal-flow/app/.venv/bin/python -u - <<'PY'
          import json, sys
          from pathlib import Path
          from datetime import datetime, timezone
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.flows import load_default_flow, save_default_flow, ensure_channels
          from sf.ingest import resolve_ingest_user
          from sf.paths import channels_path

          VUHA_KEY = "whatsapp:h_7526e74533f40609390c"
          VUHA_NAME = "Вуха 66🦉"
          VUHA_KIND = "group"

          root = Path("/opt/signal-flow")
          signal_id, _ = resolve_ingest_user(root, "self")
          data = ensure_channels(root, signal_id)
          wa = data.get("whatsapp")
          if not isinstance(wa, list):
              wa = []
              data["whatsapp"] = wa
          found = False
          for row in wa:
              if isinstance(row, dict) and str(row.get("key") or "").strip() == VUHA_KEY:
                  row["name"] = VUHA_NAME
                  row["kind"] = VUHA_KIND
                  found = True
                  break
          if not found:
              wa.append({"key": VUHA_KEY, "name": VUHA_NAME, "kind": VUHA_KIND})
          data["updated_at"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          path = channels_path(root, signal_id)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"channels_whatsapp_n={len(wa)}", flush=True)
          print(f"vuha_key={VUHA_KEY}", flush=True)
          print(f"vuha_name={VUHA_NAME}", flush=True)

          flow = load_default_flow(root, signal_id)
          sources = [str(x) for x in (flow.get("sources") or []) if str(x).strip()]
          if VUHA_KEY not in sources:
              sources.append(VUHA_KEY)
          flow["sources"] = sources
          if not isinstance(flow.get("filters"), dict):
              flow["filters"] = {}
          ch_inc = [str(x) for x in (flow["filters"].get("channels_include") or []) if str(x).strip()]
          if VUHA_KEY not in ch_inc:
              ch_inc.append(VUHA_KEY)
          flow["filters"]["channels_include"] = ch_inc
          # Do NOT set blender admit — Almanac units gate stays
          save_default_flow(root, signal_id, flow)
          f = flow.get("filters") or {}
          print(f"sources_n={len(flow.get('sources') or [])}", flush=True)
          print(f"channels_include_n={len(f.get('channels_include') or [])}", flush=True)
          print(f"units_n={len(f.get('units') or [])}", flush=True)
          print(f"has_vuha_source={VUHA_KEY in (flow.get('sources') or [])}", flush=True)
          print(f"has_vuha_include={VUHA_KEY in ch_inc}", flush=True)
          print("SELECT_OK", flush=True)
          PY
          PIDFILE=/tmp/sf-ingest-run.pid
          if [ -f "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
            echo INGEST_RUN=alive pid=$(cat "$PIDFILE")
          else
            echo INGEST_RUN=not_running
          fi
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
