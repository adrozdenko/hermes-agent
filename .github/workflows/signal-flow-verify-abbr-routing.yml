name: Signal Flow verify abbr routing (Contabo)

# Read-only: confirm unit-abbr classify + units list + process pins.
# Does NOT start/stop bot-run or ingest-run.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify abbr routing on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          echo "=== processes ==="
          if [ -f /tmp/sf-ingest-run.pid ] && kill -0 "$(cat /tmp/sf-ingest-run.pid)" 2>/dev/null; then
            echo INGEST_RUN=alive pid=$(cat /tmp/sf-ingest-run.pid)
          else
            echo INGEST_RUN=not_running
          fi
          if [ -f /tmp/sf-bot-run.pid ] && kill -0 "$(cat /tmp/sf-bot-run.pid)" 2>/dev/null; then
            echo BOT_RUN=alive pid=$(cat /tmp/sf-bot-run.pid)
          else
            echo BOT_RUN=stopped
          fi
          echo "=== stream-status ==="
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli stream-status || true
          echo "=== units + classify_stream_targets ==="
          export PYTHONUNBUFFERED=1
          "$APP/.venv/bin/python" -u - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.flows import load_default_flow
          from sf.ingest import resolve_ingest_user
          from sf.topics import classify_stream_targets
          from sf.units import extract_units

          root = Path("/opt/signal-flow")
          signal_id, _ = resolve_ingest_user(root, "self")
          flow = load_default_flow(root, signal_id)
          units = list((flow.get("filters") or {}).get("units") or [])
          print("flow_name=", flow.get("name"), flush=True)
          print("units_n=", len(units), flush=True)
          print("units=", "|".join(units), flush=True)
          print("has_classify_stream_targets=", callable(classify_stream_targets), flush=True)

          cases = [
              ("856 сап 144 мсд 20 ЗА", "arta"),
              ("гадн 254 мсп 144 мсд 20 ЗА", "arta"),
              ("71 опБпС", "air"),
              ("71 опббс", "air"),
              ("3 бБпС", "air"),
              ("4 оббпс", "air"),
              ("254 мсп на позиції", ""),
              ("254 мсп — мінометна батарея", "arta"),
              ("зрбатр 254 мсп", ""),
          ]
          ok = True
          for text, expect in cases:
              hits = classify_stream_targets(text, units=extract_units(text))
              got = ",".join(sorted(hits))
              want = expect
              status = "OK" if got == want else "FAIL"
              if status == "FAIL":
                  ok = False
              print(f"case={status} expect={want!r} got={got!r} text={text!r}", flush=True)
          print("VERIFY_OK" if ok else "VERIFY_FAIL", flush=True)
          if not ok:
              raise SystemExit(1)
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
