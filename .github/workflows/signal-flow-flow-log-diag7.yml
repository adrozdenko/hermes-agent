name: Signal Flow flow-log diag7 (Contabo)

# Scrubbed: 21:10–21:20 Kyiv (=18:10–18:20Z) fire-control / empty-unit dig.
# Never prints excerpt/body/phones/sgnl.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: scrubbed 1810-1820Z fire-control dig
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          PYTHONPATH=/opt/signal-flow/app /opt/signal-flow/app/.venv/bin/python - <<'PY'
          import json, re, sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.ingest import resolve_ingest_user
          from sf.paths import user_dir, channels_path, flow_log_dir
          from sf.units import extract_units
          from sf.topics import classify_topics, classify_stream_targets
          from sf.flows import ensure_default_flow
          from sf.flow_match import match_flow, normalize_text

          def label_for(name: str) -> str:
              fold = (name or "").casefold()
              if "каменяр" in fold: return "kamenyari"
              if "альманах" in fold or "almanac" in fold: return "almanac"
              if "нейтрон" in fold or "neutron" in fold: return "neutron"
              if "блендер" in fold or "blender" in fold: return "blender"
              return "other"

          # Fire-control markers (presence only; never print excerpt)
          FC_SIGHT = ("прицел", "угломер", "угломір", "уровень", "рівень")
          FC_FIRE = ("огонь", "навестись", "навестися", "расчет в укрытие", "розрахунок в укриття", "в укрытие", "в укриття")
          FC_TAG = ("дорозвідка", "доразведка", "нв підрозділ", "нв подраздел", "укх")
          FC_FREQ = ("147.375", "147,375")

          def flags(ex: str) -> dict:
              low = normalize_text(ex)
              sight = [t for t in FC_SIGHT if t in low]
              fire = [t for t in FC_FIRE if t in low]
              tag = [t for t in FC_TAG if t in low]
              freq = [t for t in FC_FREQ if t in low.replace(",", ".")]
              return {
                  "sight_n": len(sight),
                  "fire_n": len(fire),
                  "tag_n": len(tag),
                  "freq_n": len(freq),
                  "fc_combo": bool(sight and fire),
                  "any_fc": bool(sight or fire or tag or freq),
              }

          root = Path("/opt/signal-flow")
          sid, _ = resolve_ingest_user(root, "self")
          flow = ensure_default_flow(root, sid)
          f = flow.get("filters") or {}
          units_sel = list(f.get("units") or [])
          sources = list(flow.get("sources") or [])
          print("flow_enabled", bool(flow.get("enabled")))
          print("sources_n", len(sources))
          print("units_sel_n", len(units_sel))
          print("units_sel_sample", [str(u)[:40] for u in units_sel[:12]])

          label_of = {}
          try:
              ch = json.loads(channels_path(root, sid).read_text(encoding="utf-8"))
              for row in (ch.get("signal") or []):
                  if isinstance(row, dict) and row.get("key"):
                      label_of[str(row["key"])] = label_for(str(row.get("name") or ""))
          except Exception as exc:
              print("channels_err", type(exc).__name__)
          print("channel_labels", sorted(set(label_of.values())), "n", len(label_of))

          log = flow_log_dir(root, sid) / "2026-09-25.jsonl"
          print("log_exists", log.is_file(), "bytes", log.stat().st_size if log.is_file() else 0)

          # Window: 21:10-21:20 Kyiv = 18:10-18:20 UTC (logged_at is UTC ISO)
          win_lo, win_hi = "18:10", "18:20"
          win_rows = []
          day_fc = []
          if log.is_file():
              with log.open(encoding="utf-8", errors="replace") as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          r = json.loads(line)
                      except Exception:
                          continue
                      la = str(r.get("logged_at") or "")
                      if not la.startswith("2026-09-25T"):
                          continue
                      hhmm = la[11:16] if len(la) >= 16 else ""
                      ex = str(r.get("excerpt") or "")
                      fl = flags(ex)
                      sk = str(r.get("source_key") or "")
                      lab = label_of.get(sk, "unk")
                      units = extract_units(ex)
                      topics = sorted(classify_topics(ex))
                      targets_cls = sorted(classify_stream_targets(ex, units=units))
                      rs = r.get("reasons") or []
                      meta = {
                          "t": la[11:19] if len(la) >= 19 else la,
                          "lab": lab,
                          "src_in_flow": sk in sources if sources else None,
                          "reasons": [str(x)[:80] for x in (rs[:4] if isinstance(rs, list) else [])],
                          "group_targets": r.get("group_targets"),
                          "skipped": r.get("skipped_sinks"),
                          "units_n": len(units),
                          "units_empty": len(units) == 0,
                          "topics": topics,
                          "targets_cls": targets_cls,
                          **fl,
                          "excerpt_len": len(ex),
                      }
                      # never attach excerpt
                      if fl["any_fc"] or fl["fc_combo"]:
                          day_fc.append(meta)
                      if hhmm >= win_lo and hhmm <= win_hi:
                          win_rows.append(meta)

          print("=== WINDOW 18:10-18:20Z (==21:10-21:20 Kyiv) ===")
          print("window_rows", len(win_rows))
          print("window_by_label", dict(Counter(m["lab"] for m in win_rows)))
          print("window_by_target", dict(Counter(str(t) for m in win_rows for t in (m.get("group_targets") or ["(none)"]))))
          print("window_units_empty_n", sum(1 for m in win_rows if m["units_empty"]))
          print("window_fc_any_n", sum(1 for m in win_rows if m["any_fc"]))
          print("window_fc_combo_n", sum(1 for m in win_rows if m["fc_combo"]))
          print("window_freq_n", sum(1 for m in win_rows if m["freq_n"]))
          print("window_tag_n", sum(1 for m in win_rows if m["tag_n"]))
          four = {"kamenyari", "almanac", "neutron", "blender"}
          print("window_from_four_n", sum(1 for m in win_rows if m["lab"] in four))
          print("--- window meta (scrubbed, no excerpt) ---")
          for m in win_rows:
              # strip nothing sensitive; meta has no body
              print({k: m[k] for k in (
                  "t","lab","src_in_flow","reasons","group_targets","skipped",
                  "units_n","units_empty","topics","targets_cls",
                  "sight_n","fire_n","tag_n","freq_n","fc_combo","any_fc","excerpt_len"
              )})

          print("=== DAY fire-control marker hits in MATCHED flow-log (drops not logged) ===")
          print("day_fc_rows", len(day_fc))
          print("day_fc_by_label", dict(Counter(m["lab"] for m in day_fc)))
          print("day_fc_combo_n", sum(1 for m in day_fc if m["fc_combo"]))
          print("day_fc_units_empty_n", sum(1 for m in day_fc if m["units_empty"]))
          for m in day_fc[-20:]:
              print({k: m[k] for k in (
                  "t","lab","reasons","group_targets","units_n","units_empty",
                  "topics","targets_cls","sight_n","fire_n","tag_n","freq_n","fc_combo","excerpt_len"
              )})

          # Near-miss simulation: for window rows, would unit gate fail if we stripped units?
          # Also report: current match_flow on a synthetic empty-unit fire-control stub
          stub = {
              "source_key": sources[0] if sources else "group:stub",
              "text": "укх р/м НВ підрозділу (ДОРОЗВІДКА) 147.3750 прицел уровень угломер огонь расчет в укрытие",
              "id": "stub-fc",
              "timestamp": 0,
          }
          ok, reasons = match_flow(flow, stub)
          print("=== stub match_flow (scrubbed paraphrase, real flow filters) ===")
          print("stub_ok", ok, "stub_reasons", reasons)
          print("stub_units", extract_units(stub["text"]))
          print("stub_topics", sorted(classify_topics(stub["text"])))
          print("stub_targets", sorted(classify_stream_targets(stub["text"])))

          # Ingest log: cycles near window
          print("=== ingest log around window (scrubbed) ===")
          for cand in [Path("/tmp/sf-ingest-run.log"), user_dir(root, sid) / "data" / "ingest.log"]:
              if not cand.is_file():
                  print("missing", str(cand))
                  continue
              print("file", str(cand), "bytes", cand.stat().st_size)
              lines = cand.read_text(errors="replace").splitlines()
              hit = 0
              for ln in lines:
                  if "18:1" in ln or "21:1" in ln or "dropped=" in ln or "matched=" in ln:
                      # keep short scrubbed
                      s = re.sub(r"\+?\d{8,15}", "[tel]", ln)
                      if "sgnl://" in s:
                          continue
                      if len(s) > 220:
                          s = s[:220] + "…"
                      # only print if looks like stats or time near window
                      if any(x in s for x in ("dropped=", "matched=", "received=", "18:1", "18:2")):
                          print(s)
                          hit += 1
                          if hit > 60:
                              break
              print("ingest_lines_printed", hit)

          print("NOTE: flow-log only stores MATCHES; unit-gate DROPS leave no row.")
          print("DIAG7_DONE")
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
