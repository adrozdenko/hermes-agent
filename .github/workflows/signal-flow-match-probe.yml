name: Signal Flow match-probe (Contabo)

# Counts only: source_key histogram + keyword hit count. No bodies/excerpts.
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "keyword to count (default SFTOKEN)"
        required: false
        default: "SFTOKEN"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Count match shapes (scrubbed)
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          KEYWORD: ${{ inputs.keyword || 'SFTOKEN' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 \
            "KEYWORD=$(printf %q "$KEYWORD") bash -s" <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          PIDFILE=/tmp/sf-bot-run.pid
          if [ -f "$PIDFILE" ]; then
            OLD=$(cat "$PIDFILE" 2>/dev/null || true)
            [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null && kill "$OLD" 2>/dev/null || true
          fi
          pkill -f 'sf-admin.*bot-run' 2>/dev/null || true
          pkill -f 'signal-cli' 2>/dev/null || true
          sleep 2
          export PYTHONUNBUFFERED=1
          "$APP/.venv/bin/python" -u - <<'PY'
          import os, re, sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.bot_link import user_signal_session_dir
          from sf.flow_match import match_flow, message_source_key
          from sf.flows import ensure_default_flow
          from sf.ingest import read_session_account, receive_user_events, resolve_ingest_user
          from sf.register import resolve_signal_account
          from sf.templates import CHAT_SELF_KEY

          root = Path("/opt/signal-flow")
          keyword = (os.environ.get("KEYWORD") or "SFTOKEN").strip() or "SFTOKEN"
          signal_id, _ = resolve_ingest_user(root, "self")
          sess = user_signal_session_dir(root, signal_id)
          flow = ensure_default_flow(root, signal_id)
          print("flow_enabled=", flow.get("enabled"), flush=True)
          print("flow_sources=", flow.get("sources"), flush=True)
          kw = list((flow.get("filters") or {}).get("keywords") or [])
          print("flow_keywords_n=", len(kw), "keyword_len=", len(keyword), "flow_has_kw=", keyword in kw, flush=True)
          resolve = resolve_signal_account(root) or ""
          sess_acct = read_session_account(sess) or ""
          print("resolve_eq_sess=", resolve == sess_acct, flush=True)

          events = receive_user_events(root, signal_id, timeout=8)
          print("received=", len(events), flush=True)
          sources = Counter()
          note_self = 0
          kw_hits = 0
          match_ok = 0
          text_lens = []
          for msg in events:
              sk = str(msg.get("source_key") or message_source_key(msg))
              sources[sk] += 1
              if msg.get("note_to_self") or sk == CHAT_SELF_KEY:
                  note_self += 1
              text = str(msg.get("text") or "")
              text_lens.append(len(text))
              if keyword.lower() in text.lower():
                  kw_hits += 1
              ok, _ = match_flow(flow, msg)
              if ok:
                  match_ok += 1
          print("note_to_self_n=", note_self, flush=True)
          print("keyword_hits=", kw_hits, flush=True)
          print("match_flow_ok=", match_ok, flush=True)
          if text_lens:
              print("text_len_min=", min(text_lens), "max=", max(text_lens), "avg=", round(sum(text_lens)/len(text_lens),1), flush=True)
          # top sources only (scrub group ids partially)
          for sk, n in sources.most_common(12):
              safe = re.sub(r"\+?\d{8,15}", "[redacted]", sk)
              safe = re.sub(r"[0-9a-fA-F]{8,}", lambda m: m.group(0)[:4]+"…", safe)
              print(f"source={safe} n={n}", flush=True)
          print("PROBE_DONE", flush=True)
          PY
          nohup env PYTHONUNBUFFERED=1 "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli bot-run \
            >/tmp/sf-bot-run.log 2>&1 &
          echo $! >/tmp/sf-bot-run.pid
          echo BOT_RUN=restarted
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
