name: Signal Flow bot-start (Contabo)

# Start sf-admin bot-run on Contabo (nohup). Does NOT restart Hermes.
# Requires signal_account ready (after SMS verify or QR link). No public inputs.

on:
  workflow_dispatch:

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start bot-run on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST_KEY:-}" ]; then
            echo "Missing HERMES_SSH_KEY or HERMES_HOST_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ServerAliveInterval=30 -o ConnectTimeout=30 \
              -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          LOG=/tmp/sf-bot-run.log
          PIDFILE=/tmp/sf-bot-run.pid
          test -x "$APP/.venv/bin/sf-admin" || {
            echo "sf-admin missing; run Install Signal Flow app first" >&2
            exit 1
          }
          # Status only — never print phone.
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli bot-link-status || true
          # Stop previous bot-run if any (do not touch Hermes).
          if [ -f "$PIDFILE" ]; then
            OLD=$(cat "$PIDFILE" 2>/dev/null || true)
            if [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null; then
              kill "$OLD" 2>/dev/null || true
              sleep 1
            fi
            rm -f "$PIDFILE"
          fi
          pkill -f 'sf-admin.*bot-run' 2>/dev/null || true
          sleep 1
          nohup "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli bot-run \
            >"$LOG" 2>&1 &
          echo $! > "$PIDFILE"
          sleep 2
          if kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
            echo "BOT_RUN=started"
            echo "pid=$(cat "$PIDFILE")"
            tail -n 20 "$LOG" 2>/dev/null | sed -E 's/\+?[0-9]{8,15}/[redacted]/g' || true
            exit 0
          fi
          echo "BOT_RUN=failed"
          tail -n 40 "$LOG" 2>/dev/null | sed -E 's/\+?[0-9]{8,15}/[redacted]/g' || true
          exit 1
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
