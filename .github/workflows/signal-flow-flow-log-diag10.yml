name: Signal Flow flow-log diag10 (Contabo)

# Read-only Blender→ПОТІК dig. No pkill. Never prints phones/sgnl/SSH/excerpts.
# Confirms live markers, scrubbed channels wiring, opaque-chat enrich stub,
# last-30min blender match stats.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Contabo blender admit dig (scrubbed)
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          echo "=== 1 LIVE MARKERS ==="
          # HEAD / installed commit if present
          if [ -f "$APP/.git/HEAD" ]; then
            echo "app_git_head=$(cd "$APP" && git rev-parse --short HEAD 2>/dev/null || echo '?')"
          else
            echo "app_git_head=no_git"
          fi
          # Marker greps (no secrets)
          echo -n "has_apply_channel_labels="
          grep -q 'def apply_channel_labels' "$APP/sf/ingest.py" && echo yes || echo no
          echo -n "has_blender_exempt="
          grep -q 'blender_exempt' "$APP/sf/ingest.py" && echo yes || echo no
          echo -n "has_blender_source_keys="
          grep -q 'def blender_source_keys' "$APP/sf/flow_match.py" && echo yes || echo no
          echo -n "has__blender_admit="
          grep -q '_blender_admit' "$APP/sf/ingest.py" && echo yes || echo no
          echo -n "has_is_blender_source="
          grep -q 'def is_blender_source' "$APP/sf/flow_match.py" && echo yes || echo no
          echo "=== apply_channel_labels call sites ==="
          grep -n 'apply_channel_labels' "$APP/sf/ingest.py" | head -10 || true
          echo "=== blender_exempt / fingerprint skip ==="
          grep -n 'blender_exempt\|never fingerprint' "$APP/sf/ingest.py" | head -10 || true
          echo "=== processes ==="
          if [ -f /tmp/sf-ingest-run.pid ] && kill -0 "$(cat /tmp/sf-ingest-run.pid)" 2>/dev/null; then
            echo INGEST_RUN=alive pid=$(cat /tmp/sf-ingest-run.pid)
          else
            echo INGEST_RUN=dead
          fi
          echo "bot_run=$( [ -f /tmp/sf-bot-run.pid ] && kill -0 "$(cat /tmp/sf-bot-run.pid)" 2>/dev/null && echo alive || echo stopped )"
          echo "signal_cli_n=$(pgrep -c -f 'signal-cli' 2>/dev/null || echo 0)"
          echo "=== stream-status ==="
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli stream-status || true

          PYTHONPATH="$APP" "$APP/.venv/bin/python" - <<'PY'
          import json, re, sys, importlib
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.ingest import resolve_ingest_user, channel_display_names, apply_channel_labels
          from sf.paths import channels_path, flow_log_dir
          from sf.flows import ensure_default_flow, load_default_flow
          from sf.flow_match import match_flow, is_blender_source
          from sf.units import extract_units
          from sf.stream import load_stream_state, stream_is_live

          def scrub(s: str) -> str:
              s = re.sub(r"\+?\d{8,15}", "[tel]", str(s or ""))
              s = re.sub(r"sgnl://\S+", "[sgnl]", s)
              s = re.sub(
                  r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
                  "[uuid]",
                  s,
              )
              return s

          def label_for(name: str) -> str:
              fold = (name or "").casefold()
              if "каменяр" in fold: return "kamenyari"
              if "альманах" in fold or "almanac" in fold: return "almanac"
              if "нейтрон" in fold or "neutron" in fold: return "neutron"
              if "блендер" in fold or "blender" in fold or "обтвр" in fold: return "blender"
              return "other"

          def key_prefix(k: str) -> str:
              k = str(k or "")
              return (k[:12] + "…") if len(k) > 12 else k

          root = Path("/opt/signal-flow")
          sid, _ = resolve_ingest_user(root, "self")
          flow = ensure_default_flow(root, sid)
          names = channel_display_names(root, sid)

          print("=== 2 CHANNELS + FLOW WIRING (scrubbed) ===")
          print("channel_names_n", len(names))
          blender_rows = []
          label_counts = Counter()
          for k, title in names.items():
              lab = label_for(title)
              label_counts[lab] += 1
              if lab == "blender":
                  blender_rows.append((k, title))
          print("label_counts", dict(label_counts))
          print("blender_wired_n", len(blender_rows))
          for k, title in blender_rows:
              # title scrubbed to class only; show needle hit, not full name if long
              fold = title.casefold()
              needles = [n for n in ("блендер", "blender", "обтвр") if n in fold]
              print("blender_key_prefix", key_prefix(k), "needles", needles, "title_len", len(title))

          sources = [str(s) for s in (flow.get("sources") or [])]
          ch_inc = [str(s) for s in ((flow.get("filters") or {}).get("channels_include") or [])]
          blender_keys = [k for k, _ in blender_rows]
          print("flow_enabled", bool(flow.get("enabled")))
          print("sources_n", len(sources))
          print("channels_include_n", len(ch_inc))
          print("units_n", len(list((flow.get("filters") or {}).get("units") or [])))
          in_sources = [k for k in blender_keys if k in sources]
          in_ch_inc = [k for k in blender_keys if k in ch_inc]
          print("blender_in_sources_n", len(in_sources), "prefixes", [key_prefix(k) for k in in_sources])
          print("blender_in_channels_include_n", len(in_ch_inc), "prefixes", [key_prefix(k) for k in in_ch_inc])
          # Also: any source whose label is blender via channels map
          missing = [key_prefix(k) for k in blender_keys if k not in sources]
          if missing:
              print("WARNING blender_keys_missing_from_sources", missing)

          st = load_stream_state(root)
          print("stream_live", stream_is_live(st))
          for kn in ("default", "arta", "air"):
              t = (st.get("targets") or {}).get(kn) or {}
              print(f"sink_{kn}", "en=", bool(t.get("enabled")), "gid_len=", len(str(t.get("group_id") or "")))

          print("=== 3 OPAQUE-CHAT ENRICH STUB ===")
          if not blender_keys:
              print("STUB_SKIP no blender key in channels.json")
          else:
              bk = blender_keys[0]
              # Opaque chat like receive leaves it; unitless text
              opaque = "Група " + ("x" * 10) + "…"
              text = "обстановка без номерних частин зі списку — scrubbed blender stub diag10"
              assert not extract_units(text), "stub must be unitless"
              msg = {
                  "source_key": bk,
                  "chat": opaque,
                  "text": text,
                  "id": "diag10-blender-opaque",
                  "timestamp": 1,
              }
              print("pre_enrich is_blender", is_blender_source(msg), "chat_prefix", opaque[:8])
              enriched = apply_channel_labels(msg, names)
              chat_after = str(enriched.get("chat") or "")
              print("post_enrich chat_starts_grupa", chat_after.startswith("Група "))
              print("post_enrich chat_label_class", label_for(chat_after))
              print("post_enrich _blender_admit", enriched.get("_blender_admit"))
              print("post_enrich is_blender", is_blender_source(enriched))
              # key lookup miss?
              label = names.get(bk)
              print("names_lookup_hit", bool(isinstance(label, str) and label.strip()))
              print("names_lookup_class", label_for(label or ""))
              # Does exact key appear in names?
              print("exact_key_in_names", bk in names)
              # Compare key forms: any blender key that is NOT exact match style
              # (prefix-only report)
              ok, reasons = match_flow(flow, enriched)
              print("match_ok", ok)
              print("match_reasons", "|".join(str(r)[:80] for r in reasons))
              print("reason_has_blender", any("блендер" in str(r) for r in reasons))
              if not ok:
                  # Diagnose key mismatch vs sources / channels_include
                  print("diag_source_in_sources", bk in sources)
                  print("diag_source_in_ch_inc", bk in ch_inc or not ch_inc)
                  # Try with stub flow that forces blender into sources+include
                  filters = dict(flow.get("filters") or {})
                  stub_flow = {
                      **flow,
                      "enabled": True,
                      "sources": list(set(sources + [bk])),
                      "filters": {
                          **filters,
                          "channels_include": list(set(ch_inc + [bk])) if ch_inc else [bk],
                      },
                  }
                  ok2, reasons2 = match_flow(stub_flow, enriched)
                  print("forced_include_match_ok", ok2)
                  print("forced_include_reasons", "|".join(str(r)[:80] for r in reasons2))
                  # Also: match WITHOUT enrich (opaque only) — expected fail unless _blender_admit
                  ok3, reasons3 = match_flow(stub_flow, msg)
                  print("opaque_no_enrich_ok", ok3, "reasons", "|".join(str(r)[:80] for r in reasons3))
              else:
                  print("OPAQUE_ENRICH_MATCH_OK")

              # Key-form probe: does receive source_key style differ?
              # Report whether any channel key starts with group: / and blender key prefix family
              families = Counter()
              for k in names:
                  if k.startswith("group:"):
                      families["group:"] += 1
                  elif k.startswith("chat:"):
                      families["chat:"] += 1
                  else:
                      families["other"] += 1
              print("key_families", dict(families))
              print("blender_key_family", "group:" if bk.startswith("group:") else ("chat:" if bk.startswith("chat:") else "other"))

          print("=== 4 LAST_30MIN FLOW-LOG ===")
          now = datetime.now(timezone.utc)
          cut = now - timedelta(minutes=30)
          days = {now.strftime("%Y-%m-%d"), cut.strftime("%Y-%m-%d")}
          label_of = {}
          try:
              ch = json.loads(channels_path(root, sid).read_text(encoding="utf-8"))
              for row in (ch.get("signal") or []):
                  if isinstance(row, dict) and row.get("key"):
                      label_of[str(row["key"])] = label_for(str(row.get("name") or ""))
          except Exception as exc:
              print("channels_err", type(exc).__name__)

          rows = []
          for day in sorted(days):
              log = flow_log_dir(root, sid) / f"{day}.jsonl"
              print("log", day, "exists", log.is_file(), "bytes", log.stat().st_size if log.is_file() else 0)
              if not log.is_file():
                  continue
              with log.open(encoding="utf-8", errors="replace") as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          r = json.loads(line)
                      except Exception:
                          continue
                      la = str(r.get("logged_at") or "")
                      try:
                          ts = datetime.fromisoformat(la.replace("Z", "+00:00"))
                          if ts.tzinfo is None:
                              ts = ts.replace(tzinfo=timezone.utc)
                      except Exception:
                          continue
                      if ts < cut:
                          continue
                      sk = str(r.get("source_key") or "")
                      lab = label_of.get(sk, "unk")
                      rs = r.get("reasons") or []
                      rs_s = [str(x) for x in (rs if isinstance(rs, list) else [])]
                      skipped = r.get("skipped_sinks") or []
                      rows.append({
                          "t": la[11:19] if len(la) >= 19 else la,
                          "lab": lab,
                          "sk_prefix": key_prefix(sk),
                          "group_targets": r.get("group_targets"),
                          "skipped": skipped,
                          "fp": bool(r.get("dedup_fingerprint") or r.get("fingerprint_suppressed")),
                          "fp_reason": str(r.get("fp_reason") or r.get("fingerprint_reason") or ""),
                          "group_failed": bool(r.get("group_failed")),
                          "reason_has_blender": any("блендер" in x for x in rs_s),
                          "reason_has_unit": any("частини" in x or "ключові" in x for x in rs_s),
                          "reasons_head": "|".join(x[:40] for x in rs_s[:3]),
                          "excerpt_len": len(str(r.get("excerpt") or "")),
                      })

          print("match_rows_30m", len(rows))
          print("by_label", dict(Counter(m["lab"] for m in rows)))
          blender_rows_log = [m for m in rows if m["lab"] == "blender"]
          print("blender_matches_30m", len(blender_rows_log))
          print("blender_reason_блендер_n", sum(1 for m in blender_rows_log if m["reason_has_blender"]))
          print("blender_reason_unit_n", sum(1 for m in blender_rows_log if m["reason_has_unit"]))
          print("blender_fp_n", sum(1 for m in blender_rows_log if m["fp"]))
          print("blender_group_failed_n", sum(1 for m in blender_rows_log if m["group_failed"]))
          print("blender_no_targets_n", sum(1 for m in blender_rows_log if not m.get("group_targets")))
          print("all_fp_n", sum(1 for m in rows if m["fp"]))
          print("all_group_failed_n", sum(1 for m in rows if m["group_failed"]))
          print("by_target", dict(Counter(str(t) for m in rows for t in (m.get("group_targets") or ["(none)"]))))
          print("skip_classes", dict(Counter(
              str(s).split(":")[0] for m in rows for s in (m.get("skipped") or [])
          )))
          print("--- blender rows meta (no excerpt) ---")
          for m in blender_rows_log[-20:]:
              print({k: m[k] for k in ("t","sk_prefix","group_targets","skipped","fp","group_failed","reason_has_blender","reason_has_unit","reasons_head","excerpt_len")})
          print("--- last 15 any-label ---")
          for m in rows[-15:]:
              print({k: m[k] for k in ("t","lab","sk_prefix","group_targets","fp","group_failed","reason_has_blender","reason_has_unit","excerpt_len")})

          print("=== 5 INGEST LOG (scrubbed classes, last 30m window approx via tail) ===")
          logp = Path("/tmp/sf-ingest-run.log")
          print("ingest_log_bytes", logp.stat().st_size if logp.is_file() else 0)
          cls = Counter()
          sent = Counter()
          err = Counter()
          interesting = []
          if logp.is_file():
              import time
              print("ingest_log_mtime_age_s", int(time.time() - logp.stat().st_mtime))
              lines = logp.read_text(errors="replace").splitlines()
              print("ingest_log_lines", len(lines))
              for ln in lines[-5000:]:
                  s = scrub(ln)
                  low = s.casefold()
                  if "group_sent:" in s:
                      m = re.search(r"group_sent:(\w+)", s)
                      if m: sent[m.group(1)] += 1
                      cls["group_sent"] += 1
                  if "group_error:" in s:
                      m = re.search(r"group_error:(\w+)", s)
                      sink = m.group(1) if m else "?"
                      if "LockedException" in s or "Config file is in use" in s:
                          kind = "locked"
                      elif "Invalid group id" in s:
                          kind = "bad_group_id"
                      elif "expected one argument" in s:
                          kind = "bad_m_arg"
                      else:
                          kind = "other"
                      err[f"{sink}:{kind}"] += 1
                      cls["group_error"] += 1
                  if "fp_suppress" in s:
                      cls["fp_suppress"] += 1
                  if "blender_exempt" in s:
                      cls["blender_exempt"] += 1
                  if "traceback" in low:
                      cls["traceback"] += 1
                  if "receive failed" in low:
                      cls["receive_error"] += 1
                  if any(x in low for x in ("group_error", "group_sent", "fp_suppress", "blender_exempt", "traceback", "receive failed", "matched=", "received=")):
                      if len(s) > 220:
                          s = s[:220] + "…"
                      interesting.append(s)
          print("class_counts", dict(cls))
          print("group_sent_by_sink", dict(sent))
          print("group_err_classes", dict(err))
          print("--- last 30 interesting ---")
          for ln in interesting[-30:]:
              print(ln)

          # Module versions / symbols
          print("=== 6 SYMBOL PRESENCE ===")
          try:
              import sf.flow_match as fm
              import sf.ingest as ing
              print("fm.has_blender_source_keys", hasattr(fm, "blender_source_keys"))
              print("fm.has_label_looks_blender", hasattr(fm, "label_looks_blender"))
              print("ing.apply_channel_labels", hasattr(ing, "apply_channel_labels"))
              # Check installed file mtimes
              for rel in ("sf/ingest.py", "sf/flow_match.py"):
                  p = Path("/opt/signal-flow/app") / rel
                  print(rel, "mtime", datetime.fromtimestamp(p.stat().st_mtime, tz=timezone.utc).isoformat(), "bytes", p.stat().st_size)
          except Exception as exc:
              print("symbol_err", type(exc).__name__, scrub(str(exc))[:120])

          print("DIAG10_DONE")
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
