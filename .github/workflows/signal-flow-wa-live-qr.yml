name: Signal Flow wa-live-qr (Contabo)
# Start/restart WA sidecar + tiny HTTP page that auto-refreshes qr.png.
# Operator opens URL on a computer, scans with phone WhatsApp Linked devices.
# Manual only. Does not touch Signal ingest-run.
# L3: refuses when /tmp/sf-wa-ingest.pid is alive (second connector). Prefer
# signal-flow-wa-chats-from-log. Optional force_stop_wa_ingest stops WA ingest only.
on:
  workflow_dispatch:
    inputs:
      clear_session:
        type: boolean
        default: true
      force_stop_wa_ingest:
        description: "Stop live wa-ingest before starting live QR sidecar (default refuse; prefer wa-chats-from-log)"
        type: boolean
        default: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Start live QR HTTP on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          CLEAR_SESSION: ${{ inputs.clear_session }}
          FORCE_STOP_WA_INGEST: ${{ inputs.force_stop_wa_ingest }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=20 -i ~/.ssh/id_ed25519 root@5.189.159.195 \
            "CLEAR_SESSION=$(printf '%q' "${CLEAR_SESSION:-true}") FORCE_STOP_WA_INGEST=$(printf '%q' "${FORCE_STOP_WA_INGEST:-false}") bash -s" <<'REMOTE'
          set -euo pipefail
          # L3: refuse second LocalAuth owner while Path B wa-ingest is alive.
          # Default refuse → ops use signal-flow-wa-chats-from-log.
          # force_stop_wa_ingest=true stops wa-ingest only (not Signal).
          INGEST_PIDFILE=/tmp/sf-wa-ingest.pid
          export FORCE_STOP_WA_INGEST="${FORCE_STOP_WA_INGEST:-false}"
          export PYTHONPATH="/opt/signal-flow/app${PYTHONPATH:+:$PYTHONPATH}"
          set +e
          python3 - <<'L3PY'
          import os, sys
          from pathlib import Path

          force = os.environ.get("FORCE_STOP_WA_INGEST", "false").strip().lower() in (
              "1", "true", "yes",
          )
          try:
              from sf.wa_ingest import wa_second_connector_preflight

              r = wa_second_connector_preflight(force_stop=force)
              print(r.message, flush=True)
              raise SystemExit(0 if r.allowed else 3)
          except ImportError:
              pass

          pidfile = Path("/tmp/sf-wa-ingest.pid")
          pid = None
          if pidfile.is_file():
              try:
                  raw = pidfile.read_text(encoding="utf-8").strip().splitlines()[0]
                  pid = int(raw.strip())
              except (OSError, ValueError, IndexError):
                  pid = None
          alive = False
          if pid is not None and pid > 1:
              try:
                  os.kill(pid, 0)
                  alive = True
              except OSError:
                  alive = False
          if not alive:
              print("WA_INGEST=not_running", flush=True)
              raise SystemExit(0)
          if force:
              print("WA_INGEST_FORCE_STOP=1", flush=True)
              try:
                  os.kill(pid, 15)
              except OSError:
                  pass
              import time
              for _ in range(40):
                  try:
                      os.kill(pid, 0)
                  except OSError:
                      break
                  time.sleep(0.25)
              else:
                  try:
                      os.kill(pid, 9)
                  except OSError:
                      pass
              try:
                  pidfile.unlink(missing_ok=True)
              except OSError:
                  pass
              raise SystemExit(0)
          print(
              "WA_INGEST_REFUSE=1 — use signal-flow-wa-chats-from-log "
              "(or force_stop_wa_ingest=true)",
              flush=True,
          )
          raise SystemExit(3)
          L3PY
          L3_RC=$?
          set -e
          if [ "$L3_RC" -eq 3 ]; then
            echo "HINT=workflow_signal-flow-wa-chats-from-log" >&2
            exit 3
          fi
          if [ "$L3_RC" -ne 0 ]; then
            echo "L3_PREFLIGHT_ERROR rc=$L3_RC" >&2
            exit "$L3_RC"
          fi

          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          SIDE="$APP/whatsapp_sidecar"
          if [ -d "$DATA_ROOT/users/self" ]; then UDIR="$DATA_ROOT/users/self"
          else UDIR=$(find "$DATA_ROOT/users" -mindepth 1 -maxdepth 1 -type d | head -n1); fi
          SESSION="$UDIR/sessions/whatsapp"
          ATT="$UDIR/data/whatsapp-attachments"
          CACHE="$SESSION/web-cache"
          QR_OUT="$SESSION/qr.png"
          LOG=/tmp/sf-wa-link.log
          PIDFILE=/tmp/sf-wa-sidecar.pid
          WWW=/tmp/sf-wa-qr-www
          HTTPPID=/tmp/sf-wa-qr-http.pid
          PORT=18080
          mkdir -p "$SESSION" "$ATT" "$CACHE" "$WWW"
          CHROME=$(cat "$DATA_ROOT/config/wa_chrome_path" 2>/dev/null || true)
          [ -n "$CHROME" ] || CHROME=$(command -v chromium-browser || command -v chromium || true)
          # stop old sidecar + http only
          [ -f "$PIDFILE" ] && kill "$(cat "$PIDFILE")" 2>/dev/null || true
          [ -f "$HTTPPID" ] && kill "$(cat "$HTTPPID")" 2>/dev/null || true
          pkill -f 'whatsapp_sidecar/connector.js' 2>/dev/null || true
          pkill -f 'sf-wa-qr-www' 2>/dev/null || true
          sleep 1
          if [ "${CLEAR_SESSION:-true}" = "true" ]; then
            find "$SESSION" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
            mkdir -p "$SESSION" "$CACHE"
          fi
          rm -f "$QR_OUT" "$LOG"
          export SF_WA_DATA_DIR="$SESSION" SF_WA_SESSION_DIR="$SESSION" SF_WA_ATTACHMENTS_DIR="$ATT"
          export SF_WA_CACHE_DIR="$CACHE" SF_WA_CHROME_PATH="$CHROME" SF_WA_HEADLESS=true
          nohup node "$SIDE/connector.js" >"$LOG" 2>&1 &
          echo $! >"$PIDFILE"
          # wait first qr
          for i in $(seq 1 60); do
            [ -s "$QR_OUT" ] && break
            sleep 1
          done
          [ -s "$QR_OUT" ] || { echo "NO_QR"; grep -oE '"type":"[a-z_]+"' "$LOG" | sort | uniq -c; exit 1; }
          # symlink live png + auto-refresh index
          ln -sfn "$QR_OUT" "$WWW/qr.png"
          cat > "$WWW/index.html" <<'HTML'
          <!doctype html><meta charset=utf-8>
          <title>SF WA QR</title>
          <meta http-equiv="refresh" content="8">
          <body style="margin:0;background:#111;color:#eee;font:16px system-ui;text-align:center">
          <p>WhatsApp → Linked devices → Scan. Page refreshes every 8s.</p>
          <img id=q src="qr.png?t=0" style="width:min(90vw,720px);height:auto;background:#fff;padding:12px">
          <script>setInterval(()=>{q.src='qr.png?t='+Date.now()},4000)</script>
          </body>
          HTML
          # open firewall defensively
          iptables -C INPUT -p tcp --dport "$PORT" -j ACCEPT 2>/dev/null || iptables -I INPUT -p tcp --dport "$PORT" -j ACCEPT || true
          cd "$WWW"
          nohup python3 -m http.server "$PORT" --bind 0.0.0.0 > /tmp/sf-wa-qr-http.log 2>&1 &
          echo $! >"$HTTPPID"
          sleep 1
          echo "LIVE_QR_URL=http://5.189.159.195:${PORT}/"
          echo "sidecar_pid=$(cat "$PIDFILE")"
          echo "http_pid=$(cat "$HTTPPID")"
          ls -la "$QR_OUT"
          echo LIVE_OK=1
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
