name: Signal Flow bot-diag (Contabo)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose bot-run
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          PIDFILE=/tmp/sf-bot-run.pid
          LOG=/tmp/sf-bot-run.log
          echo "=== process ==="
          if [ -f "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
            echo "BOT_RUN=alive pid=$(cat "$PIDFILE")"
          else
            echo "BOT_RUN=dead"
            pgrep -af 'bot-run|signal-cli' || true
          fi
          echo "=== bot-link-status ==="
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli bot-link-status || true
          echo "=== sf-bot-run.log tail ==="
          if [ -f "$LOG" ]; then
            sed -E 's/\+?[0-9]{8,15}/[redacted]/g; /sgnl:\/\//d' "$LOG" | tail -n 40
          else
            echo "no log"
          fi
          echo "=== probe: stop bot briefly, one receive 8s, count shapes (no bodies) ==="
          if [ -f "$PIDFILE" ]; then
            OLD=$(cat "$PIDFILE" 2>/dev/null || true)
            if [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null; then
              kill "$OLD" 2>/dev/null || true
              sleep 1
            fi
          fi
          pkill -f 'sf-admin.*bot-run' 2>/dev/null || true
          sleep 1
          "$APP/.venv/bin/python" - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.register import resolve_signal_account
          from sf.bot_link import signal_cli_bin
          from sf.paths import bot_signal_dir
          root = Path("/opt/signal-flow")
          account = resolve_signal_account(root)
          bin_path = signal_cli_bin()
          cfg = str(bot_signal_dir(root))
          print("account_resolved=", bool(account))
          print("cli=", bool(bin_path))
          if not account or not bin_path:
              raise SystemExit(0)
          proc = subprocess.run(
              [bin_path, "--config", cfg, "-a", account, "receive", "--json", "-t", "8"],
              capture_output=True, text=True, timeout=30,
          )
          # never print stdout bodies — only shape counts + stderr scrubbed
          n_lines = 0
          shapes = {"dataMessage": 0, "syncMessage": 0, "syncSent": 0, "other": 0, "parse_fail": 0}
          for line in (proc.stdout or "").splitlines():
              line = line.strip()
              if not line:
                  continue
              n_lines += 1
              try:
                  payload = json.loads(line)
              except json.JSONDecodeError:
                  shapes["parse_fail"] += 1
                  continue
              envs = []
              if isinstance(payload, dict):
                  if "envelope" in payload:
                      envs.append(payload.get("envelope") or {})
                  for row in payload.get("results") or []:
                      if isinstance(row, dict) and "envelope" in row:
                          envs.append(row.get("envelope") or {})
              for env in envs:
                  if not isinstance(env, dict):
                      shapes["other"] += 1
                      continue
                  if env.get("dataMessage"):
                      shapes["dataMessage"] += 1
                  elif (env.get("syncMessage") or {}).get("sentMessage") if isinstance(env.get("syncMessage"), dict) else None:
                      shapes["syncSent"] += 1
                      shapes["syncMessage"] += 1
                  elif env.get("syncMessage"):
                      shapes["syncMessage"] += 1
                  else:
                      shapes["other"] += 1
          print("receive_exit=", proc.returncode)
          print("json_lines=", n_lines)
          print("shapes=", shapes)
          err = (proc.stderr or "").strip()
          if err:
              import re
              err = re.sub(r"\+[1-9]\d{6,14}", "[redacted]", err)
              print("stderr_tail=", err[-400:])
          PY
          echo "=== restart bot-run ==="
          export PYTHONUNBUFFERED=1
          nohup env PYTHONUNBUFFERED=1 "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli bot-run \
            >"$LOG" 2>&1 &
          echo $! > "$PIDFILE"
          sleep 2
          if kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
            echo "BOT_RUN=restarted pid=$(cat "$PIDFILE")"
            tail -n 5 "$LOG" || true
          else
            echo "BOT_RUN=restart_failed"
            tail -n 30 "$LOG" || true
            exit 1
          fi
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
