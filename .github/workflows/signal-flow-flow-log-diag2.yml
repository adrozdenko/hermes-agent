name: Signal Flow flow-log diag2 (Contabo)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: jsonl schema + 488 delivery
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          PYTHONPATH=/opt/signal-flow/app /opt/signal-flow/app/.venv/bin/python - <<'PY'
          import json, re
          from pathlib import Path
          from collections import Counter
          import sys
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.ingest import resolve_ingest_user
          from sf.paths import user_dir
          root = Path("/opt/signal-flow")
          sid, _ = resolve_ingest_user(root, "self")
          log = user_dir(root, sid) / "data" / "flow-log" / "2026-09-25.jsonl"
          print("log", log, "size", log.stat().st_size)
          rows=[]
          with log.open(encoding="utf-8", errors="replace") as fh:
              for line in fh:
                  line=line.strip()
                  if not line: continue
                  try: rows.append(json.loads(line))
                  except: pass
          print("n", len(rows))
          if rows:
              keys=Counter()
              for r in rows: keys.update(r.keys())
              print("keys", sorted(keys))
              # sample one with 488 in reasons, scrub
              for r in rows:
                  rs=r.get("reasons") or []
                  if any("488" in str(x) for x in rs):
                      sample={k:r.get(k) for k in r if k not in ("text","body","excerpt","card","message","attachments")}
                      # scrub phones
                      s=json.dumps(sample, ensure_ascii=False)
                      s=re.sub(r"\+?\d{8,15}", "[redacted]", s)
                      print("SAMPLE_488", s[:1200])
                      break
          # counts by outcome fields
          c=Counter(); sinks=Counter(); skipped=Counter(); ev=Counter()
          for r in rows:
              rs=r.get("reasons") or []
              is488=any("488" in str(x) for x in rs)
              if not is488: continue
              c["488_n"]+=1
              for k in ("event","status","outcome","action","kind"):
                  if r.get(k): ev[f"{k}={r.get(k)}"]+=1
              for s in (r.get("sinks") or r.get("sent") or []) if isinstance(r.get("sinks") or r.get("sent") or [], list) else []:
                  sinks[str(s)[:40]]+=1
              for s in (r.get("skipped_sinks") or []) if isinstance(r.get("skipped_sinks"), list) else []:
                  skipped[str(s)[:60]]+=1
              if r.get("group_ok") or r.get("group_sent"): c["group_ok"]+=1
              if r.get("group_failed"): c["group_failed"]+=1
              if r.get("dm_sent"): c["dm_sent"]+=1
              if r.get("stream_enabled") is False: c["stream_off"]+=1
              # boolean-ish
              for k,v in r.items():
                  if k in ("text","body","excerpt","card","message"): continue
                  if isinstance(v,bool) and v: c[f"bool_{k}"]=c.get(f"bool_{k}",0)+1
          print("488_counts", dict(c))
          print("488_sinks", dict(sinks))
          print("488_skipped", dict(skipped))
          print("488_ev", dict(ev.most_common(20)))
          # recent ingest cycles with group_failed
          p=Path("/tmp/sf-ingest-run.log")
          if p.is_file():
              lines=[ln for ln in p.read_text(errors="replace").splitlines() if "group_failed=" in ln or "error:" in ln.lower()]
              print("=== ingest fail-ish lines last 30 ===")
              for ln in lines[-30:]:
                  ln=re.sub(r"\+?\d{8,15}","[redacted]",ln)
                  if "sgnl://" in ln: continue
                  print(ln[:220])
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
