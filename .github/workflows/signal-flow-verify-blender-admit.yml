name: Signal Flow verify Blender admit (Contabo)

# Scrubbed stub: Blender chat + no strip units → match_flow ok (блендер) + default target.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Blender units-include bypass on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          echo "=== marker ==="
          grep -n 'is_blender_source\|блендер\|_BLENDER_SOURCE' "$APP/sf/flow_match.py" | head -20
          grep -q 'is_blender_source' "$APP/sf/flow_match.py"
          grep -q 'reasons.append("блендер")' "$APP/sf/flow_match.py" || grep -q "reasons.append('блендер')" "$APP/sf/flow_match.py" || grep -q 'блендер' "$APP/sf/flow_match.py"
          echo "=== processes ==="
          if [ -f /tmp/sf-ingest-run.pid ] && kill -0 "$(cat /tmp/sf-ingest-run.pid)" 2>/dev/null; then
            echo INGEST_RUN=alive pid=$(cat /tmp/sf-ingest-run.pid)
          else
            echo INGEST_RUN=not_running
            exit 1
          fi
          if [ -f /tmp/sf-bot-run.pid ] && kill -0 "$(cat /tmp/sf-bot-run.pid)" 2>/dev/null; then
            echo BOT_RUN=alive
            exit 1
          else
            echo BOT_RUN=stopped
          fi
          echo "=== stream-status ==="
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli stream-status || true
          echo "=== scrubbed stub match + classify ==="
          export PYTHONUNBUFFERED=1
          "$APP/.venv/bin/python" -u - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.flow_match import is_blender_source, match_flow
          from sf.flows import load_default_flow
          from sf.ingest import resolve_ingest_user
          from sf.paths import channels_path
          from sf.topics import classify_stream_targets
          from sf.units import extract_units

          root = Path("/opt/signal-flow")
          signal_id, _ = resolve_ingest_user(root, "self")
          flow = load_default_flow(root, signal_id)
          assert callable(is_blender_source), "is_blender_source missing"

          # Resolve Blender source_key from channels.json (name needles)
          ch = json.loads(channels_path(root, signal_id).read_text(encoding="utf-8"))
          blender_key = None
          blender_name = None
          for row in ch.get("signal") or []:
              if not isinstance(row, dict):
                  continue
              name = str(row.get("name") or "")
              fold = name.casefold()
              if any(n in fold for n in ("блендер", "blender", "обтвр")):
                  blender_key = str(row.get("key") or "")
                  blender_name = name
                  break
          assert blender_key, "Blender channel not wired in channels.json"
          print("blender_wired=yes", flush=True)

          text = "обстановка без номерних частин зі списку — scrubbed blender stub"
          assert not extract_units(text), "stub must not contain strip units"
          # Live receive leaves opaque Група … — verify must exercise enrich, not a pre-labeled chat.
          from sf.ingest import apply_channel_labels, channel_display_names
          names = channel_display_names(root, signal_id)
          msg = {
              "source_key": blender_key,
              "chat": "Група xxxxxxxxxx…",
              "text": text,
              "id": "probe-blender-1",
              "timestamp": 1,
          }
          assert not is_blender_source(msg), "opaque chat must not look blender pre-enrich"
          msg = apply_channel_labels(msg, names)
          assert is_blender_source(msg), "enrich/_blender_admit must unlock blender"
          print("post_enrich_admit", bool(msg.get("_blender_admit")), flush=True)
          # Ensure channels_include allows blender_key
          filters = dict(flow.get("filters") or {})
          ch_inc = list(filters.get("channels_include") or [])
          stub_flow = {
              **flow,
              "enabled": True,
              "sources": [blender_key],
              "filters": {
                  **filters,
                  "channels_include": list(set(ch_inc + [blender_key])),
                  "units": list(filters.get("units") or ["254 мсп", "144 мсд"]),
              },
          }
          ok, reasons = match_flow(stub_flow, msg)
          print("filter_ok=", ok, flush=True)
          print("reasons=", "|".join(reasons), flush=True)
          assert ok, "Blender stub must admit"
          assert any("блендер" in r for r in reasons), reasons
          topics = classify_stream_targets(text, units=[])
          print("topics=", ",".join(sorted(topics)) or "(default)", flush=True)
          assert topics == frozenset(), "unitless blender stub → default only"
          # Negative: Каменярі-named chat still drops
          kamen = {
              "source_key": blender_key,  # key irrelevant; chat name gates blender
              "chat": "Каменярі",
              "text": text,
              "id": "probe-blender-neg",
              "timestamp": 2,
          }
          # Use a kamen-shaped flow source so channel gate passes, chat≠blender
          kamen_key = blender_key
          for row in ch.get("signal") or []:
              if not isinstance(row, dict):
                  continue
              name = str(row.get("name") or "")
              if "каменяр" in name.casefold():
                  kamen_key = str(row.get("key") or "")
                  break
          kamen["source_key"] = kamen_key
          kamen_flow = {
              **stub_flow,
              "sources": [kamen_key],
              "filters": {
                  **stub_flow["filters"],
                  "channels_include": [kamen_key],
              },
          }
          ok2, _ = match_flow(kamen_flow, kamen)
          print("kamen_unitless_ok=", ok2, flush=True)
          assert not ok2, "Каменярі must still drop unitless"
          print("BLENDER_ADMIT_OK", flush=True)
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
