name: Install Signal Flow app (Contabo)

# Clone private adrozdenko/signal-flow onto Contabo and pip-install sf-admin.
# Manual only. Does not rebuild Hermes. Does not print secrets or admin id.
# Install always restarts Signal ingest via systemd (Restart=always) when units
# ship in app/scripts; restores WA npm + wa-ingest only when bonded/ready.
# Never reports WA_INGEST=alive without ready/authenticated (HONEST_WA).
# Never starts bot-run.
# Stream sinks live in bot-signal/stream.json under DATA_ROOT (outside app/), so
# replacing app/ does not wipe default/arta/air; we verify after install.

on:
  workflow_dispatch:

jobs:
  install-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone signal-flow with deploy key
        env:
          DEPLOY_KEY: ${{ secrets.SIGNAL_FLOW_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/sf_deploy
          chmod 600 ~/.ssh/sf_deploy
          printf 'Host github.com\n  IdentityFile ~/.ssh/sf_deploy\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config
          git clone --depth 1 git@github.com:adrozdenko/signal-flow.git "$RUNNER_TEMP/signal-flow"
          rm -rf "$RUNNER_TEMP/signal-flow/.git"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/signal-flow.tgz" signal-flow

      - name: Install on Contabo under /opt/signal-flow/app
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          scp -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 \
            "$RUNNER_TEMP/signal-flow.tgz" root@5.189.159.195:/tmp/signal-flow.tgz
          ssh -o ServerAliveInterval=30 -o ConnectTimeout=30 \
              -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          STREAM_JSON="$DATA_ROOT/bot-signal/stream.json"
          PIDFILE=/tmp/sf-ingest-run.pid
          BOTPID=/tmp/sf-bot-run.pid
          LOG=/tmp/sf-ingest-run.log
          WAPID=/tmp/sf-wa-ingest.pid
          WALOG=/tmp/sf-wa-ingest.log
          LINKPID=/tmp/sf-wa-sidecar.pid
          HTTPPID=/tmp/sf-wa-qr-http.pid
          PORT=18080
          test -d "$DATA_ROOT/config" || { echo "layout missing; run install-signal-flow-layout first" >&2; exit 1; }

          # H2: note WA liveness before replace (app/ wipe kills sidecar modules)
          WA_WAS_ALIVE=0
          if [ -f "$WAPID" ] && kill -0 "$(cat "$WAPID")" 2>/dev/null; then
            WA_WAS_ALIVE=1
          elif pgrep -af 'sf-admin.*wa-ingest-run' >/dev/null 2>&1; then
            WA_WAS_ALIVE=1
          fi
          echo "WA_WAS_ALIVE=$WA_WAS_ALIVE"

          # Release .venv / Chromium locks before replace
          systemctl stop signal-flow-ingest.service 2>/dev/null || true
          systemctl stop signal-flow-wa-ingest.service 2>/dev/null || true
          for f in "$PIDFILE" "$BOTPID" "$WAPID" "$LINKPID" "$HTTPPID"; do
            if [ -f "$f" ]; then
              OLD=$(cat "$f" 2>/dev/null || true)
              [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null && kill "$OLD" 2>/dev/null || true
              rm -f "$f"
            fi
          done
          pkill -f 'sf-admin.* ingest-run' 2>/dev/null || true
          pkill -f 'sf-admin.*wa-ingest-run' 2>/dev/null || true
          pkill -f 'sf-admin.*bot-run' 2>/dev/null || true
          pkill -f 'signal-cli' 2>/dev/null || true
          pkill -f 'whatsapp_sidecar/connector.js' 2>/dev/null || true
          pkill -f 'sf-wa-qr-www' 2>/dev/null || true
          fuser -k "${PORT}/tcp" 2>/dev/null || true
          sleep 2
          tar -C "$DATA_ROOT" -xzf /tmp/signal-flow.tgz
          rm -rf "$APP"
          mv "$DATA_ROOT/signal-flow" "$APP"
          rm -f /tmp/signal-flow.tgz
          command -v python3 >/dev/null || { echo "python3 missing on host" >&2; exit 1; }
          python3 -m venv "$APP/.venv"
          "$APP/.venv/bin/pip" install -U pip
          "$APP/.venv/bin/pip" install -e "$APP"
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli list-users
          cat > /usr/local/bin/sf-admin <<'WRAP'
          #!/usr/bin/env bash
          exec /opt/signal-flow/app/.venv/bin/sf-admin --data-root /opt/signal-flow "$@"
          WRAP
          chmod 755 /usr/local/bin/sf-admin
          echo "install-signal-flow-app: pip done"

          # Install/refresh systemd units (Restart=always) from app/scripts
          echo "=== systemd units install ==="
          for u in signal-flow-ingest.service signal-flow-wa-ingest.service \
                   signal-flow-tmp-gc.service signal-flow-tmp-gc.timer; do
            if [ -f "$APP/scripts/$u" ]; then
              cp -f "$APP/scripts/$u" "/etc/systemd/system/$u"
              echo "UNIT_INSTALLED=$u"
            else
              echo "UNIT_MISSING=$u"
            fi
          done
          systemctl daemon-reload
          # Ops GC: reclaim /tmp/libsignal* every 30min (never touches LocalAuth/sessions)
          if [ -f /etc/systemd/system/signal-flow-tmp-gc.timer ]; then
            systemctl enable --now signal-flow-tmp-gc.timer
            systemctl start signal-flow-tmp-gc.service || true
            echo "TMP_GC_TIMER=$(systemctl is-active signal-flow-tmp-gc.timer 2>/dev/null || echo unknown)"
            systemctl list-timers --all 'signal-flow-tmp-gc*' 2>/dev/null | head -5 || true
          fi

          # Stream state is outside app/ (bot-signal/stream.json) — must survive replace
          echo "=== stream state path check ==="
          if [ -f "$STREAM_JSON" ]; then
            echo "STREAM_JSON=present path=$STREAM_JSON (outside app/; survived install)"
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("/opt/signal-flow/bot-signal/stream.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          targets = data.get("targets") or {}
          for key in ("default", "arta", "air"):
              t = targets.get(key) or {}
              en = bool(t.get("enabled")) and bool(str(t.get("group_id") or "").strip())
              name = (t.get("group_name") or "").strip() or "(unnamed)"
              # group names only — no phones, no full group ids
              print(f"  sink {key}: enabled={en} group_name={name}")
          missing = [k for k in ("default", "arta", "air")
                     if not (bool((targets.get(k) or {}).get("enabled"))
                             and bool(str((targets.get(k) or {}).get("group_id") or "").strip()))]
          if missing:
              print(f"WARN sinks not fully enabled: {','.join(missing)} — re-run stream-start for those targets")
          else:
              print("STREAM_SINKS=ok default,arta,air enabled")
          PY
          else
            echo "WARN STREAM_JSON=missing path=$STREAM_JSON — sinks wiped or never seeded; re-run stream-start"
          fi

          # Prefer systemd unit (same flags as signal-flow-ingest-start.yml)
          echo "=== ingest-start (post-install) ==="
          # bot-run must stay stopped (ingest owns delivery); never start bot-run
          if [ -f "$BOTPID" ]; then
            OLD=$(cat "$BOTPID" 2>/dev/null || true)
            [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null && kill "$OLD" 2>/dev/null || true
          fi
          pkill -f 'sf-admin.*bot-run' 2>/dev/null || true
          UNIT=signal-flow-ingest.service
          if [ -f "/etc/systemd/system/$UNIT" ]; then
            systemctl enable "$UNIT"
            systemctl restart "$UNIT"
            sleep 2
            if systemctl is-active --quiet "$UNIT"; then
              MAINPID=$(systemctl show -p MainPID --value "$UNIT" 2>/dev/null || echo 0)
              echo "$MAINPID" >"$PIDFILE"
              echo INGEST_RUN=alive pid=$MAINPID via=systemd
              echo SIGNAL_INGEST=alive pid=$MAINPID via=systemd
            else
              echo INGEST_RUN=dead
              echo SIGNAL_INGEST=dead
              journalctl -u "$UNIT" -n 40 --no-pager 2>/dev/null \
                | sed -E 's/\+?[0-9]{8,15}/[redacted]/g; /sgnl:\/\//d' || true
              exit 1
            fi
          else
            nohup env PYTHONUNBUFFERED=1 "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli \
              ingest-run self --receive-timeout 8 --idle-sleep 1 \
              >"$LOG" 2>&1 &
            echo $! >"$PIDFILE"
            sleep 2
            if kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
              echo INGEST_RUN=alive pid=$(cat "$PIDFILE") via=nohup
              echo SIGNAL_INGEST=alive pid=$(cat "$PIDFILE")
            else
              echo INGEST_RUN=dead
              echo SIGNAL_INGEST=dead
              sed -E 's/\+?[0-9]{8,15}/[redacted]/g; /sgnl:\/\//d' "$LOG" | tail -n 30 || true
              exit 1
            fi
          fi
          echo BOT_RUN=stopped
          sed -E 's/\+?[0-9]{8,15}/[redacted]/g; /sgnl:\/\//d' "$LOG" | tail -n 15 || true

          # H2: restore whatsapp_sidecar node_modules after app/ replace
          echo "=== wa npm restore (post-install) ==="
          SIDE="$APP/whatsapp_sidecar"
          if [ -f "$SIDE/connector.js" ]; then
            if [ ! -d "$SIDE/node_modules/whatsapp-web.js" ]; then
              echo "WA_NODE_MODULES_MISSING=1 — running npm ci"
              cd "$SIDE"
              if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi
              cd /
            fi
          else
            echo "WA_CONNECTOR=missing (skip npm)"
          fi
          node_modules_ok=0
          [ -f "$SIDE/connector.js" ] && [ -d "$SIDE/node_modules/whatsapp-web.js" ] && node_modules_ok=1
          echo "node_modules_ok=$node_modules_ok"

          # Restart wa-ingest if whatsapp[] configured OR WA was alive pre-replace
          WA_CONFIGURED=0
          WA_CONFIGURED=$(python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("/opt/signal-flow/users")
          configured = 0
          if root.is_dir():
              for ch in root.glob("*/channels.json"):
                  try:
                      data = json.loads(ch.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  rows = data.get("whatsapp") or []
                  if isinstance(rows, list) and any(
                      isinstance(r, dict) and str(r.get("key") or "").strip() for r in rows
                  ):
                      configured = 1
                      break
          print(configured)
          PY
          )
          echo "WA_CONFIGURED=$WA_CONFIGURED WA_WAS_ALIVE=$WA_WAS_ALIVE"

          WA_READY=0
          WAUNIT=signal-flow-wa-ingest.service
          if [ "$WA_CONFIGURED" = 1 ] || [ "$WA_WAS_ALIVE" = 1 ]; then
            echo "=== wa-ingest-start (post-install) ==="
            if [ ! -f "$SIDE/connector.js" ]; then
              echo "WA_INGEST=skipped_no_connector"
            elif [ "$node_modules_ok" != 1 ]; then
              echo "WA_INGEST=skipped_no_node_modules"
            elif ! "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli wa-ingest-run --help >/dev/null 2>&1; then
              echo "WA_INGEST=skipped_cli_missing"
            else
              : >"$WALOG"
              # Install unit always; enable+start only when we can confirm bond (avoid Restart loops on QR)
              if [ -f "/etc/systemd/system/$WAUNIT" ]; then
                systemctl enable "$WAUNIT"
                systemctl restart "$WAUNIT"
                sleep 2
                MAINPID=$(systemctl show -p MainPID --value "$WAUNIT" 2>/dev/null || echo 0)
                echo "$MAINPID" >"$WAPID"
                for i in $(seq 1 5); do
                  journalctl -u "$WAUNIT" -n 80 --no-pager 2>/dev/null >>"$WALOG" || true
                  sleep 1
                done
              else
                nohup env PYTHONUNBUFFERED=1 "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli \
                  wa-ingest-run self --receive-timeout 2 --idle-sleep 0.5 \
                  >"$WALOG" 2>&1 &
                echo $! >"$WAPID"
              fi
              READY=0
              for i in $(seq 1 90); do
                ALIVE=0
                if [ -f "/etc/systemd/system/$WAUNIT" ]; then
                  systemctl is-active --quiet "$WAUNIT" && ALIVE=1 || true
                  journalctl -u "$WAUNIT" -n 20 --no-pager 2>/dev/null >>"$WALOG" || true
                elif [ -f "$WAPID" ] && kill -0 "$(cat "$WAPID")" 2>/dev/null; then
                  ALIVE=1
                fi
                if [ "$ALIVE" != 1 ]; then
                  echo "WA_INGEST=dead during ready wait"
                  sed -E 's/\+?[0-9]{8,15}/[redacted]/g; s/[0-9]{6,}@(s\.whatsapp\.net|g\.us|lid|newsletter)/[redacted]/gi; /sgnl:\/\//d' "$WALOG" | tail -n 40 || true
                  READY=0
                  break
                fi
                if grep -qE 'event=sidecar_(ready|authenticated)' "$WALOG" 2>/dev/null \
                   || grep -qE '"type":"(ready|authenticated)"' "$WALOG" 2>/dev/null; then
                  READY=1
                  break
                fi
                if grep -qE 'event=sidecar_qr|потребує QR|немає node_modules|Chromium/Chrome не знайдено' "$WALOG" 2>/dev/null; then
                  echo "WA_INGEST=not_bonded"
                  systemctl stop "$WAUNIT" 2>/dev/null || true
                  systemctl disable "$WAUNIT" 2>/dev/null || true
                  READY=0
                  break
                fi
                sleep 1
              done
              if [ "$READY" = 1 ]; then
                WA_READY=1
                echo "WA_INGEST=alive pid=$(cat "$WAPID") ready=1"
              else
                # Honest: never WA_INGEST=alive without ready/authenticated
                echo "WA_INGEST=not_bonded"
                systemctl stop "$WAUNIT" 2>/dev/null || true
                systemctl disable "$WAUNIT" 2>/dev/null || true
                echo "WA_NOTE=scan QR via signal-flow-wa-live-qr (or wa-link) then wa-ingest-start; session not cleared"
              fi
            fi
          else
            echo "WA_INGEST=skipped_not_configured"
            systemctl disable "$WAUNIT" 2>/dev/null || true
          fi

          # Final scrubbed status markers — HONEST_WA: alive only if READY confirmed
          echo "HONEST_WA=1"
          if systemctl is-active --quiet signal-flow-ingest.service 2>/dev/null \
             || { [ -f "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; }; then
            echo "SIGNAL_INGEST=alive pid=$(cat "$PIDFILE" 2>/dev/null || echo systemd)"
          else
            echo "SIGNAL_INGEST=dead"
          fi
          if [ "$WA_READY" = 1 ]; then
            echo "WA_INGEST=alive pid=$(cat "$WAPID") ready=1"
          elif [ -f "$WAPID" ] && kill -0 "$(cat "$WAPID")" 2>/dev/null; then
            echo "WA_INGEST=not_bonded"
          else
            # keep last WA_INGEST= line already printed; ensure marker if none
            :
          fi
          echo "node_modules_ok=$node_modules_ok"
          echo BOT_RUN=stopped

          echo "=== stream-status (post-install) ==="
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli stream-status
          echo "install-signal-flow-app: done (Signal+WA ingest restored when applicable; bot-run stopped)"
          ls -la "$DATA_ROOT" "$APP" | head -40
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
          shred -u ~/.ssh/sf_deploy 2>/dev/null || rm -f ~/.ssh/sf_deploy
