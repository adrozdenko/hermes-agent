name: Signal Flow captcha noVNC (Contabo)

# Short-lived noVNC + Chromium on Contabo so an operator can solve
# https://signalcaptchas.org/registration/generate.html from a phone,
# using Contabo's public IP (same IP as signal-cli register).
# Manual workflow_dispatch only. Never rebuilds Hermes. Does NOT click
# Open Signal or solve the captcha.
#
# mode=start: install if needed, daemonize VNC/chrome/novnc, print URL/PASS,
#             schedule host teardown in 20 min, SSH exits within ~3 min.
# mode=status: read-only check of existing session (info.env / processes).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'start = create session; status = read-only check'
        required: true
        type: choice
        options:
          - start
          - status
        default: start

jobs:
  captcha-novnc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Contabo captcha noVNC (${{ inputs.mode }})
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST_KEY:-}" ]; then
            echo "Missing HERMES_SSH_KEY or HERMES_HOST_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts

          LOG=/tmp/sf-captcha-novnc.log
          MODE="${MODE:-start}"

          if [ "$MODE" = "status" ]; then
            stdbuf -oL -eL ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 \
                -i ~/.ssh/id_ed25519 root@5.189.159.195 \
                'stdbuf -oL -eL bash -s' <<'REMOTE_STATUS' | stdbuf -oL -eL tee "$LOG"
          set +e
          SESSION_DIR=/opt/signal-flow/captcha-session
          INFO="$SESSION_DIR/info.env"
          echo "MODE=status"
          if [ -f "$INFO" ]; then
            echo "INFO_ENV_PRESENT=1"
            # shellcheck disable=SC1090
            set -a
            # shellcheck source=/dev/null
            . "$INFO" 2>/dev/null || true
            set +a
            echo "NOVNC_URL=${NOVNC_URL:-}"
            echo "NOVNC_PASS=${NOVNC_PASS:-}"
            echo "STARTED_AT=${STARTED_AT:-}"
            echo "TEARDOWN_AT=${TEARDOWN_AT:-}"
            echo "CHROME_PID=${CHROME_PID:-}"
            echo "WS_PID=${WS_PID:-}"
            echo "CF_PID=${CF_PID:-}"
            echo "VNC_DISPLAY=${VNC_DISPLAY:-}"
          else
            echo "INFO_ENV_PRESENT=0"
            echo "NOVNC_URL="
            echo "NOVNC_PASS="
          fi
          echo "--- process/port check ---"
          ss -lntp 2>/dev/null | grep -E ':(6080|5999)\b' || netstat -lntp 2>/dev/null | grep -E ':(6080|5999)\b' || echo "no 6080/5999 listeners"
          pgrep -af 'Xvnc|tigervnc|websockify|cloudflared tunnel|chromium.*signalcaptchas|chrome.*signalcaptchas' 2>/dev/null | head -n 20 || echo "no matching processes"
          if [ -n "${NOVNC_URL:-}" ] && [ -n "${NOVNC_PASS:-}" ]; then
            echo "SESSION_LIVE=1"
          else
            echo "SESSION_LIVE=0"
          fi
          echo "STATUS_DONE=1"
          exit 0
          REMOTE_STATUS
          else
            # mode=start — daemonize everything; SSH must exit after markers (~3 min)
            stdbuf -oL -eL ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=12 \
                -i ~/.ssh/id_ed25519 root@5.189.159.195 \
                'stdbuf -oL -eL bash -s' <<'REMOTE_START' | stdbuf -oL -eL tee "$LOG"
          set -euo pipefail
          SESSION_DIR=/opt/signal-flow/captcha-session
          DISPLAY_NUM=99
          VNC_PORT=$((5900 + DISPLAY_NUM))
          NOVNC_PORT=6080
          GEOMETRY=1280x800
          HOLD_SECS=$((20 * 60))
          CAPTCHA_URL='https://signalcaptchas.org/registration/generate.html'

          mkdir -p "$SESSION_DIR"
          chmod 700 "$SESSION_DIR"

          # Kill any prior captcha session leftovers
          if [ -f "$SESSION_DIR/teardown.sh" ]; then
            bash "$SESSION_DIR/teardown.sh" 2>/dev/null || true
          fi
          pkill -f "cloudflared tunnel --url" 2>/dev/null || true
          pkill -f "websockify.*${NOVNC_PORT}" 2>/dev/null || true
          pkill -f "chromium.*signalcaptchas" 2>/dev/null || true
          pkill -f "chrome.*signalcaptchas" 2>/dev/null || true
          command -v tigervncserver >/dev/null 2>&1 && tigervncserver -kill ":${DISPLAY_NUM}" 2>/dev/null || true
          command -v vncserver >/dev/null 2>&1 && vncserver -kill ":${DISPLAY_NUM}" 2>/dev/null || true
          fuser -k "${VNC_PORT}/tcp" 2>/dev/null || true
          fuser -k "${NOVNC_PORT}/tcp" 2>/dev/null || true
          sleep 1

          export DEBIAN_FRONTEND=noninteractive
          need_apt=0
          if ! command -v tigervncserver >/dev/null 2>&1 && ! command -v vncserver >/dev/null 2>&1; then
            need_apt=1
          fi
          command -v websockify >/dev/null 2>&1 || need_apt=1
          [ -d /usr/share/novnc ] || need_apt=1
          CHROME_BIN=""
          for c in chromium-browser chromium google-chrome-stable google-chrome; do
            if command -v "$c" >/dev/null 2>&1; then CHROME_BIN="$(command -v "$c")"; break; fi
          done
          [ -n "$CHROME_BIN" ] || need_apt=1

          if [ "$need_apt" = 1 ]; then
            echo "apt: installing vnc/novnc/chromium deps"
            apt-get update -qq
            apt-get install -y -qq \
              tigervnc-standalone-server tigervnc-common \
              novnc websockify \
              dbus-x11 x11-utils \
              curl ca-certificates openssl coreutils || true
            apt-get install -y -qq chromium-browser 2>/dev/null \
              || apt-get install -y -qq chromium 2>/dev/null \
              || apt-get install -y -qq google-chrome-stable 2>/dev/null \
              || true
          fi

          CHROME_BIN=""
          for c in chromium-browser chromium google-chrome-stable google-chrome; do
            if command -v "$c" >/dev/null 2>&1; then CHROME_BIN="$(command -v "$c")"; break; fi
          done
          if [ -z "$CHROME_BIN" ]; then
            echo "chromium missing — fetching google-chrome-stable .deb"
            TMP=$(mktemp -d)
            curl -fsSL -o "$TMP/chrome.deb" \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            apt-get install -y -qq "$TMP/chrome.deb" || dpkg -i "$TMP/chrome.deb" || true
            apt-get install -f -y -qq || true
            rm -rf "$TMP"
            for c in google-chrome-stable google-chrome chromium-browser chromium; do
              if command -v "$c" >/dev/null 2>&1; then CHROME_BIN="$(command -v "$c")"; break; fi
            done
          fi
          if [ -z "$CHROME_BIN" ]; then
            echo "ERROR: no chromium/chrome binary" >&2
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN"

          NOVNC_WEB=""
          for d in /usr/share/novnc /usr/share/novnc/app /usr/share/webapps/novnc; do
            if [ -f "$d/vnc.html" ] || [ -f "$d/vnc_lite.html" ]; then NOVNC_WEB="$d"; break; fi
          done
          if [ -z "$NOVNC_WEB" ]; then
            echo "ERROR: noVNC web root not found" >&2
            exit 1
          fi
          echo "NOVNC_WEB=$NOVNC_WEB"

          VNC_PASS="$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 12)"
          if [ "${#VNC_PASS}" -lt 8 ]; then
            VNC_PASS="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 12)"
          fi
          PASS_FILE="$SESSION_DIR/vnc.pass"
          if command -v vncpasswd >/dev/null 2>&1; then
            printf '%s\n' "$VNC_PASS" | vncpasswd -f > "$PASS_FILE"
          else
            printf '%s' "$VNC_PASS" > "$PASS_FILE"
          fi
          chmod 600 "$PASS_FILE"

          export HOME="$SESSION_DIR"
          mkdir -p "$HOME/.vnc"
          cp -f "$PASS_FILE" "$HOME/.vnc/passwd"
          chmod 600 "$HOME/.vnc/passwd"
          cat > "$HOME/.vnc/xstartup" <<'XS'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          xsetroot -solid grey 2>/dev/null || true
          exec /bin/sh -c 'while true; do sleep 3600; done'
          XS
          chmod +x "$HOME/.vnc/xstartup"

          VNC_STARTED=0
          if command -v tigervncserver >/dev/null 2>&1; then
            if tigervncserver ":${DISPLAY_NUM}" -geometry "$GEOMETRY" -depth 24 \
                -localhost yes -SecurityTypes VncAuth -PasswordFile "$HOME/.vnc/passwd" \
                -xstartup "$HOME/.vnc/xstartup"; then
              VNC_STARTED=1
            fi
          fi
          if [ "$VNC_STARTED" != 1 ] && command -v vncserver >/dev/null 2>&1; then
            if vncserver ":${DISPLAY_NUM}" -geometry "$GEOMETRY" -depth 24 -localhost yes; then
              VNC_STARTED=1
            fi
          fi
          if [ "$VNC_STARTED" != 1 ]; then
            echo "ERROR: failed to start VNC on :${DISPLAY_NUM}" >&2
            exit 1
          fi
          echo "VNC_STARTED=1 display=:${DISPLAY_NUM} port=${VNC_PORT}"
          sleep 2

          if command -v dbus-launch >/dev/null 2>&1; then
            eval "$(dbus-launch --sh-syntax)" || true
          fi
          export DISPLAY=":${DISPLAY_NUM}"

          PROFILE="$SESSION_DIR/chrome-profile"
          mkdir -p "$PROFILE"
          # Fully detach: nohup + redirect + disown so SSH pipe can close
          nohup "$CHROME_BIN" \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --disable-software-rasterizer \
            --no-first-run \
            --no-default-browser-check \
            --disable-translate \
            --window-size=1280,800 \
            --user-data-dir="$PROFILE" \
            "$CAPTCHA_URL" \
            </dev/null >"$SESSION_DIR/chromium.log" 2>&1 &
          CHROME_PID=$!
          disown "$CHROME_PID" 2>/dev/null || true
          echo "CHROME_PID=$CHROME_PID"
          sleep 2

          # Bind on all interfaces so phone can use Contabo IP if trycloudflare is blocked.
          if command -v ufw >/dev/null 2>&1; then
            ufw allow "${NOVNC_PORT}/tcp" || true
            UFW_OPENED=1
            echo 1 > "$SESSION_DIR/ufw.opened"
          else
            UFW_OPENED=0
          fi
          # Contabo often uses iptables directly; open 6080 defensively.
          iptables -C INPUT -p tcp --dport "${NOVNC_PORT}" -j ACCEPT 2>/dev/null \
            || iptables -I INPUT -p tcp --dport "${NOVNC_PORT}" -j ACCEPT || true

          nohup websockify --web="$NOVNC_WEB" "0.0.0.0:${NOVNC_PORT}" "127.0.0.1:${VNC_PORT}" \
            </dev/null >"$SESSION_DIR/websockify.log" 2>&1 &
          WS_PID=$!
          disown "$WS_PID" 2>/dev/null || true
          echo "WS_PID=$WS_PID"
          sleep 2
          if ! kill -0 "$WS_PID" 2>/dev/null; then
            echo "ERROR: websockify failed" >&2
            tail -n 40 "$SESSION_DIR/websockify.log" || true
            exit 1
          fi

          DIRECT_URL="http://5.189.159.195:${NOVNC_PORT}/vnc.html"
          NOVNC_URL=""
          CF_PID=""
          ensure_cloudflared() {
            if command -v cloudflared >/dev/null 2>&1; then return 0; fi
            echo "installing cloudflared"
            curl -fsSL -o /usr/local/bin/cloudflared \
              "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
              && chmod +x /usr/local/bin/cloudflared
            command -v cloudflared >/dev/null 2>&1
          }

          if ensure_cloudflared; then
            CF_LOG="$SESSION_DIR/cloudflared.log"
            : > "$CF_LOG"
            nohup cloudflared tunnel --url "http://127.0.0.1:${NOVNC_PORT}" \
              </dev/null >"$CF_LOG" 2>&1 &
            CF_PID=$!
            disown "$CF_PID" 2>/dev/null || true
            echo "CF_PID=$CF_PID"
            for i in $(seq 1 40); do
              NOVNC_URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' "$CF_LOG" | head -n1 || true)"
              [ -n "$NOVNC_URL" ] && break
              kill -0 "$CF_PID" 2>/dev/null || { echo "cloudflared exited early"; tail -n 30 "$CF_LOG" || true; break; }
              sleep 1
            done
            if [ -n "$NOVNC_URL" ] && [ -f "$NOVNC_WEB/vnc.html" ]; then
              NOVNC_URL="${NOVNC_URL}/vnc.html"
            fi
          fi

          # Prefer direct Contabo IP for UA networks that block trycloudflare DNS.
          if [ -z "$NOVNC_URL" ]; then
            NOVNC_URL="$DIRECT_URL"
          fi
          echo "NOVNC_DIRECT_URL=${DIRECT_URL}"

          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TEARDOWN_AT="$(date -u -d "+${HOLD_SECS} seconds" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v+${HOLD_SECS}S +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || echo "")"

          # Teardown script
          cat > "$SESSION_DIR/teardown.sh" <<'TD'
          #!/bin/bash
          set +e
          SESSION_DIR=/opt/signal-flow/captcha-session
          DISPLAY_NUM=99
          NOVNC_PORT=6080
          VNC_PORT=$((5900 + DISPLAY_NUM))
          echo "=== tearing down captcha noVNC session ==="
          pkill -f "chromium.*signalcaptchas" 2>/dev/null
          pkill -f "chrome.*signalcaptchas" 2>/dev/null
          pkill -f "websockify.*${NOVNC_PORT}" 2>/dev/null
          pkill -f "cloudflared tunnel --url" 2>/dev/null
          command -v tigervncserver >/dev/null 2>&1 && tigervncserver -kill ":${DISPLAY_NUM}" 2>/dev/null
          command -v vncserver >/dev/null 2>&1 && vncserver -kill ":${DISPLAY_NUM}" 2>/dev/null
          if [ -f "$SESSION_DIR/ufw.opened" ]; then
            ufw delete allow "${NOVNC_PORT}/tcp" 2>/dev/null
            rm -f "$SESSION_DIR/ufw.opened"
          fi
          rm -f "$SESSION_DIR/info.env"
          echo "TEARDOWN_DONE=1" | tee "$SESSION_DIR/teardown.done"
          TD
          chmod 700 "$SESSION_DIR/teardown.sh"
          if [ "$UFW_OPENED" = 1 ]; then
            echo 1 > "$SESSION_DIR/ufw.opened"
          fi

          # Schedule auto-teardown on host (prefer systemd-run, else at, else nohup sleep)
          TEARDOWN_SCHED=""
          if command -v systemd-run >/dev/null 2>&1; then
            if systemd-run --on-active=20min --timer-property=AccuracySec=1s \
                /bin/bash "$SESSION_DIR/teardown.sh" 2>"$SESSION_DIR/teardown-sched.err"; then
              TEARDOWN_SCHED="systemd-run-20min"
            fi
          fi
          if [ -z "$TEARDOWN_SCHED" ] && command -v at >/dev/null 2>&1; then
            if echo "bash $SESSION_DIR/teardown.sh" | at now + 20 minutes 2>"$SESSION_DIR/teardown-sched.err"; then
              TEARDOWN_SCHED="at-20min"
            fi
          fi
          if [ -z "$TEARDOWN_SCHED" ]; then
            nohup bash -c "sleep ${HOLD_SECS}; bash '$SESSION_DIR/teardown.sh'" \
              </dev/null >"$SESSION_DIR/hold.log" 2>&1 &
            disown $! 2>/dev/null || true
            TEARDOWN_SCHED="nohup-sleep-${HOLD_SECS}"
          fi
          echo "TEARDOWN_SCHED=$TEARDOWN_SCHED"

          # Persist info.env (mode 600)
          umask 077
          cat > "$SESSION_DIR/info.env" <<INFO
          NOVNC_URL=${NOVNC_URL}
          NOVNC_PASS=${VNC_PASS}
          STARTED_AT=${STARTED_AT}
          TEARDOWN_AT=${TEARDOWN_AT}
          HOLD_SECS=${HOLD_SECS}
          CHROME_PID=${CHROME_PID}
          WS_PID=${WS_PID}
          CF_PID=${CF_PID:-}
          VNC_DISPLAY=:${DISPLAY_NUM}
          VNC_PORT=${VNC_PORT}
          NOVNC_PORT=${NOVNC_PORT}
          TEARDOWN_SCHED=${TEARDOWN_SCHED}
          INFO
          # Fix leading spaces from heredoc indent (YAML indent leaks into remote)
          sed -i 's/^[[:space:]]*//' "$SESSION_DIR/info.env" 2>/dev/null || \
            sed -i '' 's/^[[:space:]]*//' "$SESSION_DIR/info.env" 2>/dev/null || true
          chmod 600 "$SESSION_DIR/info.env"

          # Markers — must be last meaningful stdout before exit
          echo "NOVNC_URL=${NOVNC_URL}"
          echo "NOVNC_PASS=${VNC_PASS}"
          echo "NOVNC_DIRECT_URL=${DIRECT_URL}"
          echo "TEARDOWN_AT=${TEARDOWN_AT}"
          echo "SETUP_DONE=1"
          # Explicitly close leftover FDs / ignore children
          set +e
          exit 0
          REMOTE_START
          fi

          URL="$(grep '^NOVNC_URL=' "$LOG" | tail -n1 | sed 's/^NOVNC_URL=//' || true)"
          PASS="$(grep '^NOVNC_PASS=' "$LOG" | tail -n1 | sed 's/^NOVNC_PASS=//' || true)"
          DIRECT="$(grep '^NOVNC_DIRECT_URL=' "$LOG" | tail -n1 | sed 's/^NOVNC_DIRECT_URL=//' || true)"
          TEARDOWN="$(grep '^TEARDOWN_AT=' "$LOG" | tail -n1 | sed 's/^TEARDOWN_AT=//' || true)"
          LIVE="$(grep '^SESSION_LIVE=' "$LOG" | tail -n1 | sed 's/^SESSION_LIVE=//' || true)"

          if [ "$MODE" = "status" ]; then
            {
              echo "## Signal Flow captcha noVNC — status"
              echo ""
              if [ "${LIVE:-0}" = "1" ] && [ -n "$URL" ] && [ -n "$PASS" ]; then
                echo "- **SESSION_LIVE:** yes"
                echo "- **URL:** \`$URL\`"
                echo "- **VNC password:** \`$PASS\`"
                [ -n "$TEARDOWN" ] && echo "- **Teardown (UTC):** \`$TEARDOWN\`"
              else
                echo "- **SESSION_LIVE:** no (no info.env / incomplete)"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            echo "NOVNC_URL=${URL}"
            echo "NOVNC_PASS=${PASS}"
            [ -n "$TEARDOWN" ] && echo "TEARDOWN_AT=${TEARDOWN}"
            echo "SESSION_LIVE=${LIVE:-0}"
            shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
            exit 0
          fi

          if [ -z "$URL" ] || [ -z "$PASS" ]; then
            echo "Failed to capture NOVNC_URL/NOVNC_PASS from remote" >&2
            tail -n 120 "$LOG" || true
            shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
            exit 1
          fi

          {
            echo "## Signal Flow captcha noVNC"
            echo ""
            echo "- **URL:** \`$URL\`"
            echo "- **VNC password (one-time):** \`$PASS\`"
            echo "- **Hold:** ~20 minutes then auto-teardown on Contabo"
            [ -n "$TEARDOWN" ] && echo "- **Teardown (UTC):** \`$TEARDOWN\`"
            echo "- Open URL on phone → enter password → solve captcha page"
            echo "- Do **not** need to click Open Signal in the browser"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::NOVNC_URL=${URL}"
          echo "::notice::NOVNC_DIRECT_URL=${DIRECT}"
          echo "::notice::NOVNC_PASS=${PASS} (one-time VNC password; session ~20 min on Contabo)"
          echo "NOVNC_URL=${URL}"
          echo "NOVNC_DIRECT_URL=${DIRECT}"
          echo "NOVNC_PASS=${PASS}"
          [ -n "$TEARDOWN" ] && echo "TEARDOWN_AT=${TEARDOWN}"
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
