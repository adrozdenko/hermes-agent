name: Signal Flow flow-log diag11 (Contabo)

# Read-only: running ingest code vs disk, drop-key samples, 90m blender reasons,
# card 🔴 path. No pkill. Never phones/sgnl/SSH/excerpts.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Contabo running-vs-disk + drop dig
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          echo "=== PROC vs DISK ==="
          PIDFILE=/tmp/sf-ingest-run.pid
          if [ -f "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
            PID=$(cat "$PIDFILE")
            echo INGEST_PID=$PID
            ps -o pid,lstart,etime,cmd -p "$PID" 2>/dev/null | sed -E 's/\+?[0-9]{8,15}/[tel]/g' || true
            # Open file descriptors for ingest.py / flow_match.py (deleted?)
            ls -l /proc/$PID/fd 2>/dev/null | grep -E 'ingest\.py|flow_match\.py' | sed 's/.*-> /fd-> /' | head -20 || true
            # Compare inode of running mapped files if possible
            if [ -r /proc/$PID/maps ]; then
              echo "maps_ingest=$(grep -c 'sf/ingest.py' /proc/$PID/maps 2>/dev/null || echo 0)"
              echo "maps_flow_match=$(grep -c 'sf/flow_match.py' /proc/$PID/maps 2>/dev/null || echo 0)"
            fi
          else
            echo INGEST_RUN=dead
          fi
          for rel in sf/ingest.py sf/flow_match.py; do
            p="$APP/$rel"
            echo "disk_$rel mtime=$(date -u -r "$p" +%Y-%m-%dT%H:%M:%SZ) bytes=$(stat -c%s "$p")"
          done
          echo -n "disk_has__blender_admit="
          grep -q '_blender_admit' "$APP/sf/ingest.py" && echo yes || echo no
          echo -n "disk_has_blender_exempt="
          grep -q 'blender_exempt' "$APP/sf/ingest.py" && echo yes || echo no
          # Extract a fingerprint of admit logic from disk
          echo "admit_snip_lines:"
          grep -n '_blender_admit\|blender_exempt\|apply_channel_labels\|blender_source_keys' "$APP/sf/ingest.py" | head -20

          PYTHONPATH="$APP" "$APP/.venv/bin/python" - <<'PY'
          import json, re, os, time
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import sys
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.ingest import (
              resolve_ingest_user, channel_display_names, apply_channel_labels,
              format_match_card, is_blender_source,
          )
          from sf.flow_match import match_flow, blender_source_keys
          from sf.flows import ensure_default_flow
          from sf.paths import channels_path, flow_log_dir, ingest_cursor_path, user_dir
          from sf.units import extract_units

          def scrub(s):
              s = re.sub(r"\+?\d{8,15}", "[tel]", str(s or ""))
              s = re.sub(r"sgnl://\S+", "[sgnl]", s)
              return s

          def label_for(name: str) -> str:
              fold = (name or "").casefold()
              if "каменяр" in fold: return "kamenyari"
              if "альманах" in fold or "almanac" in fold: return "almanac"
              if "нейтрон" in fold or "neutron" in fold: return "neutron"
              if "блендер" in fold or "blender" in fold or "обтвр" in fold: return "blender"
              return "other"

          def key_prefix(k: str) -> str:
              k = str(k or "")
              return (k[:12] + "…") if len(k) > 12 else k

          root = Path("/opt/signal-flow")
          sid, _ = resolve_ingest_user(root, "self")
          flow = ensure_default_flow(root, sid)
          names = channel_display_names(root, sid)
          bkeys = sorted(blender_source_keys(names))
          print("blender_keys_n", len(bkeys), "prefixes", [key_prefix(k) for k in bkeys])

          # Card styling check for unit-matched blender
          bk = bkeys[0] if bkeys else None
          if bk:
              card = format_match_card(
                  flow_name="t",
                  source_key=bk,
                  reasons=["канал", "частини: 1 мсп"],
                  excerpt="stub unit hit",
                  source_label=names.get(bk),
                  blender=True,
              )
              has_red = "🔴" in card.body
              has_src = "Джерело:" in card.body
              # Don't print body; only flags
              print("card_has_red_emoji", has_red, "has_джерело", has_src, "styles_n", len(card.text_styles))

          print("=== CURSOR SEEN (scrubbed prefixes, last activity) ===")
          cur_p = ingest_cursor_path(root, sid)
          if cur_p.is_file():
              cur = json.loads(cur_p.read_text(encoding="utf-8"))
              seen = cur.get("seen") or {}
              print("cursor_updated", cur.get("updated_at"), "seen_n", len(seen) if isinstance(seen, dict) else "?")
              # Count seen keys by source prefix embedded in dedup key if possible
              # dedup_key format: flow_id|source_key|msg_id or similar
              by_lab = Counter()
              blender_seen = 0
              recent_blender = []
              label_of = {k: label_for(v) for k, v in names.items()}
              if isinstance(seen, dict):
                  for dk in seen:
                      # try find group: prefix inside dedup key
                      m = re.search(r"(group:[^|:\s]+)", str(dk))
                      if not m:
                          # alternate separators
                          m = re.search(r"(group:[A-Za-z0-9+/=_-]{6,})", str(dk))
                      sk = m.group(1) if m else ""
                      # trim if dedup appended more
                      if sk and sk not in label_of:
                          # try progressive trim to known keys
                          for kk in label_of:
                              if sk.startswith(kk) or kk.startswith(sk[:20]):
                                  sk = kk
                                  break
                      lab = label_of.get(sk, "unk")
                      by_lab[lab] += 1
                      if lab == "blender":
                          blender_seen += 1
              print("seen_by_label_approx", dict(by_lab))
              print("blender_seen_approx", blender_seen)
          else:
              print("cursor_missing")

          print("=== FLOW-LOG 90m blender reason mix ===")
          now = datetime.now(timezone.utc)
          cut = now - timedelta(minutes=90)
          label_of = {}
          ch = json.loads(channels_path(root, sid).read_text(encoding="utf-8"))
          for row in (ch.get("signal") or []):
              if isinstance(row, dict) and row.get("key"):
                  label_of[str(row["key"])] = label_for(str(row.get("name") or ""))
          rows = []
          for day in sorted({now.strftime("%Y-%m-%d"), cut.strftime("%Y-%m-%d")}):
              log = flow_log_dir(root, sid) / f"{day}.jsonl"
              if not log.is_file():
                  continue
              with log.open(encoding="utf-8", errors="replace") as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          r = json.loads(line)
                      except Exception:
                          continue
                      la = str(r.get("logged_at") or "")
                      try:
                          ts = datetime.fromisoformat(la.replace("Z", "+00:00"))
                          if ts.tzinfo is None:
                              ts = ts.replace(tzinfo=timezone.utc)
                      except Exception:
                          continue
                      if ts < cut:
                          continue
                      sk = str(r.get("source_key") or "")
                      lab = label_of.get(sk, "unk")
                      rs = [str(x) for x in (r.get("reasons") or [])]
                      rows.append({
                          "t": la[11:19] if len(la) >= 19 else la,
                          "lab": lab,
                          "sk": key_prefix(sk),
                          "targets": r.get("group_targets"),
                          "skipped": r.get("skipped_sinks") or [],
                          "fp": bool(r.get("dedup_fingerprint") or r.get("fingerprint_suppressed")),
                          "group_failed": bool(r.get("group_failed")),
                          "has_bl": any("блендер" in x for x in rs),
                          "has_unit": any("частини" in x for x in rs),
                          "has_nv": any("нв" in x for x in rs),
                          "has_fire": any("вогонь" in x for x in rs),
                          "reasons": "|".join(x[:50] for x in rs[:4]),
                      })
          print("rows_90m", len(rows), "by_label", dict(Counter(m["lab"] for m in rows)))
          br = [m for m in rows if m["lab"] == "blender"]
          print("blender_n", len(br))
          print("blender_has_блендер", sum(1 for m in br if m["has_bl"]))
          print("blender_has_unit", sum(1 for m in br if m["has_unit"]))
          print("blender_has_nv", sum(1 for m in br if m["has_nv"]))
          print("blender_has_fire", sum(1 for m in br if m["has_fire"]))
          print("blender_fp_skip", sum(1 for m in br if m["fp"] or any("fingerprint" in str(s) for s in m["skipped"])))
          print("blender_delivered", sum(1 for m in br if m.get("targets")))
          print("--- all blender 90m ---")
          for m in br:
              print({k: m[k] for k in ("t","sk","targets","skipped","fp","group_failed","has_bl","has_unit","has_nv","reasons")})

          print("=== INGEST LOG FULL (tiny?) ===")
          logp = Path("/tmp/sf-ingest-run.log")
          if logp.is_file():
              print("bytes", logp.stat().st_size, "age_s", int(time.time()-logp.stat().st_mtime))
              for ln in logp.read_text(errors="replace").splitlines():
                  s = scrub(ln)
                  if len(s) > 240: s = s[:240]+"…"
                  print(s)
          else:
              print("missing")

          # Older rotated logs?
          for p in sorted(Path("/tmp").glob("sf-ingest*"))[:20]:
              print("tmp", p.name, "bytes", p.stat().st_size, "age_s", int(time.time()-p.stat().st_mtime))

          print("=== LIST GROUPS SCRUBBED (name class + id prefix) ===")
          # Prefer channels.json only (already have). Also try signal-cli listGroups if safe — may lock.
          # Skip signal-cli to avoid lock; use channels + any cached group list files.
          for cand in [
              root / "bot-signal" / "groups.json",
              user_dir(root, sid) / "groups.json",
              Path("/tmp/sf-groups.json"),
          ]:
              print("groups_file", str(cand), "exists", cand.is_file())
              if cand.is_file():
                  try:
                      g = json.loads(cand.read_text(encoding="utf-8"))
                      items = g if isinstance(g, list) else (g.get("groups") or g.get("signal") or [])
                      print("groups_n", len(items) if isinstance(items, list) else type(items).__name__)
                      if isinstance(items, list):
                          for it in items[:30]:
                              if not isinstance(it, dict):
                                  continue
                              name = str(it.get("name") or it.get("title") or "")
                              gid = str(it.get("id") or it.get("groupId") or it.get("key") or "")
                              print("g", label_for(name), "name_len", len(name), "id_prefix", key_prefix(gid if gid.startswith("group:") else f"group:{gid}" if gid else ""))
                  except Exception as exc:
                      print("groups_err", type(exc).__name__)

          print("DIAG11_DONE")
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
