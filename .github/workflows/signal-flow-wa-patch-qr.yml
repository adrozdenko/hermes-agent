name: Signal Flow wa-patch-qr (Contabo)
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Patch QR size on Contabo connector
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          F=/opt/signal-flow/app/whatsapp_sidecar/connector.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/opt/signal-flow/app/whatsapp_sidecar/connector.js")
          t = p.read_text()
          t2 = t.replace(
              "await QRCode.toDataURL(qr, { margin: 2, width: 360 });",
              "await QRCode.toDataURL(qr, { margin: 4, width: 720, errorCorrectionLevel: 'H' });",
          ).replace(
              "await QRCode.toFile(qrPngPath, qr, { margin: 2, width: 360, type: 'png' });",
              "await QRCode.toFile(qrPngPath, qr, { margin: 4, width: 720, errorCorrectionLevel: 'H', type: 'png' });",
          )
          # also catch already-partial patches
          t2 = t2.replace("width: 360", "width: 720")
          p.write_text(t2)
          print("patched", p)
          PY
          # keep sidecar; next wa-link will restart
          echo PATCH_OK=1
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
