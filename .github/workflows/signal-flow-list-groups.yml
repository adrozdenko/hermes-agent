name: Signal Flow list-groups (Contabo)

# Print Signal group titles only (no ids pasted raw if phone-like; scrub numbers).
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: listGroups on personal session
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          PIDFILE=/tmp/sf-bot-run.pid
          if [ -f "$PIDFILE" ]; then
            OLD=$(cat "$PIDFILE" 2>/dev/null || true)
            [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null && kill "$OLD" 2>/dev/null || true
          fi
          pkill -f 'sf-admin.*bot-run' 2>/dev/null || true
          pkill -f 'signal-cli' 2>/dev/null || true
          sleep 2
          export PYTHONUNBUFFERED=1
          "$APP/.venv/bin/python" -u - <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.bot_link import signal_cli_bin, user_signal_session_dir
          from sf.ingest import read_session_account, resolve_ingest_user
          from sf.paths import channels_path
          from sf.flows import ensure_channels

          WANT = ("альманах", "каменяр", "нейтрон", "блендер", "обтвр", "almanac", "neutron", "blender")

          def scrub(s: str) -> str:
              return re.sub(r"\+?\d{8,15}", "[redacted]", s or "")

          root = Path("/opt/signal-flow")
          signal_id, _ = resolve_ingest_user(root, "self")
          sess = user_signal_session_dir(root, signal_id)
          account = read_session_account(sess) or ""
          bin_path = signal_cli_bin()
          print("account_ok=", bool(account), "cli=", bool(bin_path), flush=True)

          # channels.json titles if any
          ch = ensure_channels(root, signal_id)
          sig_rows = ch.get("signal") if isinstance(ch, dict) else []
          print("channels_signal_n=", len(sig_rows) if isinstance(sig_rows, list) else 0, flush=True)
          if isinstance(sig_rows, list):
              for row in sig_rows[:40]:
                  if not isinstance(row, dict):
                      continue
                  title = scrub(str(row.get("title") or row.get("name") or ""))
                  key = scrub(str(row.get("key") or row.get("id") or ""))[:48]
                  print(f"channel_row title={title!r} key={key!r}", flush=True)

          cmd = [bin_path, "-a", account, "--config", str(sess), "-o", "json", "listGroups"]
          proc = subprocess.run(cmd, capture_output=True, text=True, timeout=90, start_new_session=True)
          print("listGroups_rc=", proc.returncode, flush=True)
          err = scrub((proc.stderr or "").strip())[-240:]
          if err:
              print("stderr=", err, flush=True)
          raw = (proc.stdout or "").strip()
          groups = []
          if raw:
              try:
                  payload = json.loads(raw)
                  if isinstance(payload, list):
                      groups = payload
                  elif isinstance(payload, dict):
                      groups = payload.get("groups") or payload.get("result") or []
              except json.JSONDecodeError:
                  # plain-text fallback: one group per block
                  print("json_parse_fail plain_lines=", len(raw.splitlines()), flush=True)
                  for line in raw.splitlines():
                      print("plain=", scrub(line)[:160], flush=True)
          print("groups_n=", len(groups) if isinstance(groups, list) else 0, flush=True)
          hits = {w: [] for w in ("Альманах", "Каменярі", "Нейтрон", "Блендер")}
          if isinstance(groups, list):
              for g in groups:
                  if not isinstance(g, dict):
                      continue
                  name = str(g.get("name") or g.get("title") or "")
                  gid = str(g.get("id") or g.get("groupId") or "")[:20]
                  fold = name.casefold()
                  print(f"group name={scrub(name)!r} id_prefix={gid!r}", flush=True)
                  if "альманах" in fold or "almanac" in fold:
                      hits["Альманах"].append(name)
                  if "каменяр" in fold:
                      hits["Каменярі"].append(name)
                  if "нейтрон" in fold or "neutron" in fold:
                      hits["Нейтрон"].append(name)
                  if "блендер" in fold or "blender" in fold or "обтвр" in fold:
                      hits["Блендер"].append(name)
          for label, names in hits.items():
              print(f"HIT_{label}=", bool(names), "n=", len(names), "names=", [scrub(n) for n in names][:5], flush=True)
          print("PROBE_DONE", flush=True)
          PY
          nohup env PYTHONUNBUFFERED=1 "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli bot-run \
            >/tmp/sf-bot-run.log 2>&1 &
          echo $! >/tmp/sf-bot-run.pid
          echo BOT_RUN=restarted
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
