name: Signal Flow match-one scrubbed (Contabo)
on:
  workflow_dispatch:
    inputs:
      text_b64:
        description: "base64 utf-8 of message text only"
        required: true
        type: string
      chat_label:
        description: "optional source chat label (e.g. Блендер 2.0)"
        required: false
        default: "Блендер 2.0"
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Scrubbed match_flow on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          TEXT_B64: ${{ inputs.text_b64 }}
          CHAT_LABEL: ${{ inputs.chat_label }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 \
            "TEXT_B64=$(printf %q "$TEXT_B64") CHAT_LABEL=$(printf %q "$CHAT_LABEL") bash -s" <<'REMOTE'
          set -euo pipefail
          PYTHONPATH=/opt/signal-flow/app /opt/signal-flow/app/.venv/bin/python - <<'PY'
          import base64, json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.flows import ensure_default_flow
          from sf.ingest import apply_channel_labels, channel_display_names, resolve_ingest_user
          from sf.flow_match import is_blender_source, match_flow, message_source_key
          from sf.topics import classify_stream_targets, has_unknown_unit_nv, has_fire_control
          from sf.units import extract_units, message_has_selected_units
          from sf.stream import load_stream_state, resolve_delivery_targets, stream_is_live

          def scrub(s):
              s = re.sub(r"\+?\d{8,15}", "[tel]", str(s or ""))
              s = re.sub(r"sgnl://\S+", "[sgnl]", s)
              return s

          root = Path("/opt/signal-flow")
          sid, _ = resolve_ingest_user(root, "self")
          flow = ensure_default_flow(root, sid)
          names = channel_display_names(root, sid)
          # find blender key
          blender_key = None
          for k, n in names.items():
              fold = (n or "").casefold()
              if "блендер" in fold or "blender" in fold or "обтвр" in fold:
                  blender_key = k
                  break
          text = base64.b64decode(os.environ["TEXT_B64"]).decode("utf-8")
          chat = (os.environ.get("CHAT_LABEL") or "Блендер 2.0").strip()
          msg = {
              "source_key": blender_key or "group:blender-probe",
              "chat": "Група opaque…",
              "text": text,
              "id": "probe-one",
              "timestamp": 1,
          }
          msg = apply_channel_labels(msg, names if blender_key else {msg["source_key"]: chat})
          # if not wired, force label
          if not blender_key:
              msg["chat"] = chat
              msg["source_label"] = chat
              msg["_blender_admit"] = True
          ok, reasons = match_flow(flow, msg)
          units = extract_units(text)
          units_sel = list((flow.get("filters") or {}).get("units") or [])
          ok_u, hits = message_has_selected_units(text, units_sel)
          topics = sorted(classify_stream_targets(text, units=units))
          st = load_stream_state(root)
          deliver, skips = [], []
          if stream_is_live(st):
              deliver, skips = resolve_delivery_targets(st, frozenset(topics))
          print("blender_wired", bool(blender_key))
          print("is_blender", is_blender_source(msg))
          print("chat_set", scrub(str(msg.get("chat") or ""))[:40])
          print("filter_ok", ok)
          print("reasons", "|".join(scrub(r) for r in reasons))
          print("nv", has_unknown_unit_nv(text))
          print("fire", has_fire_control(text))
          print("units_extract_n", len(units))
          print("units_sel_hit", ok_u, "hits", ",".join(hits[:5]))
          print("topics", ",".join(topics) or "(default)")
          print("deliver", ",".join(d.get("key","") for d in deliver) or "(none)")
          print("skips_n", len(skips))
          # would own-60 drop? only if match code does that - report 60 mention
          print("mentions_60_ombr", "60 омбр" in text.casefold() or "60 ОМБр" in text)
          print("MATCH_ONE_DONE")
          PY
          REMOTE
