name: Signal Flow verify AIR tighten (Contabo)

# Scrubbed stub: bare дрон/БПЛА → not air; вылет/зумир → air; опБпС → air.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify tightened AIR routing on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          echo "=== processes ==="
          if [ -f /tmp/sf-ingest-run.pid ] && kill -0 "$(cat /tmp/sf-ingest-run.pid)" 2>/dev/null; then
            echo INGEST_RUN=alive pid=$(cat /tmp/sf-ingest-run.pid)
          else
            echo INGEST_RUN=not_running
            exit 1
          fi
          echo "=== no bare бпла/дрон in _AIR_PATTERNS ==="
          grep -n '_AIR_PATTERNS' -A 40 "$APP/sf/topics.py" | sed -n '1,45p'
          echo "=== scrubbed stub classify ==="
          export PYTHONUNBUFFERED=1
          "$APP/.venv/bin/python" -u - <<'PY'
          import sys
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.topics import (
              _AIR_PATTERNS,
              classify_stream_targets,
              classify_topics,
          )
          from sf.units import extract_units

          bare = ("бпла", r"бпл[аa]", r"дрон\w*")
          print("bare_in_patterns=", [p for p in _AIR_PATTERNS if p in bare], flush=True)
          assert not any(p in bare for p in _AIR_PATTERNS), _AIR_PATTERNS

          for sample in ("дрон", "ворожий дрон над позицією", "БПЛА", "БПЛА на маршруті"):
              t = classify_topics(sample)
              print("bare=", sample, "targets=", sorted(t), flush=True)
              assert "air" not in t, (sample, t)
              assert classify_stream_targets(sample, units=[]) == frozenset()

          for sample in ("вылет на маршрут", "прозумируй район", "виліт на маршрут"):
              t = classify_topics(sample)
              print("strong=", sample, "targets=", sorted(t), flush=True)
              assert t == frozenset({"air"}), (sample, t)

          unit = "71 опБпС вихід"
          u = extract_units(unit)
          ut = classify_stream_targets(unit, units=u)
          print("unit_targets=", sorted(ut), "units=", u, flush=True)
          assert ut == frozenset({"air"}), (ut, u)

          print("VERIFY_OK", flush=True)
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
