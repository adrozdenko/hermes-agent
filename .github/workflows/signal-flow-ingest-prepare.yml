name: Signal Flow ingest-prepare (Contabo)

# Seed self channels + default flow: keyword + chat:self. No phones in logs.
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Smoke keyword (default SFTOKEN)"
        required: false
        default: "SFTOKEN"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Seed default flow for self
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          KEYWORD: ${{ inputs.keyword || 'SFTOKEN' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 \
            "KEYWORD=$(printf %q "$KEYWORD") bash -s" <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          export PYTHONUNBUFFERED=1
          "$APP/.venv/bin/python" -u - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.bot_link import is_account_linked, user_signal_session_dir
          from sf.flows import ensure_channels, ensure_default_flow, save_default_flow
          from sf.ingest import resolve_ingest_user
          from sf.templates import CHAT_SELF_KEY

          root = Path("/opt/signal-flow")
          keyword = (os.environ.get("KEYWORD") or "SFTOKEN").strip() or "SFTOKEN"
          signal_id, note_to_self = resolve_ingest_user(root, "self")
          sess = user_signal_session_dir(root, signal_id)
          print("note_to_self=", note_to_self, flush=True)
          print("session_linked=", is_account_linked(sess), flush=True)
          if not is_account_linked(sess):
              raise SystemExit("personal session not linked — run 2c first")

          ensure_channels(root, signal_id)
          flow = ensure_default_flow(root, signal_id)
          flow["enabled"] = True
          flow["sources"] = [CHAT_SELF_KEY]
          filt = dict(flow.get("filters") or {})
          filt["keywords"] = [keyword]
          filt["channels_include"] = list(filt.get("channels_include") or [])
          filt["channels_exclude"] = list(filt.get("channels_exclude") or [])
          filt["aoi"] = list(filt.get("aoi") or [])
          flow["filters"] = filt
          # keep sinks as dict form from template
          sinks = flow.get("sinks")
          if not isinstance(sinks, dict):
              flow["sinks"] = {"bot_dm": True, "flow_log": True}
          save_default_flow(root, signal_id, flow)
          print(
              "flow_ready=True",
              "keyword_len=", len(keyword),
              "sources=", flow["sources"],
              "enabled=", flow.get("enabled"),
              flush=True,
          )
          print("PREPARE_OK", flush=True)
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
