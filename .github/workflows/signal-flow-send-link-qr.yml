name: Signal Flow send-link-qr (Contabo)

# Ops: product QR DM to Note to Self (self / note-to-self). No phones in logs.
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: "self | note-to-self (default self). Do not put phone numbers."
        required: false
        default: "self"
      timeout:
        description: "Link wait seconds after QR"
        required: false
        default: "180"

jobs:
  send-qr:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: send-link-qr on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          RECIPIENT: ${{ inputs.recipient || 'self' }}
          LINK_TIMEOUT: ${{ inputs.timeout || '180' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          # Pass recipient/timeout as env into remote (no secrets)
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -i ~/.ssh/id_ed25519 root@5.189.159.195 \
            "RECIPIENT=$(printf %q "$RECIPIENT") LINK_TIMEOUT=$(printf %q "$LINK_TIMEOUT") bash -s" <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          PIDFILE=/tmp/sf-bot-run.pid
          LOG=/tmp/sf-bot-run.log
          RECIPIENT="${RECIPIENT:-self}"
          LINK_TIMEOUT="${LINK_TIMEOUT:-180}"
          case "$RECIPIENT" in
            self|note-to-self) ;;
            *) echo "recipient_rejected=only_self_aliases"; exit 1 ;;
          esac
          # Pause listener (free bot-signal lock if any)
          if [ -f "$PIDFILE" ]; then
            OLD=$(cat "$PIDFILE" 2>/dev/null || true)
            if [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null; then
              kill "$OLD" 2>/dev/null || true
              sleep 1
            fi
          fi
          pkill -f 'sf-admin.*bot-run' 2>/dev/null || true
          sleep 1
          echo "send_link_qr_start recipient=$RECIPIENT timeout=$LINK_TIMEOUT"
          set +e
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli \
            send-link-qr "$RECIPIENT" --start-link --timeout "$LINK_TIMEOUT" \
            > /tmp/sf-send-link-qr.out 2>&1
          RC=$?
          set -e
          # Scrub phones from output before printing
          python3 - <<'PY'
          import re
          from pathlib import Path
          raw = Path("/tmp/sf-send-link-qr.out").read_text(errors="replace")
          scrubbed = re.sub(r"\+?\d{8,15}", "[redacted]", raw)
          scrubbed = re.sub(r"sgnl://\S+", "sgnl://[redacted]", scrubbed)
          for line in scrubbed.splitlines()[-40:]:
              print(line)
          PY
          echo "send_link_qr_rc=$RC"
          export PYTHONUNBUFFERED=1
          nohup env PYTHONUNBUFFERED=1 "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli bot-run \
            >"$LOG" 2>&1 &
          echo $! > "$PIDFILE"
          sleep 2
          if kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
            echo "BOT_RUN=restarted pid=$(cat "$PIDFILE")"
          else
            echo "BOT_RUN=restart_failed"
            tail -n 20 "$LOG" || true
          fi
          exit "$RC"
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
