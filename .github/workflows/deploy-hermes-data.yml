name: Deploy Hermes Data to Contabo

on:
  workflow_dispatch:

jobs:
  deploy-data:
    runs-on: ubuntu-latest
    steps:
      - name: Pull live hermes-data checkout and restart Adelia
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
              -o TCPKeepAlive=yes -o ConnectTimeout=45 \
              -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -se' <<'REMOTE'
          set -euxo pipefail

          patch_soul() {
            root="$1"
            soul="$root/profiles/adelia/SOUL.md"
            [ -f "$soul" ] || return 0
            python3 - "$soul" <<'PYEOF'
from pathlib import Path
import sys
path = Path(sys.argv[1])
text = path.read_text(encoding='utf-8')
marker = 'export_visual.py'
paragraph = ('\nЯкщо під час створення сторіс/поста системний Chromium або браузерний скріншот недоступний, '
             'це не фінальний результат і не причина віддавати лише HTML. Не кажи користувачу «Chromium немає» '
             'як завершення задачі. Створи фінальний SVG-макет у workspace і конвертуй його у PNG через '
             '`/opt/data/skills/smm/instagram-visual-workflow/scripts/export_visual.py`. Тільки якщо браузерний шлях '
             'і SVG->PNG fallback обидва провалилися, коротко назви точну технічну помилку.\n')
if marker not in text:
    needle = 'Згенеровані зображення для постів мають бути brand-safe і copyright-safe.\n'
    if needle in text:
        text = text.replace(needle, needle + paragraph, 1)
    else:
        text = text.rstrip() + '\n' + paragraph
    path.write_text(text, encoding='utf-8')
PYEOF
          }

          update_root() {
            root="$1"
            [ -d "$root" ] || return 1
            [ -d "$root/.git" ] || return 1
            git config --global --add safe.directory "$root" || true
            git -C "$root" fetch origin master
            git -C "$root" checkout origin/master -- skills/smm/instagram-visual-workflow
            chmod +x "$root/skills/smm/instagram-visual-workflow/scripts/export_visual.py"

            if [ -d "$root/skills/instagram-visual-workflow" ]; then
              cp "$root/skills/smm/instagram-visual-workflow/SKILL.md" "$root/skills/instagram-visual-workflow/SKILL.md"
              mkdir -p "$root/skills/instagram-visual-workflow/scripts"
              cp "$root/skills/smm/instagram-visual-workflow/scripts/export_visual.py" "$root/skills/instagram-visual-workflow/scripts/export_visual.py"
              chmod +x "$root/skills/instagram-visual-workflow/scripts/export_visual.py"
            fi
            patch_soul "$root"
          }

          UPDATED=0
          update_root /opt/hermes/clients/adelia && UPDATED=1 || true
          update_root /opt/data && UPDATED=1 || true
          test "$UPDATED" = 1

          docker ps -a --format '{{.Names}} {{.Status}}' | grep -E 'hermes|adelia' || true
          docker exec hermes-adelia sh -lc 'python3 -m py_compile /opt/data/skills/smm/instagram-visual-workflow/scripts/export_visual.py && test -x /opt/data/skills/smm/instagram-visual-workflow/scripts/export_visual.py && grep -q export_visual.py /opt/data/profiles/adelia/SOUL.md'
          docker exec hermes-adelia /command/s6-svc -t /run/service/gateway-default
          sleep 5
          docker exec hermes-adelia /command/s6-svstat /run/service/gateway-default
          REMOTE
