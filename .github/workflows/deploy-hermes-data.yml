          scp "${SSH_OPTS[@]}" /tmp/adelia-smm-brand-system-28f8197.tgz root@5.189.159.195:/tmp/adelia-smm-brand-system-28f8197.tgz
          ssh "${SSH_OPTS[@]}" root@5.189.159.195 'bash -s' <<'REMOTE'
