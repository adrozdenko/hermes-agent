          patch_soul_file() {
            soul="$1"
            [ -f "$soul" ] || return 0
            if ! grep -q 'export_visual.py' "$soul"; then
              printf '
          %s
          ' 'Якщо під час створення сторіс/поста системний Chromium або браузерний скріншот недоступний, це не фінальний результат і не причина віддавати лише HTML. Не кажи користувачу «Chromium немає» як завершення задачі. Створи фінальний SVG-макет у workspace і конвертуй його у PNG через `/opt/data/skills/smm/instagram-visual-workflow/scripts/export_visual.py`. Тільки якщо браузерний шлях і SVG->PNG fallback обидва провалилися, коротко назви точну технічну помилку.' >> "$soul"
            fi
          }

          patch_soul() {
            root="$1"
            patch_soul_file "$root/SOUL.md"
            patch_soul_file "$root/profiles/adelia/SOUL.md"
          }

          deploy_root() {
            root="$1"
            [ -d "$root" ] || return 0
            rm -rf "$root/skills/smm/instagram-visual-workflow"
            tar -xzf "$PAYLOAD" -C "$root"
