            rm -rf "$TARGET/skills/instagram-visual-workflow"
            cp -a "$TARGET/skills/smm/instagram-visual-workflow" "$TARGET/skills/instagram-visual-workflow"
          fi

          patch_soul_file() {
            soul="$1"
            [ -f "$soul" ] || return 0
            if ! grep -q 'adelia-brand-system' "$soul"; then
              printf '
%s
' 'Для SMM-візуалів: SVG — основний production source (`story.svg`, `post.svg`, `carousel-01.svg`). Перед макетом завжди завантажуй `adelia-brand-system`, використовуй Adelia brand tokens (palette, fonts, spacing, overlays, CTA/footer), записуй token preset/overrides у brief, а згенеровані зображення тримай в одному стилі з цими tokens.' >> "$soul"
            fi
          }
          patch_soul_file "$TARGET/SOUL.md"
          patch_soul_file "$TARGET/profiles/adelia/SOUL.md"

          test -f "$TARGET/skills/smm/adelia-brand-system/SKILL.md"
          test -f "$TARGET/skills/smm/adelia-brand-system/references/adelia-svg-tokens.css"
          test -x "$TARGET/skills/smm/instagram-visual-workflow/scripts/export_visual.py"
          grep -q 'adelia-brand-system' "$TARGET/SOUL.md"

          docker exec hermes-adelia sh -lc 'test -f /opt/data/skills/smm/adelia-brand-system/SKILL.md && test -f /opt/data/skills/smm/adelia-brand-system/references/adelia-svg-tokens.css && python3 -m py_compile /opt/data/skills/smm/instagram-visual-workflow/scripts/export_visual.py && grep -q adelia-brand-system /opt/data/SOUL.md'
          docker exec hermes-adelia /command/s6-svc -t /run/service/gateway-default
          sleep 5
          docker exec hermes-adelia /command/s6-svstat /run/service/gateway-default
