          TARGET=/opt/hermes/clients/adelia
          PAYLOAD=/tmp/adelia-smm-brand-system-28f8197.tgz
          mkdir -p "$TARGET"
          tar -tzf "$PAYLOAD" >/dev/null

          for path in             skills/smm/adelia-brand-system             skills/smm/instagram-visual-workflow             skills/smm/salon-content-pack             skills/smm/salon-photo-style-system             skills/smm/salon-post-image-generation             skills/smm/salon-story-visual-design
