name: Signal Flow flow-log diag6 (Contabo)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: 488 window + attach + health (scrubbed)
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          PYTHONPATH=/opt/signal-flow/app /opt/signal-flow/app/.venv/bin/python - <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path
          from collections import Counter
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.ingest import resolve_ingest_user
          from sf.paths import user_dir, channels_path, flow_log_dir
          from sf.stream import load_stream_state, stream_is_live

          def scrub(s: str) -> str:
              s = re.sub(r"\+?\d{8,15}", "[tel]", str(s or ""))
              s = re.sub(r"sgnl://\S+", "[sgnl]", s)
              return s

          def label_for(name: str) -> str:
              fold = (name or "").casefold()
              if "каменяр" in fold:
                  return "kamenyari"
              if "альманах" in fold or "almanac" in fold:
                  return "almanac"
              if "нейтрон" in fold or "neutron" in fold:
                  return "neutron"
              if "блендер" in fold or "blender" in fold:
                  return "blender"
              return "other"

          root = Path("/opt/signal-flow")
          sid, _ = resolve_ingest_user(root, "self")
          ud = user_dir(root, sid)
          log = flow_log_dir(root, sid) / "2026-09-25.jsonl"

          label_of = {}
          try:
              ch = json.loads(channels_path(root, sid).read_text(encoding="utf-8"))
              for row in (ch.get("signal") or []):
                  if isinstance(row, dict) and row.get("key"):
                      label_of[str(row["key"])] = label_for(str(row.get("name") or ""))
          except Exception as exc:
              print("channels_err", type(exc).__name__)
          print("channel_labels_n", len(label_of), "set", sorted(set(label_of.values())))

          rows = []
          if log.is_file():
              with log.open(encoding="utf-8", errors="replace") as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          rows.append(json.loads(line))
                      except Exception:
                          pass
          print("flowlog_rows", len(rows), "log_bytes", log.stat().st_size if log.is_file() else 0)

          win = []
          for r in rows:
              la = str(r.get("logged_at") or "")
              if not la.startswith("2026-09-25T17:"):
                  continue
              hhmm = la[11:16] if len(la) >= 16 else ""
              if hhmm < "17:30" or hhmm > "17:45":
                  continue
              rs = r.get("reasons") or []
              sk = str(r.get("source_key") or "")
              win.append({
                  "t": la[11:19] if len(la) >= 19 else la,
                  "lab": label_of.get(sk, "unk"),
                  "r488": any("488" in str(x) for x in rs),
                  "r144": any("144" in str(x) for x in rs),
                  "r254": any("254" in str(x) for x in rs),
                  "targets": r.get("group_targets"),
                  "skipped": r.get("skipped_sinks"),
                  "dedup": bool(r.get("dedup_fingerprint")),
              })

          print("window_17:30_17:45Z_n", len(win))
          print("window_by_label", dict(Counter(m["lab"] for m in win)))
          print("window_by_target", dict(Counter(str(t) for m in win for t in (m["targets"] or ["(none)"]))))
          print("window_skip_classes", dict(Counter(str(s).split(":")[0] for m in win for s in (m["skipped"] or []))))
          print("=== window rows ===")
          for m in win:
              print({k: m[k] for k in ("t", "lab", "r488", "r144", "r254", "targets", "skipped", "dedup")})

          km = [m for m in win if m["lab"] == "kamenyari" and m["r488"]]
          print("kamenyari_488_in_window", len(km))
          for m in km:
              print("KM488", m["t"], "targets=", m["targets"], "skipped=", m["skipped"], "dedup=", m["dedup"])

          r488 = [m for m in win if m["r488"]]
          print("any_488_in_window", len(r488))
          for m in r488:
              print("R488", m["t"], "lab=", m["lab"], "targets=", m["targets"], "skipped=", m["skipped"])

          by = Counter()
          for r in rows:
              rs = r.get("reasons") or []
              if not any("488" in str(x) for x in rs):
                  continue
              lab = label_of.get(str(r.get("source_key") or ""), "unk")
              for t in (r.get("group_targets") or ["(none)"]):
                  by[f"{lab}->{t}"] += 1
          print("488_label_to_target_today", dict(sorted(by.items())))

          found = []
          for c in list(Path("/tmp").glob("sf-ingest*")) + [
              ud / "data" / "ingest.log",
              Path("/var/log/signal-flow/ingest.log"),
          ]:
              if c.is_file():
                  found.append(c)
          print("ingest_log_candidates", [(c.name, c.stat().st_size) for c in found])

          attach_missing = 0
          group_sent = Counter()
          group_err = Counter()
          with_att = 0
          for c in found:
              for ln in c.read_text(errors="replace").splitlines():
                  if "attach_missing" in ln:
                      attach_missing += 1
                  if "group_sent:" in ln:
                      m = re.search(r"group_sent:(\w+)", ln)
                      if m:
                          group_sent[m.group(1)] += 1
                      if "attach" in ln:
                          with_att += 1
                  if "group_error:" in ln:
                      m = re.search(r"group_error:(\w+)", ln)
                      sink = m.group(1) if m else "?"
                      if "Invalid group id" in ln or "base64" in ln:
                          cls = "bad_group_id"
                      elif "LockedException" in ln or "Config file is in use" in ln:
                          cls = "locked"
                      elif "Unauthorized" in ln:
                          cls = "unauthorized"
                      else:
                          cls = "other"
                      group_err[f"{sink}:{cls}"] += 1
          print("attach_missing_lines", attach_missing)
          print("group_sent_by_sink", dict(group_sent))
          print("group_sent_lines_mentioning_attach", with_att)
          print("group_err_classes", dict(group_err))

          st = load_stream_state(root)
          print("stream_live", stream_is_live(st), "updated", st.get("updated_at"))
          targets = st.get("targets") or {}
          for k in ("default", "arta", "air"):
              t = targets.get(k) or {}
              gid = str(t.get("group_id") or "")
              looks_b64 = bool(re.fullmatch(r"[A-Za-z0-9+/=_-]{16,}", gid))
              print(
                  f"sink_{k}",
                  "en=", bool(t.get("enabled")),
                  "gid_len=", len(gid),
                  "gid_b64ish=", looks_b64,
                  "name_set=", bool(t.get("group_name")),
              )

          def pgrep(pat: str):
              r = subprocess.run(["pgrep", "-af", pat], capture_output=True, text=True)
              lines = [scrub(x) for x in (r.stdout or "").splitlines() if x.strip()]
              return [x for x in lines if "pgrep" not in x]

          print("procs_ingest_n", len(pgrep("ingest-run|sf-admin.*ingest")))
          print("procs_bot_run_n", len(pgrep("bot-run")))
          print("procs_signal_cli_n", len(pgrep("signal-cli")))
          if found:
              lines = found[0].read_text(errors="replace").splitlines()
              print("=== last ingest summaries ===")
              sums = [scrub(ln)[:220] for ln in lines if "ingest-run:" in ln or "group_sent=" in ln or "group_failed=" in ln]
              for ln in sums[-10:]:
                  print(ln)
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
