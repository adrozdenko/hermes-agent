name: Signal Flow ingest-probe (Contabo)

# Scrubbed: locks, processes, personal vs bot receive timing.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe personal vs bot receive
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          PIDFILE=/tmp/sf-bot-run.pid
          if [ -f "$PIDFILE" ]; then
            OLD=$(cat "$PIDFILE" 2>/dev/null || true)
            [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null && kill "$OLD" 2>/dev/null || true
          fi
          pkill -f 'sf-admin.*bot-run' 2>/dev/null || true
          pkill -f 'signal-cli' 2>/dev/null || true
          sleep 2
          echo "=== procs after kill ==="
          pgrep -af 'signal-cli|sf-admin' | sed -E 's/\+?[0-9]{8,15}/[redacted]/g' | head -20 || echo none
          export PYTHONUNBUFFERED=1
          "$APP/.venv/bin/python" -u - <<'PY'
          import json, re, subprocess, sys, time
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.bot_link import signal_cli_bin, user_signal_session_dir, is_account_linked
          from sf.ingest import read_session_account
          from sf.paths import bot_signal_dir
          from sf.register import resolve_signal_account

          def scrub(s: str) -> str:
              s = re.sub(r"\+?\d{8,15}", "[redacted]", s or "")
              s = re.sub(
                  r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
                  "[uuid]",
                  s,
              )
              return s

          def locks(cfg: Path) -> None:
              print("locks for", scrub(str(cfg)), flush=True)
              for p in cfg.rglob("*"):
                  name = p.name.lower()
                  if p.is_file() and ("lock" in name or name.endswith(".lck") or name == "LOCK"):
                      print("  lockfile", scrub(str(p.relative_to(cfg))), "size", p.stat().st_size, flush=True)

          def timed_receive(label: str, cfg: Path, account: str, t: int = 5) -> None:
              bin_path = signal_cli_bin()
              print(f"--- {label} receive t={t} ---", flush=True)
              cmd = [bin_path, "-a", account, "--config", str(cfg), "-o", "json", "receive", "-t", str(t)]
              t0 = time.monotonic()
              try:
                  proc = subprocess.run(cmd, capture_output=True, text=True, timeout=t + 20)
                  dt = round(time.monotonic() - t0, 2)
                  err = scrub((proc.stderr or "").strip())[-300:]
                  n = len([ln for ln in (proc.stdout or "").splitlines() if ln.strip()])
                  print(f"rc={proc.returncode} dt={dt}s lines={n} stderr={err!r}", flush=True)
              except subprocess.TimeoutExpired as exc:
                  dt = round(time.monotonic() - t0, 2)
                  print(f"TIMEOUT dt={dt}s partial_err={scrub(str(exc.stderr or ''))[:200]!r}", flush=True)

          root = Path("/opt/signal-flow")
          resolve = resolve_signal_account(root) or ""
          personal = user_signal_session_dir(root, resolve)
          bot = bot_signal_dir(root)
          sess_acct = read_session_account(personal) or ""
          bot_acct = read_session_account(bot) or ""
          print("resolve_len", len(resolve), "sess_len", len(sess_acct), "bot_len", len(bot_acct), flush=True)
          print("resolve_eq_sess", bool(resolve) and resolve == sess_acct, flush=True)
          print("resolve_eq_bot", bool(resolve) and resolve == bot_acct, flush=True)
          print("sess_eq_bot", bool(sess_acct) and sess_acct == bot_acct, flush=True)
          print("personal_linked", is_account_linked(personal), "bot_linked", is_account_linked(bot), flush=True)
          locks(personal)
          locks(bot)
          if sess_acct:
              timed_receive("personal", personal, sess_acct, 5)
          if bot_acct:
              timed_receive("bot", bot, bot_acct, 5)
          print("PROBE_DONE", flush=True)
          PY
          nohup env PYTHONUNBUFFERED=1 "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli bot-run \
            >/tmp/sf-bot-run.log 2>&1 &
          echo $! >/tmp/sf-bot-run.pid
          echo BOT_RUN=restarted
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
