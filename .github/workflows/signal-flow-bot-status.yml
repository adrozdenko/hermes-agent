name: Signal Flow bot-status (Contabo)

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: bot-link-status on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          ACCOUNT="$DATA_ROOT/bot-signal"
          echo "=== bot-link-status ==="
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli bot-link-status || true
          echo "=== data dir non-empty? ==="
          if [ -d "$ACCOUNT/data" ] && [ -n "$(ls -A "$ACCOUNT/data" 2>/dev/null || true)" ]; then
            echo "ACCOUNT_DATA=present"
          else
            echo "ACCOUNT_DATA=empty"
          fi
          # Never dump account files / UUIDs / phone
          echo "=== link log tail (sanitized) ==="
          if [ -f /tmp/sf-bot-link.log ]; then
            # Strip any sgnl:// lines if present
            grep -v 'sgnl://' /tmp/sf-bot-link.log | tail -n 20 || true
          else
            echo "no sf-bot-link.log"
          fi
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
