name: Probe Contabo Telegram auth

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe telegram auth paths
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@5.189.159.195 bash -s <<'REMOTE'
          set -uo pipefail
          echo "===== gateway ====="
          docker exec hermes sh -c 'PATH=/command:$PATH; s6-svstat /run/service/gateway-default; ps -eo pid,etime,args | grep "hermes gateway" | grep -v grep'
          echo "===== config allow_from ====="
          docker exec hermes sh -c "grep -n -A3 allow_from /opt/data/config.yaml | head -40"
          echo "===== alfred allow_from ====="
          docker exec hermes sh -c "grep -n -A3 allow_from /opt/data/profiles/alfred/config.yaml 2>/dev/null | head -40 || echo no-alfred-config"
          echo "===== pairing json ====="
          docker exec hermes sh -c 'for f in /opt/data/pairing/*.json /opt/data/platforms/pairing/*.json /opt/data/profiles/alfred/pairing/*.json; do [ -f "$f" ] || continue; echo "## $f"; wc -c "$f"; head -c 400 "$f"; echo; done'
          echo "===== env ====="
          docker exec hermes sh -c 'echo TELEGRAM_ALLOWED_USERS=$TELEGRAM_ALLOWED_USERS; echo TELEGRAM_ALLOW_ALL_USERS=$TELEGRAM_ALLOW_ALL_USERS'
          echo "===== telegram connect / blocks (30m) ====="
          docker logs --since 30m hermes 2>&1 | grep -iE 'Blocked unauthorized|Connected to Telegram|replace handoff|Conflict' | tail -50
          echo "===== proxy ====="
          docker exec hermes sh -c 'curl -fsS -m 5 -o /dev/null http://127.0.0.1:11435/health && echo PROXY_OK'
          echo probe:done
          REMOTE
