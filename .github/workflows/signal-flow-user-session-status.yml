name: Signal Flow user-session status (Contabo)

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check personal session linked (scrubbed)
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          "$APP/.venv/bin/python" - <<'PY'
          import re
          from pathlib import Path
          import sys
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.bot_link import is_account_linked
          from sf.paths import safe_user_id
          from sf.register import resolve_signal_account
          root = Path("/opt/signal-flow")
          account = resolve_signal_account(root) or ""
          # self session uses safe_user_id of account or "self"
          candidates = []
          users = root / "users"
          if users.is_dir():
              for p in sorted(users.iterdir()):
                  if p.is_dir():
                      candidates.append(p)
          print("user_dirs=", len(candidates))
          for u in candidates:
              sess = u / "sessions" / "signal"
              linked = is_account_linked(sess) if sess.is_dir() else False
              png = (sess / "link-qr.png").is_file() if sess.is_dir() else False
              data = (sess / "data").is_dir() if sess.is_dir() else False
              # list data children count only
              nfiles = 0
              if data:
                  nfiles = sum(1 for _ in sess.rglob("*") if _.is_file())
              name = re.sub(r"\+?\d{8,15}", "[redacted]", u.name)
              print(f"user={name} sess_exists={sess.is_dir()} linked={linked} png={png} files={nfiles}")
          print("bot_linked=", is_account_linked(root / "bot-signal"))
          PY
          # any leftover link PIDs?
          pgrep -af 'signal-cli.*link' 2>/dev/null | sed -E 's/\+?[0-9]{8,15}/[redacted]/g' | head -5 || echo "no_link_procs"
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
