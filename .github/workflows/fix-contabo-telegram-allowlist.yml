name: Fix Contabo Telegram allowlist

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect, patch allowlist, restart gateway
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts

          scp -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 \
            deploy/contabo-ops/restore_telegram_allowlist.py \
            root@5.189.159.195:/tmp/restore_telegram_allowlist.py

          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
              -o TCPKeepAlive=yes -o ConnectTimeout=20 \
              -i ~/.ssh/id_ed25519 root@5.189.159.195 bash -s <<'REMOTE'
          set -euo pipefail
          VOL=/opt/hermes/data

          echo "================ BEFORE ================"
          docker exec hermes sh -c 'echo TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-unset}; echo TELEGRAM_ALLOW_ALL_USERS=${TELEGRAM_ALLOW_ALL_USERS:-unset}'
          echo "-- config snippets --"
          docker exec hermes sh -c "grep -nE 'telegram|allow_from|ALLOWED|unauthorized|321340950' /opt/data/config.yaml | head -100" || true
          echo "-- narrow env/config files only --"
          for f in \
            "$VOL/config.yaml" \
            "$VOL/.env" \
            "$VOL/gateway.env" \
            "$VOL/secrets/telegram-allow.env" \
            /opt/hermes/.env \
            /opt/hermes/docker-compose.yml
          do
            [ -f "$f" ] || continue
            echo "## $f"
            grep -nE 'TELEGRAM_ALLOWED|allow_from|321340950|unauthorized' "$f" | head -40 || true
          done
          ls -la "$VOL/backups/config" 2>/dev/null | tail -10 || echo "(no backups)"

          echo "================ APPLY ================"
          docker cp /tmp/restore_telegram_allowlist.py hermes:/tmp/restore_telegram_allowlist.py
          docker exec -u 0 hermes python3 /tmp/restore_telegram_allowlist.py

          mkdir -p "$VOL/secrets"
          echo 'TELEGRAM_ALLOWED_USERS=321340950' > "$VOL/secrets/telegram-allow.env"
          for f in "$VOL/.env" "$VOL/gateway.env" /opt/hermes/.env; do
            if [ -f "$f" ]; then
              if grep -q '^TELEGRAM_ALLOWED_USERS=' "$f"; then
                sed -i 's/^TELEGRAM_ALLOWED_USERS=.*/TELEGRAM_ALLOWED_USERS=321340950/' "$f"
              else
                printf '\nTELEGRAM_ALLOWED_USERS=321340950\n' >> "$f"
              fi
              echo "updated $f"
            fi
          done

          mkdir -p "$VOL/backups/config"
          chown -R 1000:1000 "$VOL/backups" 2>/dev/null || true

          echo "================ RESTART gateway-default ================"
          docker exec hermes sh -c '
            PATH="/command:/package/admin/s6/command:$PATH"
            s6-svc -r /run/service/gateway-default
            sleep 8
            s6-svstat /run/service/gateway-default
            ps -eo pid,args | grep "hermes gateway" | grep -v grep || true
          '
          docker exec hermes sh -c 'curl -fsS -m 5 -o /dev/null http://127.0.0.1:11435/health && echo PROXY_OK'

          echo "================ AFTER config ================"
          docker exec hermes sh -c "grep -nE 'telegram|allow_from|321340950' /opt/data/config.yaml | head -80" || true
          echo "================ recent logs ================"
          docker logs --since 1m hermes 2>&1 | grep -iE 'Telegram|unauthorized|321340950|Gateway Starting|allow' | tail -30 || true
          echo "fix: done"
          REMOTE
