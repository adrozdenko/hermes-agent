name: Signal Flow wa-ingest-stop (Contabo)

# Stop WhatsApp wa-ingest-run only. Does NOT touch Signal ingest-run / bot-run.
on:
  workflow_dispatch:

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Stop wa-ingest on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          PIDFILE=/tmp/sf-wa-ingest.pid
          LINKPID=/tmp/sf-wa-sidecar.pid
          HTTPPID=/tmp/sf-wa-qr-http.pid
          SIGNALPID=/tmp/sf-ingest-run.pid
          PORT=18080
          if [ -f "$PIDFILE" ]; then
            OLD=$(cat "$PIDFILE" 2>/dev/null || true)
            [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null && kill "$OLD" 2>/dev/null || true
            rm -f "$PIDFILE"
          fi
          pkill -f 'sf-admin.*wa-ingest-run' 2>/dev/null || true
          # Child connector may linger briefly
          sleep 1
          pkill -f 'whatsapp_sidecar/connector.js' 2>/dev/null || true
          if [ -f "$HTTPPID" ]; then
            OLD=$(cat "$HTTPPID" 2>/dev/null || true)
            [ -n "${OLD:-}" ] && kill "$OLD" 2>/dev/null || true
            rm -f "$HTTPPID"
          fi
          fuser -k "${PORT}/tcp" 2>/dev/null || true
          rm -f "$LINKPID"
          echo "WA_INGEST=stopped"
          if [ -f "$SIGNALPID" ] && kill -0 "$(cat "$SIGNALPID")" 2>/dev/null; then
            echo "SIGNAL_INGEST=alive pid=$(cat "$SIGNALPID")"
          else
            echo "SIGNAL_INGEST=not_running"
          fi
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
