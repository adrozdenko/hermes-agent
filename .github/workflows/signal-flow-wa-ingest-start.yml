name: Signal Flow wa-ingest-start (Contabo)

# Path B: start WhatsApp wa-ingest-run sibling. Stops link sidecar + QR :18080.
# Never touches Signal /tmp/sf-ingest-run.pid. Never starts bot-run.
# Manual workflow_dispatch only. No phones/JIDs/bodies in logs.

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Farm user id under users/ (safe path). Default self."
        type: string
        default: "self"

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Start wa-ingest-run on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          USER_ID: ${{ inputs.user_id }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST_KEY:-}" ]; then
            echo "Missing HERMES_SSH_KEY or HERMES_HOST_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts

          ssh -o ConnectTimeout=30 -o ServerAliveInterval=20 \
              -i ~/.ssh/id_ed25519 root@5.189.159.195 \
              "USER_ID=$(printf '%q' "${USER_ID:-self}") bash -s" <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          SF="$APP/.venv/bin/sf-admin"
          PIDFILE=/tmp/sf-wa-ingest.pid
          LOG=/tmp/sf-wa-ingest.log
          LINKPID=/tmp/sf-wa-sidecar.pid
          HTTPPID=/tmp/sf-wa-qr-http.pid
          SIGNALPID=/tmp/sf-ingest-run.pid
          PORT=18080

          if [ ! -x "$SF" ]; then
            echo "SF_ADMIN_MISSING=1 — run install-signal-flow-app first" >&2
            exit 2
          fi
          # Require wa-ingest-run CLI (new code on Contabo)
          if ! "$SF" --data-root "$DATA_ROOT" --force-admin-cli wa-ingest-run --help >/dev/null 2>&1; then
            echo "WA_INGEST_CLI_MISSING=1 — deploy latest signal-flow app (install-signal-flow-app)" >&2
            exit 2
          fi
          if [ ! -f "$APP/whatsapp_sidecar/connector.js" ]; then
            echo "WA_CONNECTOR_MISSING=1" >&2
            exit 2
          fi
          # install-signal-flow-app replaces app/ and drops node_modules — restore lightly
          if [ ! -d "$APP/whatsapp_sidecar/node_modules/whatsapp-web.js" ]; then
            echo "WA_NODE_MODULES_MISSING=1 — running npm ci"
            cd "$APP/whatsapp_sidecar"
            if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi
            cd /
          fi
          echo "node_modules_ok=$([ -d "$APP/whatsapp_sidecar/node_modules/whatsapp-web.js" ] && echo 1 || echo 0)"

          # Stop prior wa-ingest only (NOT Signal ingest)
          if [ -f /etc/systemd/system/signal-flow-wa-ingest.service ]; then
            systemctl stop signal-flow-wa-ingest.service 2>/dev/null || true
          fi
          if [ -f "$PIDFILE" ]; then
            OLD=$(cat "$PIDFILE" 2>/dev/null || true)
            [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null && kill "$OLD" 2>/dev/null || true
            rm -f "$PIDFILE"
          fi
          pkill -f 'sf-admin.*wa-ingest-run' 2>/dev/null || true

          # Stop link sidecar (same LocalAuth) — SIGTERM = clean destroy
          if [ -f "$LINKPID" ]; then
            OLD=$(cat "$LINKPID" 2>/dev/null || true)
            [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null && kill "$OLD" 2>/dev/null || true
            rm -f "$LINKPID"
          fi
          # Stop live QR HTTP :18080 only
          if [ -f "$HTTPPID" ]; then
            OLD=$(cat "$HTTPPID" 2>/dev/null || true)
            [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null && kill "$OLD" 2>/dev/null || true
            rm -f "$HTTPPID"
          fi
          pkill -f 'sf-wa-qr-www' 2>/dev/null || true
          fuser -k "${PORT}/tcp" 2>/dev/null || pkill -f "http.server ${PORT}" 2>/dev/null || true
          # Orphan connectors (list-chats etc.) — never Signal
          pkill -f 'whatsapp_sidecar/connector.js' 2>/dev/null || true
          sleep 2

          # Confirm Signal ingest still the intended live path (do not restart here)
          if systemctl is-active --quiet signal-flow-ingest.service 2>/dev/null; then
            echo "SIGNAL_INGEST=alive pid=$(systemctl show -p MainPID --value signal-flow-ingest.service) via=systemd"
          elif [ -f "$SIGNALPID" ] && kill -0 "$(cat "$SIGNALPID")" 2>/dev/null; then
            echo "SIGNAL_INGEST=alive pid=$(cat "$SIGNALPID")"
          else
            echo "SIGNAL_INGEST=not_running (unexpected — install/ingest-start may be needed)"
          fi

          UNIT=signal-flow-wa-ingest.service
          : >"$LOG"
          if [ -f "/etc/systemd/system/$UNIT" ] && [ "${USER_ID:-self}" = "self" ]; then
            systemctl daemon-reload
            systemctl enable "$UNIT"
            systemctl start signal-flow-wa-ingest
            sleep 2
            MAINPID=$(systemctl show -p MainPID --value "$UNIT" 2>/dev/null || echo 0)
            echo "$MAINPID" >"$PIDFILE"
            # journal may lag; also follow unit stdout if StandardOutput=journal
            for i in $(seq 1 5); do
              journalctl -u "$UNIT" -n 80 --no-pager 2>/dev/null >>"$LOG" || true
              sleep 1
            done
          else
            nohup env PYTHONUNBUFFERED=1 "$SF" --data-root "$DATA_ROOT" --force-admin-cli \
              wa-ingest-run "${USER_ID:-self}" --receive-timeout 2 --idle-sleep 0.5 \
              >"$LOG" 2>&1 &
            echo $! >"$PIDFILE"
          fi
          # Wait for Chromium LocalAuth ready (or fail fast on qr/error)
          READY=0
          for i in $(seq 1 90); do
            ALIVE=0
            if [ -f "/etc/systemd/system/$UNIT" ] && [ "${USER_ID:-self}" = "self" ]; then
              systemctl is-active --quiet "$UNIT" && ALIVE=1 || true
              journalctl -u "$UNIT" -n 20 --no-pager 2>/dev/null >>"$LOG" || true
            elif [ -f "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
              ALIVE=1
            fi
            if [ "$ALIVE" != 1 ]; then
              echo "WA_INGEST=dead during ready wait"
              sed -E 's/\+?[0-9]{8,15}/[redacted]/g; s/[0-9]{6,}@(s\.whatsapp\.net|g\.us|lid|newsletter)/[redacted]/gi; /sgnl:\/\//d' "$LOG" | tail -n 40 || true
              exit 1
            fi
            if grep -qE 'event=sidecar_(ready|authenticated)' "$LOG" 2>/dev/null \
               || grep -qE '"type":"(ready|authenticated)"' "$LOG" 2>/dev/null; then
              READY=1
              break
            fi
            if grep -qE 'event=sidecar_qr|потребує QR|немає node_modules|Chromium/Chrome не знайдено' "$LOG" 2>/dev/null; then
              echo "WA_INGEST=not_bonded"
              # Leave unit enabled but stop looping restart spam if hard-fail exited
              systemctl stop "$UNIT" 2>/dev/null || true
              sed -E 's/\+?[0-9]{8,15}/[redacted]/g; s/[0-9]{6,}@(s\.whatsapp\.net|g\.us|lid|newsletter)/[redacted]/gi; /sgnl:\/\//d' "$LOG" | tail -n 40 || true
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" != 1 ]; then
            echo "WA_INGEST=ready_timeout"
            sed -E 's/\+?[0-9]{8,15}/[redacted]/g; s/[0-9]{6,}@(s\.whatsapp\.net|g\.us|lid|newsletter)/[redacted]/gi; /sgnl:\/\//d' "$LOG" | tail -n 40 || true
            # Honest: pid without ready/authenticated is NOT alive
            echo "WA_INGEST=not_bonded"
            systemctl stop "$UNIT" 2>/dev/null || true
            exit 1
          else
            echo "WA_INGEST=alive pid=$(cat "$PIDFILE") ready=1"
          fi

          # Event types only (no bodies)
          echo "=== wa-ingest log event types ==="
          grep -oE '"type":"[a-z_]+"' "$LOG" 2>/dev/null | sort | uniq -c | head -20 || true
          grep -E 'wa-ingest-run:|event=' "$LOG" 2>/dev/null | tail -n 20 || true

          # Re-confirm Signal untouched
          if [ -f "$SIGNALPID" ] && kill -0 "$(cat "$SIGNALPID")" 2>/dev/null; then
            echo "SIGNAL_INGEST_STILL=alive pid=$(cat "$SIGNALPID")"
          else
            echo "SIGNAL_INGEST_STILL=not_running"
          fi

          # QR port should be closed
          if ss -lnt 2>/dev/null | grep -q ":${PORT} " || netstat -lnt 2>/dev/null | grep -q ":${PORT} "; then
            echo "QR_HTTP_PORT=still_listening (unexpected)"
          else
            echo "QR_HTTP_PORT=stopped"
          fi

          # Opaque key presence (no raw_ref dump)
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("/opt/signal-flow")
          users = root / "users"
          vuha = "whatsapp:h_7526e74533f40609390c"
          found = False
          for ch in users.glob("*/channels.json"):
              try:
                  data = json.loads(ch.read_text(encoding="utf-8"))
              except Exception:
                  continue
              for row in data.get("whatsapp") or []:
                  if isinstance(row, dict) and str(row.get("key") or "").strip() == vuha:
                      name = str(row.get("name") or "")[:80]
                      print(f"VUHA_CHANNEL=yes name={name!r}")
                      found = True
                      break
              if found:
                  break
          if not found:
              print("VUHA_CHANNEL=missing — run wa-select-vuha")
          PY
          echo "WA_INGEST_START_OK=1"
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
