name: Signal Flow wa-status (Contabo)

# Read-only WhatsApp sidecar status. Never prints phones/JIDs/bodies/QR data-URLs.
# Does not touch Signal ingest-run.

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Farm user id under users/ (safe path). Default self."
        type: string
        default: "self"

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: WA status on Contabo (scrubbed)
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          USER_ID: ${{ inputs.user_id }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 \
            "USER_ID=$(printf '%q' "${USER_ID:-self}") bash -s" <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          SIDE="$APP/whatsapp_sidecar"
          USER_RAW="${USER_ID:-self}"
          USER_SAFE=$(printf '%s' "$USER_RAW" | tr -cd 'A-Za-z0-9._+-' | sed 's/^[._]*//;s/[._]*$//')
          if [ "$USER_SAFE" = "self" ]; then
            if [ -d "$DATA_ROOT/users/self" ]; then UDIR="$DATA_ROOT/users/self"
            else UDIR=$(find "$DATA_ROOT/users" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n1 || true); fi
          else
            UDIR="$DATA_ROOT/users/$USER_SAFE"
          fi
          echo "=== wa-status ==="
          echo "sidecar_js=$([ -f "$SIDE/connector.js" ] && echo 1 || echo 0)"
          echo "node_modules=$([ -d "$SIDE/node_modules/whatsapp-web.js" ] && echo 1 || echo 0)"
          echo "node=$(command -v node >/dev/null && echo 1 || echo 0)"
          CHROME=0
          for c in google-chrome-stable chromium-browser chromium google-chrome; do
            command -v "$c" >/dev/null 2>&1 && CHROME=1 && break
          done
          echo "chrome=$CHROME"
          if [ ! -f "$SIDE/connector.js" ] || [ ! -d "$SIDE/node_modules/whatsapp-web.js" ] || [ "$CHROME" = 0 ]; then
            echo "WA_INSTALL_NEEDED=1"
          else
            echo "WA_INSTALL_NEEDED=0"
          fi
          echo "user_dir_ok=$([ -n "${UDIR:-}" ] && [ -d "${UDIR:-}" ] && echo 1 || echo 0)"
          if [ -n "${UDIR:-}" ] && [ -d "$UDIR" ]; then
            SESSION="$UDIR/sessions/whatsapp"
            echo "session_dir=$([ -d "$SESSION" ] && echo 1 || echo 0)"
            echo "qr_png=$([ -f "$SESSION/qr.png" ] && echo 1 || echo 0)"
            NFILES=0
            if [ -d "$SESSION" ]; then
              NFILES=$(find "$SESSION" -type f 2>/dev/null | wc -l | tr -d ' ')
            fi
            echo "session_files=$NFILES"
            AUTH=0
            if find "$SESSION" -maxdepth 3 -type d -name 'session-*' 2>/dev/null | grep -q .; then AUTH=1; fi
            if find "$SESSION" -maxdepth 3 -type d -name 'Default' 2>/dev/null | grep -q .; then AUTH=1; fi
            echo "localauth_profile_hint=$AUTH"
          fi
          PIDFILE=/tmp/sf-wa-sidecar.pid
          if [ -f "$PIDFILE" ]; then
            OLD=$(cat "$PIDFILE" 2>/dev/null || true)
            if [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null; then
              echo "sidecar_running=1"
            else
              echo "sidecar_running=0 pid_stale=1"
            fi
          else
            echo "sidecar_running=0"
          fi
          if [ -f /tmp/sf-wa-link.log ]; then
            echo "=== log event types ==="
            grep -oE '"type":"[a-z_]+"' /tmp/sf-wa-link.log 2>/dev/null | sort | uniq -c | head -30 || true
            if grep -q '"type":"ready"' /tmp/sf-wa-link.log 2>/dev/null; then
              echo "state_guess=ready"
            elif grep -q '"type":"qr"' /tmp/sf-wa-link.log 2>/dev/null; then
              echo "state_guess=needs-qr"
            elif grep -q '"type":"disconnected"' /tmp/sf-wa-link.log 2>/dev/null; then
              echo "state_guess=disconnected"
            else
              echo "state_guess=unknown"
            fi
          else
            echo "no sf-wa-link.log"
          fi
          echo "=== channels whatsapp count ==="
          if [ -n "${UDIR:-}" ] && [ -f "$UDIR/channels.json" ]; then
            python3 - "$UDIR/channels.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          try:
              data = json.load(open(p, encoding="utf-8"))
          except Exception:
              print("channels_parse=fail")
              raise SystemExit(0)
          rows = data.get("whatsapp") if isinstance(data, dict) else None
          print("whatsapp_n=", len(rows) if isinstance(rows, list) else 0)
          if isinstance(rows, list):
              for row in rows[:40]:
                  if not isinstance(row, dict):
                      continue
                  key = str(row.get("key") or "")[:48]
                  name = str(row.get("name") or row.get("title") or "")[:80]
                  kind = str(row.get("kind") or "")[:40]
                  print(f"wa_channel key={key!r} name={name!r} kind={kind!r}")
          PY
          else
            echo "channels_json=missing"
          fi
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
