name: Signal Flow channels rename source emojis (Contabo)

# Patch display `name` on the four Signal source rows in channels.json to the
# locked 2026-09-26 Джерело flanks. Keys stay the same. Prints labels + counts
# only — never group ids / phones / JIDs.
on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Rename source display labels on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PYTHONUNBUFFERED=1
          /opt/signal-flow/app/.venv/bin/python -u - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.ingest import resolve_ingest_user
          from sf.paths import channels_path

          # Match by current bare / legacy names (core needle), write locked flanks.
          # Order matters: first match wins.
          RENAMES = [
              ("блендер", "‼️ Блендер 2.0 ‼️"),
              ("каменяр", "🗿Каменярі🗿"),
              ("нейтрон", "⚛️ Нейтрон 2.0 ⚛️"),
              ("альманах", "📖 Альманах 📖"),
          ]

          def fold(s: str) -> str:
              return " ".join((s or "").casefold().split())

          def core_name(s: str) -> str:
              t = (s or "").strip()
              for flank in ("🔴", "‼️", "🗿", "⚛️", "📖"):
                  while t.startswith(flank):
                      t = t[len(flank) :].lstrip()
                  while t.endswith(flank):
                      t = t[: -len(flank)].rstrip()
              return t.strip()

          root = Path("/opt/signal-flow")
          signal_id, _ = resolve_ingest_user(root, "self")
          path = channels_path(root, signal_id)
          data = json.loads(path.read_text(encoding="utf-8"))
          signal = list(data.get("signal") or [])
          updated = 0
          labels_before = []
          labels_after = []
          for row in signal:
              if not isinstance(row, dict):
                  continue
              name = str(row.get("name") or "").strip()
              if not name:
                  continue
              labels_before.append(name)
              folded = fold(core_name(name))
              new_name = None
              for needle, target in RENAMES:
                  if needle in folded:
                      new_name = target
                      break
              if new_name is None:
                  labels_after.append(name)
                  continue
              if name != new_name:
                  row["name"] = new_name
                  updated += 1
              labels_after.append(new_name)

          data["signal"] = signal
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("CHANNELS_RENAME_BEGIN", flush=True)
          print("signal_rows_n=", len(signal), flush=True)
          print("updated_n=", updated, flush=True)
          print("labels_after_n=", len(labels_after), flush=True)
          for lab in labels_after:
              # Scrub accidental phones / long hex; never print keys/ids.
              scrubbed = re.sub(r"\+?\d{8,15}", "[tel]", lab)
              scrubbed = re.sub(r"[0-9a-f]{32,}", "[hex]", scrubbed, flags=re.I)
              print("label", scrubbed, flush=True)
          print("CHANNELS_RENAME_DONE", flush=True)
          PY
          # Confirm ingest still up (rename must not kill it)
          PIDFILE=/tmp/sf-ingest-run.pid
          if [ -f "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
            echo INGEST_RUN=alive pid=$(cat "$PIDFILE")
          else
            echo INGEST_RUN=not_running
          fi
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
