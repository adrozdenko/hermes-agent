name: Install Signal Flow layout (Contabo)

# Creates /opt/signal-flow on Contabo host. Does NOT rebuild Hermes.
# Manual only. Uses existing HERMES_SSH_KEY / HERMES_HOST_KEY.
# Admin Signal id from secret SIGNAL_FLOW_ADMIN_ID (never echo the value).

on:
  workflow_dispatch:

jobs:
  install-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Create /opt/signal-flow on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          ADMIN_ID: ${{ secrets.SIGNAL_FLOW_ADMIN_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST_KEY:-}" ]; then
            echo "Missing HERMES_SSH_KEY or HERMES_HOST_KEY" >&2
            exit 1
          fi
          if [ -z "${ADMIN_ID:-}" ]; then
            echo "Missing SIGNAL_FLOW_ADMIN_ID secret" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          # Pass admin id over SSH env without printing it in the remote script body in logs
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              -o TCPKeepAlive=yes -o ConnectTimeout=30 \
              -i ~/.ssh/id_ed25519 root@5.189.159.195 \
              "ADMIN_ID=$(printf '%q' "$ADMIN_ID") bash -s" <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          echo "install-signal-flow: DATA_ROOT=$DATA_ROOT"
          mkdir -p "$DATA_ROOT"/{config,bot-signal,users,logs}
          chmod 700 "$DATA_ROOT/bot-signal" "$DATA_ROOT/users"
          umask 077
          if [ ! -f "$DATA_ROOT/config/bot.json" ]; then
            cat > "$DATA_ROOT/config/bot.json" <<'BOT'
          {
            "data_root": "/opt/signal-flow",
            "language": "uk",
            "notes": "Phase 1 identity stub. No secrets here."
          }
          BOT
            echo "created bot.json"
          else
            echo "keep existing bot.json"
          fi
          # Always refresh admin_signal_ids from secret (idempotent replace of known key)
          python3 - <<PY
          import json, os
          from pathlib import Path
          root = Path("/opt/signal-flow/config")
          root.mkdir(parents=True, exist_ok=True)
          path = root / "admin.json"
          admin_id = os.environ["ADMIN_ID"]
          data = {"admin_signal_ids": [admin_id], "notes": "Andrii Signal admin. Sessions never in git."}
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("wrote admin.json (admin id not printed)")
          PY
          echo "tree:"
          ls -la "$DATA_ROOT" "$DATA_ROOT/config"
          echo "install-signal-flow: done"
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
