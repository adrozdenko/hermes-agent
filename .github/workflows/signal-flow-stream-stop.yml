name: Signal Flow stream-stop (Contabo)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Stop one target (default|arta|air), or leave empty to stop all"
        required: false
        type: string
        default: ""

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: stream-stop on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 \
            "TARGET=$(printf %q "$TARGET") bash -s" <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          echo "=== stream-stop ==="
          if [ -n "${TARGET:-}" ]; then
            "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli stream-stop --target "$TARGET"
          else
            "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli stream-stop
          fi
          echo "=== stream-status ==="
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli stream-status
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
