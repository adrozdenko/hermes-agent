name: Signal Flow bot-link (Contabo bootstrap)

# Admin-only chicken-egg: link /opt/signal-flow/bot-signal so the delivery bot
# can later DM users their personal QR. NOT the end-user product UX.
# Manual workflow_dispatch only. Never rebuilds Hermes. Never echoes sgnl:// URI
# or admin Signal id. PNG may be uploaded as artifact for Andrii/ops handoff
# (Grok/Telegram helper is preferred when available).

on:
  workflow_dispatch:

jobs:
  bot-link:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ensure signal-cli + run bot-link on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST_KEY:-}" ]; then
            echo "Missing HERMES_SSH_KEY or HERMES_HOST_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
              -o TCPKeepAlive=yes -o ConnectTimeout=30 \
              -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          QR_OUT=/tmp/sf-bot-qr.png
          rm -f "$QR_OUT"

          test -x "$APP/.venv/bin/sf-admin" || {
            echo "sf-admin missing; run Install Signal Flow app (Contabo) first" >&2
            exit 1
          }
          test -d "$DATA_ROOT/bot-signal" || {
            echo "layout missing bot-signal; run install-signal-flow-layout first" >&2
            exit 1
          }

          # Idempotent signal-cli install (prefer existing binary).
          if ! command -v signal-cli >/dev/null 2>&1; then
            echo "signal-cli missing — installing JRE + signal-cli release"
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq openjdk-21-jre-headless curl ca-certificates
            # Pin a known release; bump intentionally when upgrading.
            SF_CLI_VER="0.13.20"
            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64|amd64) SF_ARCH=Linux-x86_64 ;;
              aarch64|arm64) SF_ARCH=Linux-aarch64 ;;
              *) echo "unsupported arch: $ARCH" >&2; exit 1 ;;
            esac
            TMP=$(mktemp -d)
            URL="https://github.com/AsamK/signal-cli/releases/download/v${SF_CLI_VER}/signal-cli-${SF_CLI_VER}-${SF_ARCH}.tar.gz"
            echo "fetching signal-cli (URL host only logged)"
            curl -fsSL "$URL" -o "$TMP/signal-cli.tgz"
            tar -C /opt -xzf "$TMP/signal-cli.tgz"
            ln -sfn "/opt/signal-cli-${SF_CLI_VER}/bin/signal-cli" /usr/local/bin/signal-cli
            rm -rf "$TMP"
          fi
          signal-cli --version || true

          # Ensure qrcode present in app venv (idempotent).
          "$APP/.venv/bin/pip" install -q 'qrcode[pil]>=7.4'

          # Cancel any leftover link from a previous attempt.
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli bot-link-cancel || true
          rm -f "$QR_OUT"

          echo "starting bot-link in background (URI will not be printed)"
          # Critical: do NOT block SSH for the full 180s — PNG must ship while
          # signal-cli is still waiting for the phone scan.
          nohup "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli \
            bot-link --qr-out "$QR_OUT" --timeout 180 \
            >/tmp/sf-bot-link.log 2>&1 &
          echo "bot-link pid=$!"

          READY=0
          for i in $(seq 1 90); do
            if [ -f "$QR_OUT" ] && [ -s "$QR_OUT" ]; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" = 1 ]; then
            ls -la "$QR_OUT"
            echo "QR_PNG_READY=1"
          else
            echo "QR_PNG_READY=0"
            echo "--- tail sf-bot-link.log (no URI expected) ---"
            tail -n 40 /tmp/sf-bot-link.log 2>/dev/null || true
            exit 1
          fi
          # Status only — no secrets. Link process keeps waiting on host.
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli bot-link-status || true
          exit 0
          REMOTE

          # Pull PNG if present (ops handoff). Never cat URI.
          mkdir -p "$GITHUB_WORKSPACE/sf-bot-qr-out"
          scp -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 \
            root@5.189.159.195:/tmp/sf-bot-qr.png \
            "$GITHUB_WORKSPACE/sf-bot-qr-out/sf-bot-qr.png" 2>/dev/null || true
          if [ -f "$GITHUB_WORKSPACE/sf-bot-qr-out/sf-bot-qr.png" ]; then
            echo "PNG fetched for artifact upload (admin bootstrap only)"
            ls -la "$GITHUB_WORKSPACE/sf-bot-qr-out/sf-bot-qr.png"
          else
            echo "No PNG on host (already linked, expired before write, or error)"
          fi
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519

      - name: Upload bootstrap QR artifact (admin ops, not product UX)
        uses: actions/upload-artifact@v4
        with:
          name: signal-flow-bot-qr
          path: sf-bot-qr-out/sf-bot-qr.png
          if-no-files-found: warn
          retention-days: 1
