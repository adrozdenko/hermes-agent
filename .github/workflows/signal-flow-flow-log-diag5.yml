name: Signal Flow flow-log diag5 (Contabo)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: scrubbed kamenyari / 254 evening
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          PYTHONPATH=/opt/signal-flow/app /opt/signal-flow/app/.venv/bin/python - <<'PY'
          import json, re
          from pathlib import Path
          root = Path("/opt/signal-flow")
          # flow match log path used by append_flow_log
          cands = list(root.rglob("*.jsonl"))
          print("jsonl", len(cands))
          for p in cands:
              print(" ", str(p).replace("/opt/signal-flow/", "")[:80], "bytes", p.stat().st_size)
          hits_drop = hits_match = 0
          shown = []
          for p in cands:
              if p.stat().st_size > 80_000_000:
                  continue
              try:
                  lines = p.read_text(errors="replace").splitlines()[-8000:]
              except Exception:
                  continue
              for ln in lines:
                  try:
                      o = json.loads(ln)
                  except Exception:
                      continue
                  blob = json.dumps(o, ensure_ascii=False)
                  src = str(o.get("source") or o.get("source_name") or o.get("channel") or "")
                  # look for evening markers / 254 / бпла / 60
                  interesting = False
                  low = blob.lower()
                  if "254" in blob or "бпла" in low or "бомбер" in low or "60" in blob and "омбр" in low:
                      interesting = True
                  ts = str(o.get("ts") or o.get("t") or o.get("received_at") or o.get("at") or "")
                  if "17:3" in ts or "20:3" in ts:
                      interesting = True
                  if not interesting:
                      continue
                  matched = o.get("matched", o.get("match"))
                  dropped = o.get("dropped")
                  reasons = o.get("reasons") or o.get("match_reasons") or o.get("why")
                  units = o.get("units") or o.get("parts")
                  gt = o.get("group_targets") or o.get("stream_targets") or o.get("targets")
                  # scrub
                  line = re.sub(r"\+?\d{8,15}", "[redacted]", f"ts={ts} src={src[:30]} matched={matched} dropped={dropped} reasons={str(reasons)[:100]} units={str(units)[:80]} targets={gt}")
                  # never print body/text fields
                  shown.append(line[:260])
                  if matched is False or dropped:
                      hits_drop += 1
                  else:
                      hits_match += 1
          print("shown", len(shown), "approx_matchish", hits_match, "dropish", hits_drop)
          for s in shown[-40:]:
              print(s)
          # live filter keywords for default flow
          for fp in root.rglob("flow.json"):
              try:
                  d = json.loads(fp.read_text())
              except Exception:
                  continue
              kw = d.get("keywords") or d.get("filter") or {}
              print("flow", str(fp)[-55:])
              if isinstance(kw, dict):
                  for k in ("include", "exclude", "sources", "units", "unit_include"):
                      if k in kw:
                          v = kw[k]
                          print(" ", k, str(v)[:160])
              # also top-level
              for k in ("sources", "include", "exclude", "units"):
                  if k in d:
                      print(" top", k, str(d[k])[:160])
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
