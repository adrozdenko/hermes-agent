name: Signal Flow bot clipboard + register

# Read signalcaptcha:// from Contabo VNC clipboard (xclip) and SMS-register.
# Never echo the token.

on:
  workflow_dispatch:

jobs:
  clip-register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clipboard captcha + SMS register
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          PHONE: ${{ secrets.SIGNAL_FLOW_BOT_PHONE }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          umask 077
          printf '%s' "$PHONE" > /tmp/sf-bot-phone
          scp -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 \
            /tmp/sf-bot-phone root@5.189.159.195:/tmp/sf-bot-phone
          shred -u /tmp/sf-bot-phone 2>/dev/null || rm -f /tmp/sf-bot-phone
          ssh -o ServerAliveInterval=30 -o ConnectTimeout=30 \
              -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          SESSION_DIR=/opt/signal-flow/captcha-session
          ACCOUNT_DIR=/opt/signal-flow/bot-signal
          TOKEN_FILE=/opt/signal-flow/config/last-captcha.token
          mkdir -p /opt/signal-flow/config
          export DISPLAY=:99
          [ -f "$SESSION_DIR/.Xauthority" ] && export XAUTHORITY="$SESSION_DIR/.Xauthority"
          unset LD_PRELOAD
          command -v xclip >/dev/null 2>&1 || apt-get install -y -qq xclip >/dev/null
          CAPTCHA=""
          for sel in clipboard primary secondary; do
            clip="$(xclip -selection "$sel" -o 2>/dev/null || true)"
            case "$clip" in
              *signalcaptcha://*)
                # extract URI
                CAPTCHA="$(printf '%s' "$clip" | grep -oE 'signalcaptcha://[^[:space:]]+' | head -n1)"
                echo "CLIP_HIT selection=$sel len=${#CAPTCHA}"
                break
                ;;
            esac
            echo "CLIP_MISS selection=$sel len=${#clip}"
          done
          # Also try CDP quickly if clipboard empty
          if [ -z "$CAPTCHA" ] && [ -s "$TOKEN_FILE" ]; then
            CAPTCHA="$(tr -d '\r\n' < "$TOKEN_FILE")"
            echo "TOKEN_FILE_FALLBACK len=${#CAPTCHA}"
          fi
          if [ -z "$CAPTCHA" ]; then
            echo "NO_CAPTCHA_IN_CLIPBOARD" >&2
            # dump non-secret clipboard head
            for sel in clipboard primary; do
              clip="$(xclip -selection "$sel" -o 2>/dev/null || true)"
              echo "sel=$sel head=$(printf '%s' "$clip" | head -c 40 | tr '\n' ' ')..."
            done
            exit 2
          fi
          printf '%s\n' "$CAPTCHA" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"
          echo "TOKEN_SAVED=1 len=${#CAPTCHA}"

          test -f /tmp/sf-bot-phone || { echo "phone missing" >&2; exit 1; }
          PHONE="$(cat /tmp/sf-bot-phone)"
          shred -u /tmp/sf-bot-phone 2>/dev/null || rm -f /tmp/sf-bot-phone
          command -v signal-cli >/dev/null || { echo "signal-cli missing" >&2; exit 1; }
          test -d "$ACCOUNT_DIR" || { echo "bot-signal missing" >&2; exit 1; }

          redacted() { sed -E 's/\+?[0-9]{8,15}/[redacted]/g; s/signalcaptcha:\/\/[^[:space:]]+/signalcaptcha:\/\/[redacted]/g'; }

          echo "signal-cli register"
          set +e
          OUT="$(signal-cli --config "$ACCOUNT_DIR" -a "$PHONE" register --captcha "$CAPTCHA" 2>&1)"
          RC=$?
          if [ "$RC" -ne 0 ]; then
            TOK="$CAPTCHA"
            case "$TOK" in signalcaptcha://*) TOK="${TOK#signalcaptcha://}" ;; esac
            if [ "$TOK" != "$CAPTCHA" ]; then
              echo "retry scheme-stripped"
              OUT="$(signal-cli --config "$ACCOUNT_DIR" -a "$PHONE" register --captcha "$TOK" 2>&1)"
              RC=$?
            fi
          fi
          set -e
          echo "$OUT" | redacted
          echo "register_exit=$RC"
          if [ "$RC" -eq 0 ]; then
            echo "SMS_REQUESTED=1"
            if [ -f /opt/signal-flow/config/bot.json ]; then
              python3 - /opt/signal-flow/config/bot.json "$PHONE" <<'PY'
          import json, sys
          path, phone = sys.argv[1], sys.argv[2]
          try:
              data = json.loads(open(path, encoding="utf-8").read())
          except Exception:
              data = {}
          if not isinstance(data, dict):
              data = {}
          data["signal_account"] = phone
          open(path, "w", encoding="utf-8").write(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
            fi
            exit 0
          fi
          echo "$OUT" | redacted | grep -qi captcha && echo "NEED_CAPTCHA=1"
          exit "$RC"
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
