name: Signal Flow patch plot keywords (Contabo)

# Patch filters.units on default flow «Перехоплення 125» without killing ingest-run.
# Strip-125 units (S2 Agent 2026-09-26): drop bare гадн + 71 опббс dup; add 148 орб.
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Patch keywords on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PYTHONUNBUFFERED=1
          /opt/signal-flow/app/.venv/bin/python -u - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.flows import load_default_flow, save_default_flow
          from sf.ingest import resolve_ingest_user

          UNITS = [
              "254 мсп",
              "488 мсп",
              "283 мсп",
              "144 мсд",
              "1 мсп",
              "2 мсд",
              "71 опБпС",
              "3 бБпС",
              "4 опБпС",
              "856 сап",
              "148 орб",
              "Шторм",
          ]

          root = Path("/opt/signal-flow")
          signal_id, _ = resolve_ingest_user(root, "self")
          flow = load_default_flow(root, signal_id)
          if not isinstance(flow.get("filters"), dict):
              flow["filters"] = {}
          flow["filters"]["units"] = list(UNITS)
          flow["filters"]["units_exclude"] = ["31 мсп", "67 мсд"]
          # Clear legacy substring keywords so OpsPower unit gate owns matching
          flow["filters"]["keywords"] = []
          flow["filters"]["keywords_exclude"] = []
          # keep channels_include / sources as already seeded
          if not flow.get("name"):
              flow["name"] = "Перехоплення 125"
          save_default_flow(root, signal_id, flow)
          f = flow.get("filters") or {}
          print("flow_name=", flow.get("name"), flush=True)
          print("units_n=", len(f.get("units") or []), flush=True)
          print("units=", "|".join(f.get("units") or []), flush=True)
          print("units_exclude=", "|".join(f.get("units_exclude") or []), flush=True)
          print("keywords=", "|".join(f.get("keywords") or []), flush=True)
          print("channels_include_n=", len(f.get("channels_include") or []), flush=True)
          print("sources_n=", len(flow.get("sources") or []), flush=True)
          print("PATCH_OK", flush=True)
          PY
          # Confirm ingest still up
          PIDFILE=/tmp/sf-ingest-run.pid
          if [ -f "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
            echo INGEST_RUN=alive pid=$(cat "$PIDFILE")
          else
            echo INGEST_RUN=not_running
          fi
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
