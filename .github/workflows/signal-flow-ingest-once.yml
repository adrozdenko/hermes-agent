name: Signal Flow ingest-once (Contabo)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run (no DM/jsonl sinks)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: ingest-once self on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=20 \
            -i ~/.ssh/id_ed25519 root@5.189.159.195 \
            "DRY_RUN=$(printf %q "$DRY_RUN") bash -s" <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          # Stop bot-run briefly if it holds bot-signal; ingest uses personal session + bot-signal send
          PIDFILE=/tmp/sf-bot-run.pid
          if [ -f "$PIDFILE" ]; then
            OLD=$(cat "$PIDFILE" 2>/dev/null || true)
            [ -n "${OLD:-}" ] && kill -0 "$OLD" 2>/dev/null && kill "$OLD" 2>/dev/null || true
          fi
          pkill -f 'sf-admin.*bot-run' 2>/dev/null || true
          sleep 1
          EXTRA=()
          if [ "${DRY_RUN}" = "true" ]; then
            EXTRA+=(--dry-run)
          fi
          set +e
          "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli \
            ingest-once self "${EXTRA[@]}" > /tmp/sf-ingest-once.out 2>&1
          RC=$?
          set -e
          # Scrub phones from output
          python3 - <<'PY'
          import re
          from pathlib import Path
          raw = Path("/tmp/sf-ingest-once.out").read_text(errors="replace")
          for line in raw.splitlines():
              s = re.sub(r"\+?\d{8,15}", "[redacted]", line)
              if "sgnl://" in s or "linkdevice" in s.lower():
                  print("[link-uri redacted]")
              else:
                  print(s[:300])
          PY
          echo "ingest_once_rc=$RC"
          # restart bot-run
          nohup env PYTHONUNBUFFERED=1 "$APP/.venv/bin/sf-admin" --data-root "$DATA_ROOT" --force-admin-cli bot-run \
            >/tmp/sf-bot-run.log 2>&1 &
          echo $! >/tmp/sf-bot-run.pid
          echo BOT_RUN=restarted
          exit "$RC"
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
