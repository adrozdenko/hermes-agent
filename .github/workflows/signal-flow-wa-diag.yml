name: Signal Flow wa-diag (Contabo scrubbed)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Scrubbed WA sidecar diag
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set +e
          echo "DIAG_BEGIN"
          PIDFILE=/tmp/sf-wa-sidecar.pid
          if [ -f "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then echo sidecar_running=1; else echo sidecar_running=0; fi
          grep -oE '"type":"[a-z_]+"' /tmp/sf-wa-link.log 2>/dev/null | sort | uniq -c | head -40
          echo "--- scrubbed tail ---"
          tail -n 120 /tmp/sf-wa-link.log 2>/dev/null \
            | sed -E 's/\+?[0-9]{8,15}/[tel]/g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[id]/g; s/sgnl:\/\/\S+/[sgnl]/g; s/"qr_data_url":"[^"]*"/"qr_data_url":"[omitted]"/g' \
            | grep -iE 'error|fail|disconnect|auth|ready|puppeteer|chromium|ERR|Timeout|Protocol' \
            | tail -50
          echo "DIAG_END"
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
