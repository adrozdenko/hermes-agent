name: Signal Flow filters dump scrubbed (Contabo)
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dump scrubbed filters on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          PYTHONPATH=/opt/signal-flow/app /opt/signal-flow/app/.venv/bin/python - <<'PY'
          import json, re, sys
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.flows import ensure_default_flow
          from sf.ingest import channel_display_names, resolve_ingest_user
          from sf.stream import load_stream_state, stream_is_live

          def scrub(s):
              s = re.sub(r"\+?\d{8,15}", "[tel]", str(s or ""))
              s = re.sub(r"sgnl://\S+", "[sgnl]", s)
              s = re.sub(r"[0-9a-f]{32,}", "[hex]", s, flags=re.I)
              return s

          root = Path("/opt/signal-flow")
          sid, _ = resolve_ingest_user(root, "self")
          flow = ensure_default_flow(root, sid)
          names = channel_display_names(root, sid)
          st = load_stream_state(root)
          filt = dict(flow.get("filters") or {})
          keys = ["units", "units_exclude", "keywords", "keywords_exclude",
                  "channels_include", "channels_exclude", "aoi"]
          print("FILTERS_DUMP_BEGIN")
          print("flow_id", flow.get("id") or flow.get("flow_id") or "default")
          print("stream_live", stream_is_live(st))
          for k in keys:
              vals = list(filt.get(k) or [])
              print(f"{k}_n", len(vals))
              for i, v in enumerate(vals, 1):
                  print(f"{k}[{i}]", scrub(v))
          # map include keys to labels
          ch_inc = list(filt.get("channels_include") or [])
          ch_exc = list(filt.get("channels_exclude") or [])
          print("channels_labeled_begin")
          for k in ch_inc:
              print("inc", scrub(k), "->", scrub(names.get(k) or "(unknown)"))
          for k in ch_exc:
              print("exc", scrub(k), "->", scrub(names.get(k) or "(unknown)"))
          print("channels_labeled_end")
          # sinks
          sinks = (st or {}).get("sinks") or (st or {}).get("targets") or {}
          if isinstance(sinks, dict):
              print("sinks_n", len(sinks))
              for sk, sv in sinks.items():
                  if isinstance(sv, dict):
                      en = sv.get("enabled", sv.get("on"))
                      label = scrub(sv.get("name") or sv.get("label") or sk)
                      print("sink", scrub(sk), "enabled", en, "label", label)
                  else:
                      print("sink", scrub(sk), scrub(sv))
          elif isinstance(sinks, list):
              print("sinks_n", len(sinks))
              for sv in sinks:
                  if isinstance(sv, dict):
                      print("sink", scrub(sv.get("key") or ""), "enabled", sv.get("enabled"), "label", scrub(sv.get("name") or sv.get("label") or ""))
          # also list subscribed source labels from channels.json if present
          print("all_channels_n", len(names))
          for k, n in sorted(names.items(), key=lambda x: (x[1] or "").casefold()):
              print("ch", scrub(n)[:60])
          print("FILTERS_DUMP_DONE")
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
