name: Signal Flow wa-chats-from-log (Contabo)
on: workflow_dispatch
jobs:
  chats:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Parse chats from live sidecar log
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          LOG=/tmp/sf-wa-link.log
          PIDFILE=/tmp/sf-wa-sidecar.pid
          if [ -f "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then echo sidecar_running=1; else echo sidecar_running=0; fi
          grep -oE '"type":"[a-z_]+"' "$LOG" 2>/dev/null | sort | uniq -c | head -20
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          log = Path("/tmp/sf-wa-link.log")
          text = log.read_text(errors="replace") if log.exists() else ""
          chats = None
          for line in text.splitlines():
              line=line.strip()
              if not line.startswith("{"): continue
              try: ev=json.loads(line)
              except Exception: continue
              if ev.get("type")=="chats" and isinstance(ev.get("chats"), list):
                  chats = ev["chats"]
          def opaque(raw):
              s=(raw or "").strip()
              if not s: return ""
              if s.startswith("whatsapp:"): return s
              return "whatsapp:h_"+hashlib.sha256(s.encode()).hexdigest()[:20]
          def scrub(s):
              s=re.sub(r"\+?\d{8,15}","[tel]",s)
              s=re.sub(r"[0-9]{6,}@(?:s\.whatsapp\.net|g\.us|lid|newsletter)","[jid]",s)
              return s
          if not chats:
              print("chats_n=0")
              print("HINT=no_chats_event_in_log")
              raise SystemExit(0)
          print(f"chats_n={len(chats)}")
          vuha=[]
          for row in chats:
              if not isinstance(row, dict): continue
              name=scrub(str(row.get("name") or ""))[:180]
              kind=str(row.get("kind") or "")[:40]
              key=opaque(str(row.get("id") or ""))
              print(f"chat name={name!r} kind={kind!r} key={key!r}")
              fold=name.casefold()
              if "вуха" in fold or "vuha" in fold or "66" in name:
                  vuha.append((name,key,kind))
          print(f"VUHA_CANDIDATES_n={len(vuha)}")
          for name,key,kind in vuha[:15]:
              print(f"VUHA_HIT name={name!r} kind={kind!r} key={key!r}")
          print("LIST_DONE")
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
