name: Signal Flow bot grab-captcha + register

# After Andrii solves captcha on Contabo noVNC, grab signalcaptcha://
# from Chromium log/clipboard on the host and run SMS register in the
# same SSH session. Never echo the token. Phone from SIGNAL_FLOW_BOT_PHONE.

on:
  workflow_dispatch:

jobs:
  grab-register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Grab captcha on Contabo and SMS-register
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          PHONE: ${{ secrets.SIGNAL_FLOW_BOT_PHONE }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST_KEY:-}" ]; then
            echo "Missing HERMES_SSH_KEY or HERMES_HOST_KEY" >&2
            exit 1
          fi
          if [ -z "${PHONE:-}" ]; then
            echo "Missing SIGNAL_FLOW_BOT_PHONE" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          umask 077
          printf '%s' "$PHONE" > /tmp/sf-bot-phone
          scp -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 \
            /tmp/sf-bot-phone root@5.189.159.195:/tmp/sf-bot-phone
          shred -u /tmp/sf-bot-phone 2>/dev/null || rm -f /tmp/sf-bot-phone
          ssh -o ServerAliveInterval=30 -o ConnectTimeout=30 \
              -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          SESSION_DIR=/opt/signal-flow/captcha-session
          ACCOUNT_DIR=/opt/signal-flow/bot-signal
          DISPLAY_NUM=99
          export DISPLAY=":${DISPLAY_NUM}"
          if [ -f "$SESSION_DIR/.Xauthority" ]; then
            export XAUTHORITY="$SESSION_DIR/.Xauthority"
          fi
          unset LD_PRELOAD

          grab_token() {
            # 0) Handler / previous capture file
            if [ -f /opt/signal-flow/config/last-captcha.token ]; then
              tok="$(tr -d '\r\n' < /opt/signal-flow/config/last-captcha.token)"
              case "$tok" in signalcaptcha://*) printf '%s' "$tok"; return 0 ;; esac
            fi
            # 1) Chromium log (Open Signal → failed handler often logs full URI)
            for f in "$SESSION_DIR/chromium.log" /tmp/chromium*.log; do
              [ -f "$f" ] || continue
              tok="$(grep -oE 'signalcaptcha://[^[:space:]\"<>]+' "$f" 2>/dev/null | tail -n1 || true)"
              [ -n "$tok" ] && { printf '%s' "$tok"; return 0; }
            done
            # 2) Clipboard on the VNC display
            if command -v xclip >/dev/null 2>&1; then
              tok="$(xclip -selection clipboard -o 2>/dev/null || true)"
              case "$tok" in signalcaptcha://*) printf '%s' "$tok"; return 0 ;; esac
              tok="$(xclip -selection primary -o 2>/dev/null || true)"
              case "$tok" in signalcaptcha://*) printf '%s' "$tok"; return 0 ;; esac
            fi
            if command -v xsel >/dev/null 2>&1; then
              tok="$(xsel --clipboard -o 2>/dev/null || true)"
              case "$tok" in signalcaptcha://*) printf '%s' "$tok"; return 0 ;; esac
            fi
            # 3) Chromium History URLs (sqlite)
            for hist in \
              "$SESSION_DIR/chrome-profile/Default/History" \
              "$SESSION_DIR/chrome-profile/Default/Sessions/"* \
              /root/snap/chromium/common/chromium/Default/History; do
              [ -f "$hist" ] || continue
              case "$hist" in
                *History)
                  cp -f "$hist" /tmp/sf-chrome-hist.db 2>/dev/null || continue
                  tok="$(sqlite3 /tmp/sf-chrome-hist.db "SELECT url FROM urls ORDER BY last_visit_time DESC LIMIT 50;" 2>/dev/null \
                    | grep -oE 'signalcaptcha://[^[:space:]]+' | head -n1 || true)"
                  rm -f /tmp/sf-chrome-hist.db
                  [ -n "$tok" ] && { printf '%s' "$tok"; return 0; }
                  ;;
              esac
            done
            # 4) Strings in chrome profile Local Storage / Session Storage
            tok="$(grep -rhoE 'signalcaptcha://[^[:space:]\"<>]+' "$SESSION_DIR/chrome-profile" 2>/dev/null | tail -n1 || true)"
            [ -n "$tok" ] && { printf '%s' "$tok"; return 0; }
            return 1
          }

          echo "grabbing captcha token from Contabo session (no echo of token)"
          CAPTCHA=""
          if CAPTCHA="$(grab_token)"; then
            echo "CAPTCHA_FOUND=1 len=${#CAPTCHA}"
          else
            echo "CAPTCHA_FOUND=0"
            echo "Sources checked: chromium.log, clipboard, History, profile strings" >&2
            # Helpful non-secret diagnostics
            ls -la "$SESSION_DIR" 2>/dev/null | head -n 30 || true
            if [ -f "$SESSION_DIR/chromium.log" ]; then
              echo "chromium.log tail (redacted):"
              tail -n 40 "$SESSION_DIR/chromium.log" | sed -E 's/signalcaptcha:\/\/[^[:space:]]+/signalcaptcha:\/\/[redacted]/g' || true
            fi
            pgrep -af 'chromium|chrome|Xvnc|openbox' | head -n 15 || true
            exit 2
          fi

          umask 077
          printf '%s' "$CAPTCHA" > /tmp/sf-bot-captcha
          # Also refresh repo secret material on host for verify path reuse
          mkdir -p /opt/signal-flow/config
          cp -f /tmp/sf-bot-captcha /opt/signal-flow/config/last-captcha.token
          chmod 600 /opt/signal-flow/config/last-captcha.token

          test -d "$ACCOUNT_DIR" || { echo "bot-signal layout missing" >&2; exit 1; }
          command -v signal-cli >/dev/null || { echo "signal-cli missing" >&2; exit 1; }
          test -f /tmp/sf-bot-phone || { echo "phone file missing" >&2; exit 1; }
          PHONE="$(cat /tmp/sf-bot-phone)"
          CAPTCHA="$(cat /tmp/sf-bot-captcha)"
          shred -u /tmp/sf-bot-phone 2>/dev/null || rm -f /tmp/sf-bot-phone

          redacted() { sed -E 's/\+?[0-9]{8,15}/[redacted]/g; s/signalcaptcha:\/\/[^[:space:]]+/signalcaptcha:\/\/[redacted]/g'; }

          echo "signal-cli register with grabbed captcha"
          set +e
          OUT="$(signal-cli --config "$ACCOUNT_DIR" -a "$PHONE" register --captcha "$CAPTCHA" 2>&1)"
          RC=$?
          if [ "$RC" -ne 0 ]; then
            TOK="$CAPTCHA"
            case "$TOK" in signalcaptcha://*) TOK="${TOK#signalcaptcha://}" ;; esac
            if [ "$TOK" != "$CAPTCHA" ]; then
              echo "retry with scheme-stripped captcha"
              OUT="$(signal-cli --config "$ACCOUNT_DIR" -a "$PHONE" register --captcha "$TOK" 2>&1)"
              RC=$?
            fi
          fi
          set -e
          shred -u /tmp/sf-bot-captcha 2>/dev/null || rm -f /tmp/sf-bot-captcha
          echo "$OUT" | redacted
          echo "register_exit=$RC"
          if [ "$RC" -eq 0 ]; then
            echo "SMS_REQUESTED=1"
            if [ -f /opt/signal-flow/config/bot.json ]; then
              python3 - /opt/signal-flow/config/bot.json "$PHONE" <<'PY'
          import json, sys
          path, phone = sys.argv[1], sys.argv[2]
          try:
              data = json.loads(open(path, encoding="utf-8").read())
          except Exception:
              data = {}
          if not isinstance(data, dict):
              data = {}
          data["signal_account"] = phone
          open(path, "w", encoding="utf-8").write(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
            fi
            exit 0
          fi
          echo "$OUT" | redacted | grep -qi captcha && echo "NEED_CAPTCHA=1"
          exit "$RC"
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
