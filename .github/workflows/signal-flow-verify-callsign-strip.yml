name: Signal Flow verify callsign-strip (Contabo)

# Scrubbed stub: ДРОН in callsign header → not air; вылет in dialogue → air.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify callsign header strip on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_ROOT=/opt/signal-flow
          APP="$DATA_ROOT/app"
          echo "=== strip_callsign present ==="
          grep -n 'def strip_callsign_header' "$APP/sf/topics.py" | head -3
          echo "=== processes ==="
          if [ -f /tmp/sf-ingest-run.pid ] && kill -0 "$(cat /tmp/sf-ingest-run.pid)" 2>/dev/null; then
            echo INGEST_RUN=alive pid=$(cat /tmp/sf-ingest-run.pid)
          else
            echo INGEST_RUN=not_running
            exit 1
          fi
          echo "=== scrubbed stub classify ==="
          export PYTHONUNBUFFERED=1
          "$APP/.venv/bin/python" -u - <<'PY'
          import sys
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.topics import (
              classify_stream_targets,
              classify_topics,
              strip_callsign_header,
          )

          wires = (
              "укх р/м нв невідома частина\n"
              "КОП\n"
              "ТУМАН, ДРОН, ЯНДЕКС\n"
              "=\n"
              "ТУМАН: дроти на вулиці, ремонт лінії\n"
              "ЯНДЕКС: прийняв"
          )
          stripped = strip_callsign_header(wires)
          assert "ДРОН" not in stripped, stripped
          assert "дроти" in stripped, stripped
          targets = classify_stream_targets(wires, units=[])
          print("wires_targets=", sorted(targets), flush=True)
          assert targets == frozenset(), targets

          air_body = (
              "укх р/м нв\n"
              "КОП\n"
              "ТУМАН, ДРОН, ЯНДЕКС\n"
              "=\n"
              "ТУМАН: вылет на маршрут, прозумируй район"
          )
          air_t = classify_stream_targets(air_body, units=[])
          print("vylet_targets=", sorted(air_t), flush=True)
          assert air_t == frozenset({"air"}), air_t

          assert "air" in classify_topics("ворожий дрон над позицією")
          print("VERIFY_OK", flush=True)
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
