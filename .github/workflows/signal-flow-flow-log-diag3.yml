name: Signal Flow flow-log diag3 (Contabo)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 488 around 17:18Z + group_error
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          PYTHONPATH=/opt/signal-flow/app /opt/signal-flow/app/.venv/bin/python - <<'PY'
          import json, re
          from pathlib import Path
          from collections import Counter
          import sys
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.ingest import resolve_ingest_user
          from sf.paths import user_dir
          root = Path("/opt/signal-flow")
          sid, _ = resolve_ingest_user(root, "self")
          log = user_dir(root, sid) / "data" / "flow-log" / "2026-09-25.jsonl"
          rows=[]
          with log.open(encoding="utf-8", errors="replace") as fh:
              for line in fh:
                  line=line.strip()
                  if not line: continue
                  try: rows.append(json.loads(line))
                  except: pass
          # overall group_targets presence
          gt=sum(1 for r in rows if r.get("group_targets"))
          sk=sum(1 for r in rows if r.get("skipped_sinks"))
          print("total", len(rows), "with_group_targets", gt, "with_skipped", sk)
          # 488 with logged_at hour buckets
          hours=Counter(); window=[]
          for r in rows:
              rs=r.get("reasons") or []
              if not any("488" in str(x) for x in rs):
                  continue
              la=str(r.get("logged_at") or "")
              hour=la[11:13] if len(la)>=13 else "?"
              hours[hour]+=1
              # window 16:00-18:00Z covers 19-21 Kyiv
              if la.startswith("2026-09-25T16:") or la.startswith("2026-09-25T17:") or la.startswith("2026-09-25T15:"):
                  meta={k:r.get(k) for k in ("logged_at","reasons","group_targets","skipped_sinks","fingerprint_prefix","dedup_fingerprint","source_key") if k in r or r.get(k) is not None}
                  # always include keys even if missing
                  meta={
                    "logged_at": r.get("logged_at"),
                    "reasons": r.get("reasons"),
                    "group_targets": r.get("group_targets"),
                    "skipped_sinks": r.get("skipped_sinks"),
                    "fp": r.get("fingerprint_prefix"),
                    "dedup_fp": r.get("dedup_fingerprint"),
                    "source": re.sub(r".{8}$", "…", str(r.get("source_key") or "")[:24]),
                  }
                  window.append(meta)
          print("488_by_hour_utc", dict(sorted(hours.items())))
          print("488_in_15_17Z_utc", len(window))
          # summarize window
          w_gt=sum(1 for m in window if m.get("group_targets"))
          w_sk=sum(1 for m in window if m.get("skipped_sinks"))
          print("window_with_targets", w_gt, "window_skipped", w_sk)
          print("=== window rows (no bodies) ===")
          for m in window[-25:]:
              print(m)
          # group_targets value counts overall today for 488
          tgt=Counter(); 
          for r in rows:
              rs=r.get("reasons") or []
              if not any("488" in str(x) for x in rs):
                  continue
              for t in (r.get("group_targets") or []):
                  tgt[str(t)]+=1
          print("488_group_targets_values", dict(tgt))
          # ingest details with group_error
          p=Path("/tmp/sf-ingest-run.log")
          if p.is_file():
              text=p.read_text(errors="replace")
              lines=text.splitlines()
              print("=== group_error / group_sent lines last 40 ===")
              interesting=[ln for ln in lines if "group_error" in ln or "group_sent:" in ln or "fp_suppress" in ln or "stream" in ln.lower()]
              for ln in interesting[-40:]:
                  ln=re.sub(r"\+?\d{8,15}","[redacted]",ln)
                  if "sgnl://" in ln: continue
                  print(ln[:260])
              # also last 5 full cycle lines that have group_failed>0
              print("=== cycles with group_failed>0 last 15 ===")
              for ln in lines:
                  if "group_failed=" in ln:
                      m=re.search(r"group_failed=(\d+)", ln)
                      if m and int(m.group(1))>0:
                          keep=ln
              # collect
              fails=[]
              for ln in lines:
                  m=re.search(r"group_failed=(\d+)", ln)
                  if m and int(m.group(1))>0:
                      fails.append(re.sub(r"\+?\d{8,15}","[redacted]",ln)[:220])
              for ln in fails[-15:]:
                  print(ln)
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
