name: Signal Flow verify AIR radio keywords (Contabo)
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: verify
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 'bash -s' <<'REMOTE'
          set -euo pipefail
          PYTHONPATH=/opt/signal-flow/app /opt/signal-flow/app/.venv/bin/python - <<'PY'
          import sys
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.topics import classify_stream_targets, classify_topics, _AIR_PATTERNS
          from sf.units import extract_units
          print("has_vylet", any("вылет" in p for p in _AIR_PATTERNS))
          print("has_zumir", any("зумир" in p for p in _AIR_PATTERNS))
          body = (
            "укх р/м 1 мсб 254 мсп 144 мсд 20 ЗА\n"
            "сбоку вылети; прозумируй; следующим полетом досмотри"
          )
          u = extract_units(body)
          print("units_ok", "254 мсп" in u)
          print("targets", sorted(classify_stream_targets(body, units=u)))
          print("politics", sorted(classify_topics("обговорення політики бригади")))
          PY
          # ingest alive?
          PIDFILE=/tmp/sf-ingest-run.pid
          if [ -f "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
            echo INGEST=alive
          else
            echo INGEST=dead
          fi
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
