name: Signal Flow group-send-probe (Contabo)

# Ops: one scrubbed send -g to enabled stream sink. Does NOT pkill signal-cli / ingest.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "stream target key (default|arta|air)"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - arta
          - air

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe group send on Contabo
        env:
          SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST_KEY: ${{ secrets.HERMES_HOST_KEY }}
          TARGET: ${{ inputs.target || 'default' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 root@5.189.159.195 \
            "TARGET=$(printf %q "$TARGET") bash -s" <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, "/opt/signal-flow/app")
          from sf.delivery import send_to_group
          from sf.bot_link import BotLinkError
          from sf.stream import TARGET_KEYS, load_stream_state, short_group_id

          root = Path("/opt/signal-flow")
          target = os.environ.get("TARGET", "default").strip() or "default"
          if target not in TARGET_KEYS:
              print("bad_target", target)
              raise SystemExit(2)

          # Canonical path: bot-signal/stream.json (NOT users/*/flows/*/stream.json)
          sp = root / "bot-signal" / "stream.json"
          print("stream_file", sp.as_posix(), "exists", sp.is_file())
          st = load_stream_state(root)
          sinks = {}
          for key in TARGET_KEYS:
              t = st["targets"][key]
              if bool(t.get("enabled")) and str(t.get("group_id") or "").strip():
                  sinks[key] = t
          print("enabled_sinks", sorted(sinks.keys()))
          if target not in sinks:
              print("missing_target", target)
              raise SystemExit(2)
          dest = sinks[target]
          gid = dest["group_id"]
          gname = dest.get("group_name") or "?"
          print(
              "target", target,
              "group_name", re.sub(r"\+?\d{8,15}", "[redacted]", str(gname)),
              "id_short", short_group_id(gid),
              "gid_len", len(gid),
          )
          body = f"Signal Flow smoke {target}"
          try:
              res = send_to_group(root, gid, body)
              print("ok", res.ok, "detail", re.sub(r"\+?\d{8,15}", "[redacted]", str(res.detail))[:240])
          except BotLinkError as exc:
              print("exc", re.sub(r"\+?\d{8,15}", "[redacted]", str(exc))[:240])
              raise SystemExit(3)
          except Exception as exc:
              print("exc", type(exc).__name__, re.sub(r"\+?\d{8,15}", "[redacted]", str(exc))[:240])
              raise SystemExit(4)
          PY
          REMOTE
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
